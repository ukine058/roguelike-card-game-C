/* ============================= RELICS ============================= */

const RELIC_TIMINGS = [
  {key:'onPickup', label:'即時（入手時。カードと自分への効果のみ・1回だけ）'},
  {key:'combatStart', label:'戦闘開始時'},
  {key:'turnStart', label:'ターン開始時'},
  {key:'combatEnd', label:'戦闘終了時'},
  {key:'onTagCardUsed', label:'指定タグのカード使用時'},
];
// Meta fields that aren't part of a card's own effect vocabulary — they only make
// sense as a one-time acquisition bonus (onPickup), except goldBonus which also
// works as a recurring "gain gold on victory" combat-end effect.
const RELIC_META_FIELDS = [
  {key:'maxHpBonus', label:'最大HP+（永続、即時回復も含む）', max:99, desc:(v)=>`最大HP+${v}`},
  {key:'goldBonus', label:'ゴールド+', max:999, desc:(v)=>`ゴールド+${v}`},
  {key:'extraEnergy', label:'毎ターンのエネルギー+（永続）', max:9, desc:(v)=>`毎ターンのエネルギー+${v}`},
  {key:'extraDraw', label:'毎ターンのドロー+（永続）', max:9, desc:(v)=>`毎ターンのドロー+${v}`},
  {key:'extraRewardChoices', label:'カード報酬の選択肢+（永続）', max:5, desc:(v)=>`カード報酬の選択肢+${v}`},
  {key:'rerollTokens', label:'リロールトークン+', max:20, desc:(v)=>`リロールトークン+${v}`},
];
// Which effect fields make sense for a given relic timing. onPickup fires once, outside
// any particular combat, and only ever affects the player themself or their deck — never
// the enemy — so every enemy-targeting / combat-only field is excluded there. The
// recurring timings (every combat start/turn start/tag-use, and combat end) share the
// full card effect vocabulary instead, minus the "permanent" stat fields (since firing
// those every single combat or every single turn would spiral out of control).
function relicFieldDefsFor(timing){
  if(timing==='onPickup'){
    // カスタム状態は、手に入れた後の「次の戦闘の開始時」に付与される（戦闘外では付与できないため）。
    const allowed = ['permStrength','permDexterity','permMetallicize','permThorns','heal'];
    const pickupStatusDefs = customStatusFieldDefs().map(d=>({...d, label:'次の戦闘の開始時: '+d.label, desc:(v)=>'次の戦闘の開始時に'+d.desc(v)}));
    return [...EFFECT_FIELD_DEFS.filter(d=>allowed.includes(d.key)), ...pickupStatusDefs, ...RELIC_META_FIELDS];
  }
  if(timing==='combatEnd') return combatEndFieldDefs();
  // Recurring timings: the full card vocabulary, plus permanent gains (permanent stats,
  // max HP, energy/draw, ...). Permanent gains add up every time the relic fires.
  return [...allEffectFieldDefs(), ...RELIC_META_FIELDS];
}
// At combat end the enemy is already dead, so damage/block/draw make no sense. What does
// make sense: permanent gains, healing, and buffs/debuffs that are carried over to the
// start of the NEXT battle (statuses are otherwise reset at the start of every battle).
const CE_STATUS_MAP = {
  strength:['p','strength'], dexterity:['p','dexterity'], metallicize:['p','metallicize'], thorns:['p','thorns'], regen:['p','regen'],
  selfWeak:['p','weak'], selfVulnerable:['p','vulnerable'], selfPoison:['p','poison'],
  weak:['e','weak'], vulnerable:['e','vulnerable'], poison:['e','poison'], stun:['e','stun'],
};
const CE_DIRECT_KEYS = ['permStrength','permDexterity','permMetallicize','permThorns','heal','loseHp'];
function combatEndFieldDefs(){
  const tidy = str=> str.replace(/（この戦闘中のみ[^）]*）/,'');
  const out = [];
  allEffectFieldDefs().forEach(d=>{
    if(d.key==='loseHp') out.push({...d, label:'自分へのダメージ（代償。HPは1未満にならない）'});
    else if(CE_DIRECT_KEYS.includes(d.key)) out.push(d);
    else if(CE_STATUS_MAP[d.key] || d._statusId){
      out.push({...d, label:'次の戦闘: '+tidy(d.label), desc:(v)=>'次の戦闘の開始時に'+tidy(d.desc(v))});
    }
  });
  return out.concat(RELIC_META_FIELDS);
}
function relicTimingHint(t){
  if(t==='onPickup') return 'カスタム状態は、手に入れたあと最初の戦闘の開始時に付与されます（状態の「標準の付与先」が「相手」なら敵に付与）。';
  if(t==='combatEnd') return '「次の戦闘」の項目は、次の戦闘の開始時にだけ反映されます。永続の強化・最大HP・ゴールドなどは、発動のたびに加算されます。';
  return '永続の強化・最大HPなどは、発動のたびに加算されます（ターン開始時などに設定すると急速に大きくなります）。エネルギー・ドローの永続増加は、発動した戦闘中にもすぐ反映されます。';
}

/* ============================= レリックの使える回数・所持中の効果 ============================= */
const RELIC_SCOPE_LABELS = {run:'戻らない（探索全体で合計）', round:'ラウンドの開始時に戻る', battle:'戦闘の開始時に戻る'};
// 所持している間ずっと働く効果（発動のタイミングは関係ない）。数値が0より大きいと有効
const RELIC_PASSIVE_FIELDS = [
  {key:'mapFree', label:'マップ: つながっていないマスも選べる（1で有効）', max:1, desc:()=>'マップで、つながっていないマスも選べる'},
  {key:'revealUnknown', label:'マップ: ？のマスの中身が分かる（1で有効）', max:1, desc:()=>'マップの「？」の中身が分かる'},
  {key:'rewardUpgradePct', label:'カード報酬: 強化済みで出る確率(%)', max:100, desc:v=>`カード報酬が、${v}%の確率で強化済みになる`},
  {key:'shopDiscountPct', label:'ショップ: カード・レリックの割引(%)', max:100, desc:v=>`ショップのカード・レリックが${v}%引き`},
  {key:'shopServiceDiscountPct', label:'ショップ: 入れ替え・除去・強化の割引(%)', max:100, desc:v=>`ショップの入れ替え・除去・強化が${v}%引き`},
  {key:'shopExtraCards', label:'ショップ: カードの品揃え+', max:12, desc:v=>`ショップのカードの品揃え+${v}`},
  {key:'shopExtraRelics', label:'ショップ: レリックの品揃え+', max:6, desc:v=>`ショップのレリックの品揃え+${v}`},
];
function relicUseState(r, rel){ return ((r.relicUses||{})[rel.id]) || {run:0, round:0, battle:0}; }
function relicUsable(r, rel){ return !(rel.useLimit>0) || relicUseState(r, rel)[rel.useScope||'run'] < rel.useLimit; }
function relicConsume(r, rel){
  const u = r.relicUses = r.relicUses || {};
  const o = u[rel.id] = u[rel.id] || {run:0, round:0, battle:0};
  o.run++; o.round++; o.battle++;
}
function relicResetUses(r, scope){ Object.values(r.relicUses||{}).forEach(o=>{ o[scope] = 0; }); }
function ownedRelicsWith(r, keys){
  return ((r.player && r.player.relics) || []).map(id=>S.relics.find(x=>x.id===id))
    .filter(rel=> rel && relicUsable(r, rel) && keys.some(k=> (Number((rel.effect||{})[k])||0) > 0));
}
// 使える回数が残っているレリックの、効果の合計（確認だけ。回数は消費しない）
function relicPassive(r, key){ return ownedRelicsWith(r, [key]).reduce((a,rel)=> a + (Number(rel.effect[key])||0), 0); }
// 効果を使う: 該当するレリックの使える回数を1ずつ消費して、効果の合計を返す
function relicUsePassive(r, keys){
  const sums = {}; keys.forEach(k=>{ sums[k] = 0; });
  ownedRelicsWith(r, keys).forEach(rel=>{ keys.forEach(k=>{ sums[k] += Number(rel.effect[k])||0; }); relicConsume(r, rel); });
  return sums;
}
function relicPassiveText(relic){
  const e = relic.effect || {};
  const parts = RELIC_PASSIVE_FIELDS.filter(f=> (Number(e[f.key])||0) > 0).map(f=> f.desc(Number(e[f.key])));
  return parts.length ? `所持中: ${parts.join('。')}。` : '';
}
function relicLimitText(relic){
  if(!(relic.useLimit>0)) return '';
  const r = S.run, sc = relic.useScope||'run';
  const owned = !!(r && r.player && (r.player.relics||[]).includes(relic.id));
  const left = owned ? Math.max(0, relic.useLimit - relicUseState(r, relic)[sc]) : null;
  const back = sc==='round' ? '、ラウンドの開始時に戻る' : (sc==='battle' ? '、戦闘の開始時に戻る' : '');
  return `（発動ごとに回数を消費: ${relic.useLimit}回${back}${owned ? (left>0 ? `・残り${left}回` : '・使い切り') : ''}）`;
}

function relicDescription(relic){
  const timing = relic.timing || 'onPickup';
  const e = relic.effect || {};
  const defs = relicFieldDefsFor(timing);
  const parts = [];
  defs.forEach(def=>{
    const v = e[def.key]||0;
    if(v>0) parts.push(def.desc(v));
  });
  const timingLabel = (RELIC_TIMINGS.find(t=>t.key===timing)||{}).label || timing;
  const main = parts.length ? parts.join('。')+'。' : '';
  // Favoured-tag bonus works for as long as the relic is owned, whatever its timing.
  const favor = (relic.favorTag && relic.favorPct>0) ? `${tagCondText(relic.favorTag, relic.favorTagMode)}カードの出現率+${relic.favorPct}%（所持中ずっと）。` : '';
  const useNames = ((timing==='combatStart'||timing==='turnStart') ? (relic.useCardIds||[]) : []).map(id=>{ const cc = cardById(id); return cc ? `「${cc.name}」` : ''; }).filter(Boolean);
  const useText = useNames.length ? `カード${useNames.join('')}をコストなしで使用。` : '';
  const pText = relicPassiveText(relic), lim = relicLimitText(relic);
  if(!main && !favor && !useText && !pText) return '効果なし';
  if(timing==='onPickup' || (!main && !useText)) return main + pText + favor + lim;
  const tagPart = timing==='onTagCardUsed' ? (()=>{ const w = tagListOf(relic.triggerTag); return w.length>1 ? tagCondText(relic.triggerTag, relic.triggerTagMode)+'カードを使うたび、' : (w.length ? `[${w[0]}]の` : 'どの'); })() : (timing==='turnStart' ? relicTurnText(relic) : '');
  return `【${timingLabel}】${tagPart}${main}${useText}${pText}${favor}${lim}`;
}

// Applies a relic's own timed effect once. Shares EFFECT_FIELD_DEFS with cards via
// applyEffectValues, plus the relic-only meta fields (max HP/gold/energy/draw) which
// only ever apply at onPickup (goldBonus also applies at combatEnd).
function fireRelicTiming(r, timing, playedCard){
  if(!r.player.relics || r.player.relics.length===0) return;
  r.player.relics.forEach(relicId=>{
    const relic = S.relics.find(x=>x.id===relicId);
    if(!relic || (relic.timing||'onPickup')!==timing) return;
    if(!relicUsable(r, relic)) return;   // 使える回数の上限に達している
    if(timing==='turnStart' && !relicTurnOk(relic, r.turnNo||0)) return;
    if(timing==='onTagCardUsed'){
      const tagOk = cardMatchesTags(playedCard, relic.triggerTag, relic.triggerTagMode);
      if(!tagOk) return;
    }
    relicConsume(r, relic);
    const e = relic.effect || {};
    if(timing==='combatEnd'){ applyCombatEndRelic(r, relic, e); return; }
    applyRelicMeta(r, relic, e, 'battle');
    applyEffectValues(r, {name: relic.name, ...e});
  });
  if(timing!=='combatEnd') firePileTriggers(r, ()=>{});
}

// Permanent, non-card gains shared by every timing. mode: 'pickup' (silent, outside combat),
// 'battle' (mid-combat: energy/draw also take effect immediately), 'end' (combat over).
function applyRelicMeta(r, relic, e, mode){
  const p = r.player;
  const L = str=>{ if(mode!=='pickup') pushLog(`${relic.name}: ${str}`); };
  if(e.maxHpBonus){ p.maxHp += e.maxHpBonus; p.hp = Math.min(p.maxHp, p.hp + e.maxHpBonus); L(`最大HP+${e.maxHpBonus}。`); }
  if(e.goldBonus){ p.gold += e.goldBonus; L(`ゴールド+${e.goldBonus}。`); }
  if(e.extraEnergy){
    p.extraEnergy = (p.extraEnergy||0) + e.extraEnergy;
    if(mode==='battle') p.energy += e.extraEnergy;
    L(`毎ターンのエネルギー+${e.extraEnergy}（永続）。`);
  }
  if(e.extraDraw){
    p.extraDraw = (p.extraDraw||0) + e.extraDraw;
    L(`毎ターンのドロー+${e.extraDraw}（永続）。`);
    if(mode==='battle') notePileEvent(r, 'drawn', drawCards(e.extraDraw));
  }
  if(e.extraRewardChoices){ p.extraRewardChoices = (p.extraRewardChoices||0) + e.extraRewardChoices; L(`カード報酬の選択肢+${e.extraRewardChoices}。`); }
  if(e.rerollTokens){ p.rerollTokens = (p.rerollTokens||0) + e.rerollTokens; L(`リロールトークン+${e.rerollTokens}。`); }
}

function queueNextCombat(r, side, key, amt){
  const nc = r.nextCombat = r.nextCombat || {p:{}, e:{}, cp:{}, ce:{}};
  nc[side][key] = (nc[side][key]||0) + amt;
}
const RELIC_TURN_CONDS = [
  {key:'always', label:'毎ターン'},
  {key:'eq', label:'N回目のターンだけ（例: 3なら、3ターン目の開始時だけ）'},
  {key:'gte', label:'N回目のターン以降は毎ターン'},
  {key:'every', label:'Nターンごと（N回目、2N回目、3N回目…。Nが1なら毎ターン）'},
];
// そのターン（戦闘内のターン数 turnNo）に、ターン開始時のレリックが発動するか
function relicTurnOk(relic, turnNo){
  const n = Math.max(1, relic.turnN|0 || 1);
  switch(relic.turnCond){
    case 'eq': return turnNo===n;
    case 'gte': return turnNo>=n;
    case 'every': return turnNo>0 && turnNo%n===0;
    default: return true;
  }
}
function relicTurnText(relic){
  const n = Math.max(1, relic.turnN|0 || 1);
  switch(relic.turnCond){
    case 'eq': return `${n}ターン目の`;
    case 'gte': return `${n}ターン目以降の毎`;
    case 'every': return n===1 ? '毎' : `${n}ターンごとの`;
    default: return '';
  }
}
// ターン開始時のレリックが使うカード。そのターンの条件に合うときだけ、状態のカード操作と同じ時点で使用する
function queueRelicTurnCards(r){
  (r.player.relics||[]).forEach(id=>{
    const relic = S.relics.find(x=>x.id===id);
    if(!relic || (relic.timing||'onPickup')!=='turnStart' || !relicUsable(r, relic) || !relicTurnOk(relic, r.turnNo||0)) return;
    (relic.useCardIds||[]).forEach(cid=>{
      if(cardById(cid)) queueTurnStartOp(r, {enabled:true, type:'useCardById', cardId:cid}, relic.name);
    });
  });
}
function queueRelicStartCards(r){
  (r.player.relics||[]).forEach(id=>{
    const relic = S.relics.find(x=>x.id===id);
    if(!relic || (relic.timing||'onPickup')!=='combatStart' || !relicUsable(r, relic)) return;
    (relic.useCardIds||[]).forEach(cid=>{
      if(cardById(cid)) queueTurnStartOp(r, {enabled:true, type:'useCardById', cardId:cid}, relic.name);
    });
  });
}
function applyCombatEndRelic(r, relic, e){
  const p = r.player;
  const L = str=> pushLog(`${relic.name}: ${str}`);
  applyRelicMeta(r, relic, e, 'end');
  ['permStrength','permDexterity','permMetallicize','permThorns'].forEach(k=>{
    if(e[k]>0){
      p[k] = (p[k]||0) + e[k];
      L(EFFECT_FIELD_DEFS.find(d=>d.key===k).desc(e[k])+'。');
    }
  });
  if(e.heal>0){ p.hp = Math.min(p.maxHp, p.hp + e.heal); L(`HPを${e.heal}回復。`); }
  if(e.loseHp>0){ p.hp = Math.max(1, p.hp - e.loseHp); L(`自分に${e.loseHp}ダメージ。`); }
  Object.keys(CE_STATUS_MAP).forEach(k=>{
    if(e[k]>0){
      const [side, field] = CE_STATUS_MAP[k];
      queueNextCombat(r, side, field, e[k]);
      const def = EFFECT_FIELD_DEFS.find(d=>d.key===k);
      L(`次の戦闘の開始時に${def.desc(e[k]).replace(/（この戦闘中のみ[^）]*）/,'')}。`);
    }
  });
  customStatusFieldDefs().forEach(def=>{
    const amt = e[def.key];
    if(!(amt>0)) return;
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId);
    if(!st) return;
    queueNextCombat(r, st.target==='opponent' ? 'ce' : 'cp', st.id, amt);
    L(`次の戦闘の開始時に${def.desc(amt)}。`);
  });
}

function applyRelicEffect(r, relic){
  r.player.relics.push(relic.id);
  if((relic.timing||'onPickup') !== 'onPickup') return; // recurring relics fire later, from fireRelicTiming
  const e = relic.effect || {};
  applyRelicMeta(r, relic, e, 'pickup');
  const eMain = {...e};
  customStatusFieldDefs().forEach(def=>{ delete eMain[def.key]; });   // 状態は、次の戦闘の開始時に付与する
  applyEffectValues(r, {name: relic.name, ...eMain});
  customStatusFieldDefs().forEach(def=>{
    const amt = e[def.key];
    if(!(amt>0)) return;
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId);
    if(st) queueNextCombat(r, st.target==='opponent' ? 'ce' : 'cp', st.id, amt);
  });
}

/* ============================= EVENTS (data-driven) ============================= */
// Events are stored as data (S.events) and edited from the home screen. Each event has a
// number of choice "slots" (1-3) and a pool of candidate choices; when the event shows up,
// the slots are filled from the pool. Every choice carries a list of effects that run in
// order, so good and bad effects can be bundled freely.

const EV_RARITY_OPTIONS = [
  {key:'any', label:'指定なし'}, {key:'basic', label:'ベーシック'}, {key:'common', label:'コモン'},
  {key:'uncommon', label:'アンコモン'}, {key:'rare', label:'レア'}, {key:'uncommon+', label:'アンコモン以上'},
  {key:'generated', label:'生成専用'}, {key:'enemy', label:'敵専用'},
];
function evSgn(a){ return (a>0?'+':'')+a; }
function evRarityOk(rarity, want, forGain){
  if(!want || want==='any') return forGain ? (rarity!=='basic' && rarity!=='generated' && rarity!=='enemy') : true;
  if(want==='uncommon+') return rarity==='uncommon' || rarity==='rare';
  return rarity===want;
}

function newEventEffect(kind){
  if(EV_NUM[kind]) return {kind, amount: (kind==='hp'||kind==='gold') ? 10 : 1};

/* ---------- normalize (also used for import) ---------- */
function normalizeEventEffect(x){
  if(!x || typeof x!=='object' || !evKindValid(x.kind)) return null;
  const k = x.kind;
  const str = v=> typeof v==='string' ? v.trim() : '';
  const rar = v=> EV_RARITY_OPTIONS.some(o=>o.key===v) ? v : 'any';
  if(EV_NUM[k]){ const s = !!EV_NUM[k].signed; return {kind:k, amount: clampInt(x.amount, s?-999:0, 999, s?0:1)}; }
  if(k==='nextCustom') return {kind:k, statusId:str(x.statusId), amount:clampInt(x.amount,0,999,1)};
  if(k==='gainCard') return {kind:k, source:x.source==='specific'?'specific':'random', cardId:str(x.cardId), rarity:rar(x.rarity), tag:cleanTagList(x.tag), tagMode:cleanTagMode(x.tagMode), count:clampInt(x.count,1,20,1)};
  if(k==='gainRelic') return {kind:k, source:x.source==='specific'?'specific':'random', relicId:str(x.relicId), rarity:rar(x.rarity)};
  return {kind:k, mode:x.mode==='choose'?'choose':'random', rarity:rar(x.rarity), tag:cleanTagList(x.tag), tagMode:cleanTagMode(x.tagMode), count:clampInt(x.count,1,20,1)};
}
function normalizeEvent(ev){
  const e = {...ev};
  e.title = (typeof ev.title==='string' && ev.title.trim()) ? ev.title.trim() : '無題のイベント';
  e.desc = typeof ev.desc==='string' ? ev.desc : '';
  e.image = cleanImage(ev.image);
  e.slots = clampInt(ev.slots,1,3,2);
  e.weight = clampInt(ev.weight,1,20,1);
  e.choices = (Array.isArray(ev.choices) ? ev.choices : []).filter(c=>c && typeof c==='object').map(c=>({
    label: (typeof c.label==='string' && c.label.trim()) ? c.label.trim() : '先へ進む',
    result: typeof c.result==='string' ? c.result : '',
    hideEffects: !!c.hideEffects,
    always: !!c.always,
    effects: (Array.isArray(c.effects) ? c.effects : []).map(normalizeEventEffect).filter(Boolean),
    // 確率で分岐する結果。chance は重み（合計に対する割合で確率が決まる）
    outcomes: (Array.isArray(c.outcomes) ? c.outcomes : []).filter(o=>o && typeof o==='object').map(o=>({
      chance: clampInt(o.chance,1,1000,1),
      result: typeof o.result==='string' ? o.result : '',
      effects: (Array.isArray(o.effects) ? o.effects : []).map(normalizeEventEffect).filter(Boolean),
    })),
  }));
  if(e.choices.length===0) e.choices = [newEventChoice('先へ進む')];
  return e;
}

/* ---------- text describing an effect ---------- */
function evFilterText(eff, forGain){
  // 「レア[A]の」「[A・B]のいずれかの」「[A・B]すべてを持つ」のように、そのあとに「カード」が続く形で返す（指定がなければ ''）
  const r = (eff.rarity && eff.rarity!=='any') ? evRarityLabel(eff.rarity) : '';
  const tg = tagCondText(eff.tag, eff.tagMode);
  return tg ? r + tg : (r ? r + 'の' : '');
}
function eventEffectText(eff){
  const k = eff.kind;
  if(EV_NUM[k]) return EV_NUM[k].text(eff.amount|0);
  const cnt = (eff.count|0) || 1;
  const f = evFilterText(eff);
  const how = eff.mode==='choose' ? '選択' : 'ランダム';
  if(k==='nextCustom'){
    const st = (S.customStatuses||[]).find(x=>x.id===eff.statusId);
    if(!st) return '（存在しないカスタム状態）';
    return `${st.emoji||''}${st.name}${eff.amount|0}（次の戦闘のみ・${st.target==='opponent'?'敵に':'自分に'}）`;
  }
  if(k==='gainCard'){
    if(eff.source==='specific'){
      const c = S.cards.find(x=>x.id===eff.cardId);
      return `カード「${c?c.name:'？'}」を${cnt}枚入手`;
    }
    return `${f}ランダムなカードを${cnt}枚入手`;
  }
  if(k==='removeCard') return `${f}カードを${cnt}枚失う（${how}）`;
  if(k==='upgradeCard') return `${f}カードを${cnt}枚強化（${how}）`;
  if(k==='duplicateCard') return `${f}カードを${cnt}枚複製（${how}）`;
  if(k==='gainRelic'){
    if(eff.source==='specific'){
      const rel = S.relics.find(x=>x.id===eff.relicId);
      return `レリック「${rel?rel.name:'？'}」を入手`;
    }
    return `${eff.rarity&&eff.rarity!=='any' ? evRarityLabel(eff.rarity)+'の' : ''}ランダムなレリックを入手`;
  }
  return '';
}
function eventOutcomesText(ch){
  const outs = ch.outcomes||[];
  if(!outs.length) return '';
  const total = outs.reduce((sum,o)=> sum + Math.max(1,o.chance|0), 0);
  return '確率 ' + outs.map(o=>{
    const pct = Math.round(Math.max(1,o.chance|0)/total*100);
    const fx = (o.effects||[]).map(eventEffectText).join('・');
    return `${pct}%：${fx||'何も起こらない'}`;
  }).join(' ／ ');
}
function eventChoiceGoldNeed(ch){
  return (ch.effects||[]).reduce((s,e)=> (e.kind==='gold' && (e.amount|0)<0) ? s-(e.amount|0) : s, 0);
}

/* ---------- running an event ---------- */
function pickEventForRun(){
  const valid = (S.events||[]).filter(ev=>ev && Array.isArray(ev.choices) && ev.choices.length);
  const pool = valid.length ? valid : DEFAULT_EVENTS;
  const total = pool.reduce((s,ev)=> s + (ev.weight||1), 0);
  let x = Math.random()*total, ev = pool[pool.length-1];
  for(const cand of pool){ x -= (cand.weight||1); if(x<=0){ ev = cand; break; } }
  const slots = clampInt(ev.slots,1,3,2);
  const idxs = ev.choices.map((c,i)=>i);
  const always = idxs.filter(i=>ev.choices[i].always).slice(0,slots);
  const rest = shuffle(idxs.filter(i=>!always.includes(i)));
  const picked = always.concat(rest.slice(0, slots-always.length)).sort((a,b)=>a-b);
  return {
    id: ev.id, title: ev.title, desc: ev.desc||'', image: ev.image||'',
    choices: picked.map(i=> JSON.parse(JSON.stringify(ev.choices[i]))),
  };
}

function eventDeckCandidates(r, eff){
  return ownedCardInstances(r).filter(x=>{
    const {iid} = splitInstanceId(x.cid);
    if(iid && r.temporaryCardIids && r.temporaryCardIids[iid]) return false;
    const c = cardById(x.cid);
    if(!c) return false;
    if(!evRarityOk(c.rarity, eff.rarity, false)) return false;
    if(!cardMatchesTags(c, eff.tag, eff.tagMode)) return false;
    if(eff.kind==='upgradeCard' && isUpgradedInstanceId(x.cid)) return false;
    return true;
  });
}
function eventDeckOpApply(r, eff, chosen){
  const L = s=> r.eventLog.push(s);
  if(!chosen.length){ L('対象となるカードがなかった。'); return; }
  const names = chosen.map(x=> cardById(x.cid).name);
  if(eff.kind==='removeCard'){
    const byPile = {};
    chosen.forEach(x=>{ (byPile[x.pile] = byPile[x.pile] || []).push(x.i); });
    Object.keys(byPile).forEach(p=> byPile[p].sort((a,b)=>b-a).forEach(i=> r[p].splice(i,1)));
    L(`失ったカード: ${names.join('、')}`);
  } else if(eff.kind==='upgradeCard'){
    chosen.forEach(x=>{ r[x.pile][x.i] = upgradeRawId(x.cid); });
    L(`強化: ${names.map(n=>`${n}→${n}+`).join('、')}`);
  } else if(eff.kind==='duplicateCard'){
    chosen.forEach(x=>{ r.discard.push(splitInstanceId(x.cid).cid); });
    L(`複製: ${names.join('、')}`);
  }
}

function applyEventEffect(r, eff){
  const p = r.player, k = eff.kind, a = eff.amount|0;
  const L = s=> r.eventLog.push(s);
  if(k==='hp'){
    const before = p.hp;
    p.hp = a>=0 ? Math.min(p.maxHp, p.hp + a) : Math.max(1, p.hp + a);
    const d = p.hp - before;
    L(d===0 ? (a<0 ? 'HPは1未満にならないため、変化しなかった。' : 'HPは既に最大だった。') : `HP${evSgn(d)}`);
  } else if(k==='maxHp'){
    p.maxHp = Math.max(1, p.maxHp + a);
    if(a>0) p.hp = Math.min(p.maxHp, p.hp + a); else p.hp = Math.min(p.hp, p.maxHp);
    L(`最大HP${evSgn(a)}`);
  } else if(k==='gold'){
    const before = p.gold;
    p.gold = Math.max(0, p.gold + a);
    L(`ゴールド${evSgn(p.gold - before)}`);
  } else if(['permStrength','permDexterity','permMetallicize','permThorns','extraRewardChoices','rerollTokens'].includes(k)){
    p[k] = (p[k]||0) + a;
    L(eventEffectText(eff));
  } else if(k==='extraEnergy'){
    p.extraEnergy = Math.max(1 - S.settings.energyPerTurn, (p.extraEnergy||0) + a);
    L(eventEffectText(eff));
  } else if(k==='extraDraw'){
    p.extraDraw = Math.max(1 - S.settings.handSize, (p.extraDraw||0) + a);
    L(eventEffectText(eff));
  } else if(EV_NEXT_PLAYER[k] || EV_NEXT_ENEMY[k] || k==='nextCustom'){
    if(a<=0) return;
    const nc = r.nextCombat = r.nextCombat || {p:{}, e:{}, cp:{}, ce:{}};
    if(EV_NEXT_PLAYER[k]){ const f = EV_NEXT_PLAYER[k]; nc.p[f] = (nc.p[f]||0) + a; }
    else if(EV_NEXT_ENEMY[k]){ const f = EV_NEXT_ENEMY[k]; nc.e[f] = (nc.e[f]||0) + a; }
    else {
      const st = (S.customStatuses||[]).find(x=>x.id===eff.statusId);
      if(!st) return;
      const bag = st.target==='opponent' ? nc.ce : nc.cp;
      bag[st.id] = (bag[st.id]||0) + a;
    }
    L(eventEffectText(eff));
  } else if(k==='gainCard'){
    const cnt = (eff.count|0) || 1;
    let pool;
    if(eff.source==='specific'){ const c = S.cards.find(x=>x.id===eff.cardId); pool = c ? [c] : []; }
    else pool = S.cards.filter(c=> evRarityOk(c.rarity, eff.rarity, true) && cardMatchesTags(c, eff.tag, eff.tagMode));
    if(!pool.length){ L('入手できるカードが見当たらなかった。'); return; }
    const got = [];
    for(let i=0;i<cnt;i++){ const c = pool[Math.floor(Math.random()*pool.length)]; r.discard.push(c.id); noteCardAcquired(r, c.id); got.push(c.name); }
    L(`入手したカード: ${got.join('、')}`);
  } else if(k==='gainRelic'){
    let relic = null;
    const owned = p.relics || [];
    if(eff.source==='specific'){
      relic = S.relics.find(x=>x.id===eff.relicId) || null;
      if(relic && owned.includes(relic.id)) relic = null;
    } else {
      const pool = S.relics.filter(x=> !owned.includes(x.id) && !isNonRewardRelic(x) && evRarityOk(x.rarity, eff.rarity, false));
      relic = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
    }
    if(!relic){ L('入手できるレリックがなかった。'); return; }
    applyRelicEffect(r, relic);
    L(`レリック入手: ${relic.name}（${relicDescription(relic)}）`);
  }
}

// Effects run one after another. A deck operation set to "choose" pauses the queue and
// shows a card picker; everything else resolves immediately.
function processEventQueue(){
  const r = S.run;
  while(r.eventQueue.length){
    const eff = r.eventQueue.shift();
    if(EV_DECK_OPS.includes(eff.kind)){
      const cands = eventDeckCandidates(r, eff);
      const cnt = Math.min((eff.count|0)||1, cands.length);
      if(cands.length===0){ r.eventLog.push('対象となるカードがなかった。'); continue; }
      if(eff.mode==='choose' && cands.length>cnt){
        r.eventPick = {eff, need:cnt, cands, selected:[]};
        renderEventPick();
        return;
      }
      eventDeckOpApply(r, eff, eff.mode==='choose' ? cands : shuffle(cands).slice(0,cnt));
      continue;
    }
    applyEventEffect(r, eff);
  }
  r.eventResult = {text: [(r.eventChoice && r.eventChoice.result) || '', r.eventOutcomeText || ''].filter(Boolean).join('\n\n'), lines: r.eventLog.slice()};
  r.eventOutcomeText = '';
  r.eventPick = null;
  renderEvent();
}

function applyNextCombatEffects(r){
  const nc = r.nextCombat;
  if(!nc) return;
  r.nextCombat = null;
  const p = r.player, e = r.enemy;
  Object.keys(nc.p||{}).forEach(f=>{ if(BUILTIN_FIELD_TAG[f]) grantBuiltin(p, f, nc.p[f]); else p[f] = (p[f]||0) + nc.p[f]; });
  Object.keys(nc.e||{}).forEach(f=>{ if(BUILTIN_FIELD_TAG[f]) grantBuiltin(e, f, nc.e[f]); else e[f] = (e[f]||0) + nc.e[f]; });
  Object.keys(nc.cp||{}).forEach(id=> grantCustomStatus(p, id, nc.cp[id]));
  Object.keys(nc.ce||{}).forEach(id=> grantCustomStatus(e, id, nc.ce[id]));
  pushLog('イベントの効果がこの戦闘に反映された。');
}

function renderEventPick(){
  const r = S.run, pk = r.eventPick, eff = pk.eff;
  const verb = {removeCard:'失う', upgradeCard:'強化する', duplicateCard:'複製する'}[eff.kind] || '選ぶ';
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">EVENT</p>
    <h2>${escapeHtml(r.currentEvent.title)}</h2>
    <p style="color:var(--parchment-dim); margin:10px 0;">${verb}カードを${pk.need}枚選んでください（${pk.selected.length} / ${pk.need}）</p>
    <div class="reward-row" id="ev-pick-row">
      ${pk.cands.map((x,i)=>{
        const c = cardById(x.cid);
        const on = pk.selected.includes(i);
        return `<div data-idx="${i}" style="cursor:pointer; ${on?'outline:3px solid var(--gold); border-radius:10px;':''}">${renderCardHTML(c,{mini:true})}</div>`;
      }).join('')}
    </div>
    <button class="primary" id="btn-ev-pick" ${pk.selected.length!==pk.need?'disabled':''}>決定</button>
  </div>`;
  qsa('#ev-pick-row > div').forEach(wrap=>{
    wrap.onclick = ()=>{
      const i = parseInt(wrap.dataset.idx,10);
      const pos = pk.selected.indexOf(i);
      if(pos>=0) pk.selected.splice(pos,1);

function renderEvent(){
  const r = S.run, p = r.player;
  if(!r.currentEvent){
    r.currentEvent = pickEventForRun();
    r.eventResult = null; r.eventLog = []; r.eventQueue = []; r.eventPick = null; r.eventChoice = null;
  }
  if(r.eventPick){ renderEventPick(); return; }
  const ev = r.currentEvent;
  const res = r.eventResult;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">EVENT</p>
    <h2>${escapeHtml(ev.title)}</h2>
    ${ev.image ? `<img class="ev-image" src="${ev.image}" alt="">` : ''}
    <p style="color:var(--parchment-dim); max-width:440px; margin:10px auto; white-space:pre-wrap;">${escapeHtml(ev.desc)}</p>
    <p style="font-size:13px; color:var(--gold);">HP ${p.hp} / ${p.maxHp} ・ 所持ゴールド: ${p.gold}</p>
    ${res ? `
      ${res.text ? `<p style="margin-top:20px; color:var(--parchment); white-space:pre-wrap;">${escapeHtml(res.text)}</p>` : ''}
      ${res.lines.length ? `<div class="ev-result-lines">${res.lines.map(l=>`<div>${escapeHtml(l)}</div>`).join('')}</div>` : ''}
      ${(!res.text && !res.lines.length) ? `<p style="margin-top:20px; color:var(--parchment);">何も起こらなかった。</p>` : ''}
      <div style="margin-top:22px;"><button class="primary" id="btn-event-continue">先へ進む</button></div>
    ` : `
      <div style="display:flex; flex-direction:column; gap:10px; max-width:420px; margin:24px auto 0;">
        ${ev.choices.map((c,i)=>{
          const need = eventChoiceGoldNeed(c);
          const short = need > p.gold;
          const fx = c.hideEffects ? '' : [(c.effects||[]).map(eventEffectText).join(' ／ '), eventOutcomesText(c)].filter(Boolean).join(' ／ ');
          return `<button class="ghost event-choice" data-idx="${i}" ${short?'disabled':''}>
            <span>${escapeHtml(c.label)}</span>
            ${fx || short ? `<span class="ev-fx">${escapeHtml(fx)}${short?`${fx?' ':''}（ゴールドが足りない）`:''}</span>` : ''}
          </button>`;
        }).join('')}
      </div>
    `}
  </div>`;
  if(!res){
    qsa('.event-choice').forEach(btn=>{
      btn.onclick = ()=>{
        const choice = ev.choices[parseInt(btn.dataset.idx,10)];
        r.eventChoice = choice;
        r.eventLog = [];
        r.eventQueue = (choice.effects||[]).map(x=>({...x}));
        r.eventOutcomeText = '';
        const outs = choice.outcomes||[];
        if(outs.length){
          let x = Math.random()*outs.reduce((sum,o)=> sum + Math.max(1,o.chance|0), 0);
          let hit = outs[outs.length-1];
          for(const o of outs){ x -= Math.max(1,o.chance|0); if(x<=0){ hit = o; break; } }
          r.eventOutcomeText = hit.result||'';
          r.eventQueue = r.eventQueue.concat((hit.effects||[]).map(x=>({...x})));
        }
        processEventQueue();
      };
    });
  } else {
    qs('#btn-event-continue').onclick = ()=>{
      r.currentEvent = null; r.eventResult = null; r.eventChoice = null; r.eventLog = []; r.eventQueue = [];
      advanceFloor();
    };
  }
}

function evFormSync(t){
  const f = t.dataset && t.dataset.f;
  if(!f) return;
  const d = evFormState.draft;
  let obj = d;
  if(t.dataset.ci!==undefined){
    obj = d.choices[parseInt(t.dataset.ci,10)];
    if(obj && t.dataset.oi!==undefined) obj = (obj.outcomes||[])[parseInt(t.dataset.oi,10)];
    if(obj && t.dataset.ei!==undefined) obj = obj.effects[parseInt(t.dataset.ei,10)];
  }
  if(!obj) return;
  if(t.type==='checkbox') obj[f] = t.checked;
  else if(t.dataset.num){ const v = parseInt(t.value,10); obj[f] = isNaN(v) ? 0 : v; }
  else obj[f] = t.value;
}
function evFormAct(b, root){
  const d = evFormState.draft;
  const act = b.dataset.act;
  const ci = b.dataset.ci!==undefined ? parseInt(b.dataset.ci,10) : -1;
  if(act==='cancel'){ renderEventEditor(); return; }
  if(act==='save'){
    const ev = normalizeEvent(d);
    if(evFormState.isNew) S.events.push(ev);
    else S.events = S.events.map(x=> x.id===ev.id ? ev : x);
    saveEvents(S.events);
    renderEventEditor();
    return;
  }
  if(act==='add-choice'){ d.choices.push(newEventChoice()); renderEventForm(); return; }
  if(act==='del-choice'){
    if(d.choices.length<=1){ alert('候補は最低1つ必要です。'); return; }
    d.choices.splice(ci,1); renderEventForm(); return;
  }
  if(act==='add-effect'){
    const sel = qs(`#ev-addk-${ci}`, root);
    d.choices[ci].effects.push(newEventEffect(sel.value));
    renderEventForm(); return;
  }
  if(act==='add-outcome'){
    const ch = d.choices[ci]; ch.outcomes = ch.outcomes||[];
    ch.outcomes.push({chance:1, result:'', effects:[]}); renderEventForm(); return;
  }
  if(act==='del-outcome'){ d.choices[ci].outcomes.splice(parseInt(b.dataset.oi,10),1); renderEventForm(); return; }
  if(act==='add-outcome-effect'){
    const oi = parseInt(b.dataset.oi,10);
    d.choices[ci].outcomes[oi].effects.push(newEventEffect(qs(`#ev-addk-${ci}-${oi}`, root).value));
    renderEventForm(); return;
  }
  if(act==='del-outcome-effect'){
    d.choices[ci].outcomes[parseInt(b.dataset.oi,10)].effects.splice(parseInt(b.dataset.ei,10),1);
    renderEventForm(); return;
  }
  if(act==='del-effect'){
    d.choices[ci].effects.splice(parseInt(b.dataset.ei,10),1);
    renderEventForm(); return;
  }
}

function shopPrice(rarity){
  const c = S.settings;
  return rarity==='rare' ? c.shopPriceRare : (rarity==='uncommon' ? c.shopPriceUncommon : c.shopPriceCommon);
}
// ショップのレリックの効果（店に入るとき1回だけ使う）
function shopRelicMods(r){
  const m = relicUsePassive(r, ['shopDiscountPct','shopServiceDiscountPct','shopExtraCards','shopExtraRelics']);
  return {disc:Math.min(100,m.shopDiscountPct), svc:Math.min(100,m.shopServiceDiscountPct), cards:m.shopExtraCards, relics:m.shopExtraRelics};
}
function shopPriceText(r, base){ const f = shopDiscounted(r, base); return f<base ? `<s style="opacity:.6;">${base}</s> ${f}G` : f+'G'; }
function shopDiscounted(r, price){ const d = (r.shopMods||{}).disc||0; return Math.max(0, Math.round(price*(1-d/100))); }
// 入れ替え・除去・強化の料金: (基本 + 値上がり × 使った回数) からレリックの割引を引く
function shopServiceCost(r, kind){
  const st = S.settings;
  const base = {reroll:st.rerollShopBase, remove:st.shopRemoveCost, upgrade:st.shopUpgradeCost}[kind];
  const step = {reroll:st.rerollShopStep, remove:st.shopRemoveStep||0, upgrade:st.shopUpgradeStep||0}[kind];
  const cnt = ((st.shopStepScope===1 ? r.shopCountsRun : r.shopCountsVisit)||{})[kind] || 0;
  const d = (r.shopMods||{}).svc || 0;
  return Math.max(0, Math.round((base + step*cnt) * (1 - d/100)));
}
function shopCountUse(r, kind){
  r.shopCountsRun = r.shopCountsRun || {}; r.shopCountsVisit = r.shopCountsVisit || {};
  r.shopCountsRun[kind] = (r.shopCountsRun[kind]||0) + 1; r.shopCountsVisit[kind] = (r.shopCountsVisit[kind]||0) + 1;
}
function shopModsNote(r){
  const m = r.shopMods || {}, p = [];
  if(m.disc) p.push(`商品${m.disc}%引き`); if(m.svc) p.push(`入れ替え・除去・強化${m.svc}%引き`);
  if(m.cards) p.push(`カード+${m.cards}`); if(m.relics) p.push(`レリック+${m.relics}`);
  return p.length ? `<p class="hint" style="color:var(--gold);">レリックの効果: ${p.join('・')}</p>` : '';
}

function renderShop(){
  const r = S.run;
  if(!r.shopOffers){
    r.shopMods = shopRelicMods(r); r.shopCountsVisit = {};
    r.shopOffers = generateShopOffers((S.settings.shopCardCount||3) + r.shopMods.cards);
    r.shopRerollCount = 0;
    r.shopRemoveMode = false;
    r.shopUpgradeMode = false;
    const availRelics = S.relics.filter(rel=>!r.player.relics.includes(rel.id) && !isNonRewardRelic(rel));
    r.shopRelics = shuffle(availRelics).slice(0, Math.max(0, (S.settings.shopRelicCount||0) + r.shopMods.relics))
      .map(rel=>({...rel, price: rel.shopPrice>0 ? rel.shopPrice : S.settings.shopRelicPrice, sold:false}));
  }
  const totalOwned = ownedCardInstances(r).length;
  const upgradeEligible = ownedCardInstances(r).filter(x=>!isUpgradedInstanceId(x.cid));
  const mode = r.shopRemoveMode ? 'remove' : (r.shopUpgradeMode ? 'upgrade' : 'main');
  const rerollCost = shopServiceCost(r,'reroll'), removeCost = shopServiceCost(r,'remove'), upgradeCost = shopServiceCost(r,'upgrade');

  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">MERCHANT</p>
    <h2>行商の露店</h2>
    ${shopModsNote(r)}
    <p style="font-size:13px; color:var(--gold); margin-top:6px;">所持ゴールド: ${r.player.gold}${S.settings.shopRerollEnabled?` ・ リロールトークン: ${r.player.rerollTokens||0}`:''}</p>
    ${mode==='main' ? `
      <div class="reward-row" id="shop-row">
        ${r.shopOffers.map((o,i)=>{
          const c = cardById(o.cardId);
          if(!c) return '';
          return `<div data-idx="${i}" style="text-align:center;">
            ${renderCardHTML(c,{unplayable:o.sold||r.player.gold<shopDiscounted(r,o.price)})}
            <div style="margin-top:6px; font-size:13px; color:var(--gold);">${o.sold?'売り切れ':shopPriceText(r,o.price)}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px;">
        ${(r.shopRelics||[]).map((rl,i)=>`
        <div style="width:210px; border:2px solid var(--gold); border-radius:8px; padding:12px; text-align:center; background:var(--bg-panel-raised);">
          <div style="font-family:var(--font-display); font-size:14px; color:var(--gold);">${rl.name}</div>
          <div style="font-size:11px; color:var(--parchment-dim); margin:6px 0;">${relicDescription(rl)}</div>
          <button data-buy-relic="${i}" ${(rl.sold||r.player.gold<shopDiscounted(r,rl.price))?'disabled':''}>${rl.sold?'売り切れ':shopDiscounted(r,rl.price)+'G で購入'}</button>
        </div>`).join('')}
      </div>
      <div style="margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        ${S.settings.shopRerollEnabled ? `<button id="btn-shop-reroll" ${(((r.player.rerollTokens||0)>0)||r.player.gold>=rerollCost)?'':'disabled'}>商品を入れ替える（${(r.player.rerollTokens||0)>0?'トークン1消費':rerollCost+'G'}）</button>` : ''}
        <button id="btn-shop-remove" ${(r.player.gold<removeCost || totalOwned<=5)?'disabled':''}>カードを1枚除去する（${removeCost}G）</button>
        <button id="btn-shop-upgrade" ${(r.player.gold<upgradeCost || upgradeEligible.length===0)?'disabled':''}>カードを1枚強化する（${upgradeCost}G）</button>
        <button class="primary" id="btn-shop-leave">店を出る</button>
      </div>
    ` : mode==='remove' ? `
      <p style="color:var(--parchment-dim); margin-top:10px;">除去するカードを選んでください（${removeCost}G）</p>
      <div class="reward-row" id="remove-row">
        ${ownedCardInstances(r).map((inst,i)=>`<div data-idx="${i}">${renderCardHTML(cardById(inst.cid),{mini:true})}</div>`).join('')}
      </div>
      <button class="ghost" id="btn-remove-cancel">やめる</button>
    ` : `
      <p style="color:var(--parchment-dim); margin-top:10px;">強化するカードを選んでください（${upgradeCost}G）</p>
      <div class="reward-row" id="upgrade-row">
        ${upgradeEligible.map((inst,i)=>`<div data-idx="${i}">${renderCardHTML(cardById(inst.cid),{mini:true})}</div>`).join('')}
      </div>
      <button class="ghost" id="btn-upgrade-cancel">やめる</button>
    `}
  </div>`;

  if(mode==='main'){
    qsa('#shop-row > div').forEach(wrap=>{
      const cardEl = wrap.querySelector('.card');
      if(!cardEl) return;
      cardEl.onclick = ()=>{
        const idx = parseInt(wrap.dataset.idx,10);
        const offer = r.shopOffers[idx];
        if(offer.sold || r.player.gold<shopDiscounted(r,offer.price)) return;
        r.player.gold -= shopDiscounted(r,offer.price);
        offer.sold = true;
        r.discard.push(offer.cardId);
        noteCardAcquired(r, offer.cardId);
        renderShop();
      };
    });
    qsa('[data-buy-relic]').forEach(btn=>{
      btn.onclick = ()=>{
        const rl = r.shopRelics[parseInt(btn.dataset.buyRelic,10)];
        const price = shopDiscounted(r, rl.price);
        if(!rl || rl.sold || r.player.gold<price) return;
        r.player.gold -= price;
        applyRelicEffect(r, rl);
        rl.sold = true;
        renderShop();
      };
    });
    if(qs('#btn-shop-reroll')) qs('#btn-shop-reroll').onclick = ()=>{
      if(!payReroll(r, rerollCost)) return;
      shopCountUse(r,'reroll');
      r.shopOffers = generateShopOffers((S.settings.shopCardCount||3) + ((r.shopMods||{}).cards||0));
      renderShop();
    };
    qs('#btn-shop-remove').onclick = ()=>{ r.shopRemoveMode = true; renderShop(); };
    qs('#btn-shop-upgrade').onclick = ()=>{ r.shopUpgradeMode = true; renderShop(); };
    qs('#btn-shop-leave').onclick = ()=>{ r.shopOffers=null; r.shopRelics=null; r.shopMods=null; advanceFloor(); };
  } else if(mode==='remove'){
    qsa('#remove-row > div').forEach(wrap=>{
      wrap.querySelector('.card').onclick = ()=>{
        const idx = parseInt(wrap.dataset.idx,10);
        const inst = ownedCardInstances(r)[idx];
        r[inst.pile].splice(inst.i,1);
        r.player.gold -= removeCost; shopCountUse(r,'remove');
        r.shopRemoveMode = false;
        renderShop();
      };
    });
    qs('#btn-remove-cancel').onclick = ()=>{ r.shopRemoveMode=false; renderShop(); };
  } else {
    qsa('#upgrade-row > div').forEach(wrap=>{
      wrap.querySelector('.card').onclick = ()=>{
        const idx = parseInt(wrap.dataset.idx,10);
        const inst = upgradeEligible[idx];
        r[inst.pile][inst.i] = upgradeRawId(inst.cid);
        r.player.gold -= upgradeCost; shopCountUse(r,'upgrade');
        r.shopUpgradeMode = false;
        renderShop();
      };
    });
    qs('#btn-upgrade-cancel').onclick = ()=>{ r.shopUpgradeMode=false; renderShop(); };
  }
}

function renderReward(){
  const r = S.run;
  if(!r.rewardChoices){ r.rewardChoices = generateRewardChoices(r, ''); r.rewardRerollCount = 0; }
  const choices = r.rewardChoices.map(id=>cardById(id)).filter(Boolean);
  const cfg = S.settings;
  const tags = cfg.tagFocusEnabled ? rewardableTags() : [];
  const focus = (r.rewardFocusTag && tags.includes(r.rewardFocusTag)) ? r.rewardFocusTag : '';
  const tokens = r.player.rerollTokens||0;
  const cost = cfg.rerollRewardBase + cfg.rerollRewardStep*r.rewardRerollCount + (focus ? cfg.rerollTagExtra : 0);
  const canReroll = tokens>0 || r.player.gold>=cost;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">VICTORY</p>
    <h2>戦利品を選べ</h2>
    <p style="color:var(--parchment-dim); margin-top:6px;">1枚選んでデッキに加えるか、スキップできる。</p>
    ${(S.run.lastDropCards&&S.run.lastDropCards.length)?`<p style="font-size:13px; color:var(--gold); margin-top:4px;">ドロップ: ${S.run.lastDropCards.map(escapeHtml).join('、')}を受け取った</p>`:''}
    <p style="font-size:13px; color:var(--gold); margin-top:4px;">ゴールド +${r.lastGoldGained}（所持: ${r.player.gold}）${cfg.rewardRerollEnabled?` ・ リロールトークン: ${tokens}`:''}</p>
    ${(()=>{ const m = tagBonusPctMap(); const ks = Object.keys(m).filter(k=>m[k]>0);
      const items = ks.map(k=>`[${escapeHtml(k)}] +${m[k]}%`).concat(tagBonusRules().map(x=>`${escapeHtml(tagCondText(x.tags, x.mode))}カード +${x.pct}%`));
      return items.length ? `<p style="font-size:11px; color:var(--parchment-dim); margin-top:4px;">出やすいタグ: ${items.join('　')}</p>` : ''; })()}
    <div class="reward-row" id="reward-row">
      ${choices.map((c,i)=>`<div data-idx="${i}">${renderCardHTML(c)}</div>`).join('')}
    </div>
    ${cfg.rewardRerollEnabled ? `
    <div style="margin-top:14px; display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;">
      ${cfg.tagFocusEnabled ? `<select id="reward-focus">
        <option value="">タグ指定なし</option>
        ${tags.map(t=>`<option value="${t}" ${focus===t?'selected':''}>[${t}] を狙う</option>`).join('')}
      </select>` : ''}
      <button id="btn-reroll" ${canReroll?'':'disabled'}>${focus?'狙い撃ちリロール':'リロール'}（${tokens>0?'トークン1消費':cost+'G'}）</button>
    </div>
    ${cfg.tagFocusEnabled ? `<p style="font-size:11px; color:var(--parchment-dim); margin-top:6px;">タグを指定すると、1枚目はそのタグのカードになり、他の枠も出やすくなる（ゴールド払いは+${cfg.rerollTagExtra}G）。</p>` : ''}` : ''}
    <button class="ghost" id="btn-skip" style="margin-top:10px;">受け取らずに進む${(cfg.rewardRerollEnabled&&cfg.skipTokenEnabled)?'（リロールトークン+1）':''}</button>
    ${battleLogDetails(r, false)}
  </div>`;
  const finish = ()=>{ r.rewardChoices=null; r.rewardRerollCount=0; r.rewardFocusTag=''; advanceFloor(); };
  qsa('#reward-row > div').forEach(wrap=>{
    wrap.querySelector('.card').onclick = ()=>{
      const idx = parseInt(wrap.dataset.idx,10);
      r.discard.push(choices[idx].id);
      noteCardAcquired(r, choices[idx].id);
      finish();
    };
  });
  if(qs('#reward-focus')) qs('#reward-focus').onchange = ()=>{ r.rewardFocusTag = qs('#reward-focus').value; renderReward(); };
  if(qs('#btn-reroll')) qs('#btn-reroll').onclick = ()=>{
    if(!payReroll(r, cost)) return;
    r.rewardRerollCount++;
    r.rewardChoices = generateRewardChoices(r, focus);
    renderReward();
  };
  qs('#btn-skip').onclick = ()=>{
    if(cfg.rewardRerollEnabled && cfg.skipTokenEnabled) r.player.rerollTokens = (r.player.rerollTokens||0) + 1;
    finish();
  };
}

async function boot(){

  S.cards = loadCards();
  if(!S.cards || S.cards.length===0) S.cards = DEFAULT_CARDS;
  S.relics = loadRelics();
  S.elements = loadElements();
  if(!S.relics || S.relics.length===0) S.relics = DEFAULT_RELICS;
  S.customStatuses = loadCustomStatuses();
  S.enemies = loadEnemies();
  if(!S.enemies || S.enemies.length===0) S.enemies = DEFAULT_ENEMIES;
  S.events = loadEvents();
  S.settings = loadSettings();
  S.world = loadWorld();
  applyWorldTheme();
  // 旧設定（探索ルールで選んでいた開始レリック）を、レリックの「開始時の所持数」に移す
  if(Array.isArray(S.settings.startRelicIds)){
    if(S.settings.startRelicIds.length){
      S.relics.forEach(rel=>{ if(S.settings.startRelicIds.includes(rel.id) && !(rel.startingCount>0)) rel.startingCount = 1; });
      saveRelics(S.relics);
    }
    delete S.settings.startRelicIds;
    saveSettings(S.settings);
  }
  S.screen='home';
  renderHome();
}

// ===== カード説明が長くて省略されたとき、マウスオーバー／長押しで全文を表示 =====
(function(){
  let pop = null, timer = null, longShown = false;
  const ensure = ()=>{ if(!pop){ pop = document.createElement('div'); pop.id = 'desc-pop'; document.body.appendChild(pop); } return pop; };
  const show = d=>{
    if(!d || d.scrollHeight <= d.clientHeight + 1) return false;   // 省略されていないときは出さない
    const p = ensure();
    p.innerHTML = d.innerHTML; p.style.display = 'block';
    const rc = d.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
    let left = Math.min(Math.max(8, rc.left), Math.max(8, window.innerWidth - pw - 8));
    let top = rc.bottom + 6;
    if(top + ph > window.innerHeight - 8) top = Math.max(8, rc.top - ph - 6);
    p.style.left = left + 'px'; p.style.top = top + 'px';
    return true;
  };
  const hide = ()=>{ clearTimeout(timer); timer = null; if(pop) pop.style.display = 'none'; };
  const descOf = t=>{ const card = t && t.closest ? t.closest('.card') : null; return card ? card.querySelector('.desc') : null; };
  document.addEventListener('mouseover', e=>{ if(e.target.closest && e.target.closest('.card .desc')) show(descOf(e.target)); });
  document.addEventListener('mouseout', e=>{ if(e.target.closest && e.target.closest('.card .desc')) hide(); });
  // タッチ: カードを長押しすると全文が出る（離したあとの誤ってカードを使う動作は打ち消す）
  document.addEventListener('pointerdown', e=>{
    hide();
    if(e.pointerType==='mouse') return;
    const d = descOf(e.target); if(!d) return;
    timer = setTimeout(()=>{ if(show(d)) longShown = true; }, 450);
  });
  ['pointerup','pointercancel'].forEach(ev=> document.addEventListener(ev, ()=>{ clearTimeout(timer); timer = null; setTimeout(()=>{ longShown = false; }, 400); }));
  document.addEventListener('scroll', hide, true);
  document.addEventListener('click', e=>{ if(longShown){ e.stopPropagation(); e.preventDefault(); longShown = false; hide(); } }, true);
  document.addEventListener('contextmenu', e=>{ if(e.target.closest && e.target.closest('.card') && (timer || longShown)) e.preventDefault(); });
})();

// ===== 状態・仕込みのアイコン: マウスオーバー／タップで詳細を表示（data-tip の中身をそのまま出す） =====
(function(){
  let pop = null;
  const ensure = ()=>{ if(!pop){ pop = document.createElement('div'); pop.id = 'tip-pop'; document.body.appendChild(pop); } return pop; };
  const tipOf = t=> (t && t.closest) ? t.closest('[data-tip]') : null;
  const show = el=>{
    const html = el.getAttribute('data-tip'); if(!html) return;
    const p = ensure();
    p.innerHTML = html; p.style.display = 'block';
    const rc = el.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
    const left = Math.min(Math.max(8, rc.left + rc.width/2 - pw/2), Math.max(8, window.innerWidth - pw - 8));
    let top = rc.bottom + 6;
    if(top + ph > window.innerHeight - 8) top = Math.max(8, rc.top - ph - 6);
    p.style.left = left + 'px'; p.style.top = top + 'px';
  };
  document.addEventListener('mouseover', e=>{ const t = tipOf(e.target); if(t) show(t); });
  // タッチ操作のあとにブラウザが出す疑似のマウスイベント（タップ直後の mouseout など）では、説明を消さない
  let touchMode = false;
  document.addEventListener('mouseout', e=>{ if(touchMode) return; const t = tipOf(e.target); if(t && !(e.relatedTarget && t.contains(e.relatedTarget))) hideStatusTip(); });
  document.addEventListener('click', e=>{ const t = tipOf(e.target); if(t) show(t); });      // タッチ: タップで表示
  document.addEventListener('pointerdown', e=>{ touchMode = e.pointerType!=='mouse'; if(!tipOf(e.target)) hideStatusTip(); });  // ほかをタップしたら消す
  document.addEventListener('scroll', hideStatusTip, true);
})();

  {key:'home',        label:'🏠 ホーム',                go:()=>{ S.screen='home'; renderHome(); }},
  {key:'editor',      label:'🃏 カードを編集',          go:()=>{ S.screen='editor'; renderEditor(); }},

  {key:'enemies',     label:'👹 敵を編集',              go:()=>{ S.screen='enemies'; renderEnemyEditor(); }},
  {key:'statuses',    label:'✨ カスタム状態を編集',    go:()=>{ S.screen='statuses'; renderStatusEditor(); }},
  {key:'elements',    label:'🔥 属性を編集',            go:()=>{ S.screen='elements'; renderElementEditor(); }},

];
(function(){
  const burger = document.createElement('button');
  burger.id = 'nav-burger'; burger.type = 'button'; burger.textContent = '☰'; burger.setAttribute('aria-label','メニューを開く');
  const backdrop = document.createElement('div'); backdrop.id = 'nav-backdrop';
  const drawer = document.createElement('nav'); drawer.id = 'nav-drawer';
  document.body.append(burger, backdrop, drawer);
  const close = ()=> document.body.classList.remove('nav-open');
  const renderDrawer = ()=>{
    drawer.innerHTML = '<div class="nav-title">メニュー</div>' + NAV_ITEMS.map(it=>`<button type="button" class="nav-item ${it.key===S.screen?'current':''}" data-nav="${it.key}">${it.label}</button>`).join('')
      + `<div style="border-top:1px solid var(--line); margin:8px 0;"></div><button type="button" class="nav-item" data-guides-toggle="1">${guidesOn() ? '📖 編集画面のガイド: 表示中' : '📖 編集画面のガイド: 非表示'}</button>`;
  };
  burger.onclick = ()=>{ renderDrawer(); document.body.classList.add('nav-open'); };
  backdrop.onclick = close;
  drawer.addEventListener('click', e=>{
    const gt = e.target.closest('[data-guides-toggle]');
    if(gt){ setGuides(!guidesOn()); return; }   // メニューは閉じない（切り替えた結果をそのまま見られる）
    const b = e.target.closest('[data-nav]'); if(!b) return;
    const it = NAV_ITEMS.find(x=>x.key===b.dataset.nav); close();
    if(it && it.key!==S.screen) it.go();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  // ホームと編集画面でだけ表示する（戦闘・報酬などの最中は出さない）
  const update = ()=>{
    const on = NAV_ITEMS.some(it=>it.key===S.screen);
    document.body.classList.toggle('has-burger', on);
    if(!on) close();
  };
  new MutationObserver(update).observe(app(), {childList:true});
  update();
})();

// ===== デッキ・レリックの閲覧（探索中のどの画面からでも） =====
(function(){
  const RUN_SCREENS = ['map','battle','rest','event','shop','reward','relicReward','startPick','startRelicPick','dropCards'];
  const wrap = document.createElement('div');
  wrap.id = 'run-viewer-btn';
  wrap.innerHTML = '<button type="button" data-rv="deck">🎴 デッキ</button><button type="button" data-rv="relic">🏺 レリック</button>';
  document.body.appendChild(wrap);
  let overlay = null, tab = 'deck', filter = 'all';
  const PILES = [['draw','山札'],['hand','手札'],['discard','捨て札'],['exhausted','消滅札']];
  const closeViewer = ()=>{ if(overlay){ overlay.remove(); overlay = null; } };
  const entries = (r)=>{
    const out = [];
    PILES.forEach(([pn,label])=> (r[pn]||[]).forEach(raw=>{
      const c = cardById(raw); if(!c) return;
      const {iid} = splitInstanceId(raw);
      const temp = !!(iid && r.temporaryCardIids && r.temporaryCardIids[iid]) || c.rarity==='generated';
      const enemy = c.rarity==='enemy';
      const stay = !!(pn==='exhausted' && iid && r.permExhaustIids && r.permExhaustIids[iid]);
      out.push({raw, c, pile:pn, label, temp, enemy, stay, iid});
    }));
    return out;
  };
  const render = ()=>{
    const r = S.run; if(!r){ closeViewer(); return; }
    const inBattle = S.screen==='battle';
    const all = entries(r);
    const counts = {all: all.length}; PILES.forEach(([pn])=> counts[pn] = all.filter(x=>x.pile===pn).length);
    let body = '';
    if(tab==='deck'){
      const shown = all.filter(x=> filter==='all' || x.pile===filter)
        .sort((a,b)=> (a.pile===b.pile ? 0 : PILES.findIndex(p=>p[0]===a.pile) - PILES.findIndex(p=>p[0]===b.pile)) || String(a.c.name).localeCompare(String(b.c.name),'ja'));
      body = `<div class="rv-legend">${inBattle ? '山札は並び順が分からないよう、名前順で表示しています。' : ''}<span class="b">青く光る</span>＝この戦闘中だけ入っているカード（生成カードを含む）／<span class="p">紫に光る</span>＝敵専用カード。同名のカードも1枚ずつ表示します。</div>
        <div class="rv-grid">${shown.length ? shown.map(x=>`<div class="rv-cell ${x.enemy?'rv-enemy':(x.temp?'rv-temp':'')}"><span class="rv-pile">${x.label}</span>${x.stay?'<span class="rv-stay">復活しない</span>':''}${renderCardHTML(x.c,{mini:true})}</div>`).join('') : '<p class="hint">カードがありません。</p>'}</div>`;
    } else {
      const ids = (r.player && r.player.relics) || [];
      body = ids.length ? ids.map(id=>{
        const rel = (S.relics||[]).find(x=>x.id===id);
        if(!rel) return `<div class="rv-relic"><div><div class="rn">${escapeHtml(id)}</div><div class="rd">（定義が見つかりません）</div></div></div>`;
        let desc = ''; try{ desc = relicDescription(rel); }catch(e){}
        return `<div class="rv-relic"><div style="font-size:24px;">${escapeHtml(rel.icon||'🏺')}</div><div><div class="rn">${escapeHtml(rel.name)} <span style="font-size:11px; color:var(--parchment-dim);">${escapeHtml(RARITY_LABEL[rel.rarity]||'')}</span></div><div class="rd">${escapeHtml(desc || rel.description || '')}</div></div></div>`;
      }).join('') : '<p class="hint">まだレリックを持っていません。</p>';
    }
    overlay.innerHTML = `<div class="rv-box">
      <div class="rv-head"><span class="rv-title">${tab==='deck' ? `デッキ（${counts.all}枚）` : `レリック（${((r.player&&r.player.relics)||[]).length}個）`}</span>
        <span class="rv-tabs"><button type="button" data-tab="deck" class="${tab==='deck'?'sel':''}">デッキ</button> <button type="button" data-tab="relic" class="${tab==='relic'?'sel':''}">レリック</button></span>
        <button type="button" class="ghost" data-close="1">閉じる</button></div>
      ${tab==='deck' ? `<div class="rv-filters">${[['all','すべて'],...PILES].map(([k,l])=>`<button type="button" data-filter="${k}" class="${filter===k?'sel':''}">${l} ${counts[k]}</button>`).join('')}</div>` : ''}
      <div class="rv-body">${body}</div></div>`;
  };
  const open = (t)=>{
    if(!S.run) return;
    tab = t; if(!overlay){ overlay = document.createElement('div'); overlay.className = 'rv-overlay'; document.body.appendChild(overlay);
      overlay.addEventListener('click', e=>{
        if(e.target===overlay || e.target.closest('[data-close]')){ closeViewer(); return; }
        const tb = e.target.closest('[data-tab]'); if(tb){ tab = tb.dataset.tab; render(); return; }
        const fb = e.target.closest('[data-filter]'); if(fb){ filter = fb.dataset.filter; render(); }
      });
    }
    render();
  };
  wrap.addEventListener('click', e=>{ const b = e.target.closest('[data-rv]'); if(b) open(b.dataset.rv); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeViewer(); });
  const update = ()=>{
    const on = !!S.run && RUN_SCREENS.includes(S.screen) && !(S.run.pendingChoice);
    wrap.classList.toggle('on', on);
    if(!S.run || !RUN_SCREENS.includes(S.screen)) closeViewer();
  };
  new MutationObserver(update).observe(app(), {childList:true});
  update();
})();
})();
</script>
</body>
</html>
