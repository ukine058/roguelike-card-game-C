<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灰燼の書庫 -Ashbound Codex-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #14110F;
    --bg-panel: #1D1812;
    --bg-panel-raised: #262019;
    --line: #3A3025;
    --parchment: #EDE3D0;
    --parchment-dim: #C9BC9F;
    --ink: #211C16;
    --ink-soft: #4a4030;
    --ember: #C1502E;
    --ember-dim: #7a3620;
    --steel: #4C7A8C;
    --steel-dim: #33525e;
    --violet: #7A5FA0;
    --violet-dim: #4f3d6a;
    --gold: #D4A73E;
    --hp-red: #A63A3A;
    --poison-green: #6C8A3E;
    --card-face: #EDE3D0; --card-face-hi: #f2e9d8;   /* カード・説明ポップアップの地の色 */
    --glow1: #2a2015; --glow2: #1a1410;               /* 背景の光 */
    --hp-red-dim: #7a2020;
    --primary: #c1502e; --primary-dim: #93381e; --primary-border: #7a3620;   /* 強調ボタン */
    --font-display: 'Shippori Mincho', serif;
    --font-en: 'Cormorant Garamond', serif;
    --font-ui: 'Zen Kaku Gothic New', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, var(--glow1) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, var(--glow2) 0%, transparent 55%),
      var(--bg-void);
    color:var(--parchment);
    font-family:var(--font-ui);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:16px;
  }
  #app{ width:100%; max-width:960px; }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0;}
  .eyebrow{ font-family:var(--font-en); letter-spacing:.04em; color:var(--parchment-dim); font-size:13px; margin:0 0 4px;}
  button{
    font-family:var(--font-ui);
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-panel-raised);
    color:var(--parchment);
    border-radius:3px;
    padding:10px 18px;
    font-size:14px;
    transition:all .12s ease;
  }
  button:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.primary{ background:linear-gradient(180deg,var(--primary),var(--primary-dim)); border-color:var(--primary-border); color:#f5e9d8; font-weight:600;}
  button.primary:hover:not(:disabled){ color:#fff; border-color:var(--gold); }
  button.ghost{ background:transparent; }
  input[type=text],input[type=number],select,textarea{
    background:var(--bg-void); border:1px solid var(--line); color:var(--parchment);
    padding:8px 10px; border-radius:3px; font-family:var(--font-ui); font-size:14px; width:100%;
  }
  label{ font-size:12.5px; color:var(--parchment-dim); display:block; margin-bottom:4px;}
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:12px; }
  .row > .field{ flex:1; }
  .hidden{ display:none !important; }
  .screen{ animation:fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---------- Home ---------- */
  .home-hero{ text-align:center; padding:60px 20px 40px; }
  .home-hero .eyebrow{ text-align:center; }
  .home-hero h1{ font-size:44px; color:var(--parchment); }
  .home-hero .sub{ font-family:var(--font-en); font-style:italic; color:var(--parchment-dim); font-size:18px; margin-top:6px;}
  .home-actions{ display:flex; flex-direction:column; gap:10px; max-width:280px; margin:36px auto 0; }
  .home-actions button{ padding:14px; font-size:15px; }
  .home-foot{ text-align:center; color:var(--ink-soft); font-size:12px; margin-top:30px;}

  /* ---------- Top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .topbar h2{ font-size:20px; }
  .topbar .eyebrow{ margin:0; }

  /* ---------- Card visual ---------- */
  .card{
    width:150px; min-width:150px; height:210px; border-radius:8px;
    background:linear-gradient(180deg,var(--card-face-hi),var(--card-face));
    color:var(--ink); position:relative; display:flex; flex-direction:column;
    border:2px solid #8a7752; box-shadow:0 4px 10px rgba(0,0,0,.4);
    overflow:hidden; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
    flex-shrink:0;
  }
  .card:hover{ transform:translateY(-10px); box-shadow:0 12px 20px rgba(0,0,0,.5); }
  .card.unplayable{ filter:grayscale(.6) brightness(.7); cursor:default; }
  .card.unplayable:hover{ transform:none; }
  .card .banner{ height:34px; display:flex; align-items:center; padding:0 10px; }
  .card.type-attack .banner{ background:linear-gradient(90deg,var(--ember),var(--ember-dim)); }
  .card.type-skill .banner{ background:linear-gradient(90deg,var(--steel),var(--steel-dim)); }
  .card.type-power .banner{ background:linear-gradient(90deg,var(--violet),var(--violet-dim)); }
  .card .cost{
    position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:var(--gold); font-family:var(--font-en); font-weight:700;
    display:flex; align-items:center; justify-content:center; font-size:14px; border:2px solid var(--gold); z-index:2;
  }
  .card .name{ color:#fff; font-family:var(--font-display); font-size:12.5px; font-weight:700; padding-left:24px; line-height:1.2; }
  .card .art{ flex:1; background:repeating-linear-gradient(135deg,#dfd2b6,#dfd2b6 8px,#d4c5a4 8px,#d4c5a4 16px); position:relative;}
  .card.type-attack .art{ background:repeating-linear-gradient(135deg,#e7cdb8,#e7cdb8 8px,#dcb99a 8px,#dcb99a 16px);}
  .card.type-skill .art{ background:repeating-linear-gradient(135deg,#cfe0e3,#cfe0e3 8px,#c0d4d8 8px,#c0d4d8 16px);}
  .card.type-power .art{ background:repeating-linear-gradient(135deg,#ded3ea,#ded3ea 8px,#d0c0e0 8px,#d0c0e0 16px);}
  .card .desc{ font-size:11px; line-height:1.35; padding:7px 8px; background:var(--card-face); min-height:56px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden; }
  .card .desc .desc-prefix{ font-style:italic; color:var(--ink-soft); }
  /* ---------- サイドメニュー（ハンバーガー） ---------- */
  #nav-burger{ position:fixed; top:8px; left:8px; z-index:900; width:38px; height:38px; padding:0; display:none; align-items:center; justify-content:center;
    font-size:20px; line-height:1; border-radius:6px; background:var(--bg-void); color:var(--parchment); border:1px solid var(--line); cursor:pointer; }
  body.has-burger #nav-burger{ display:flex; }
  body.has-burger #app{ padding-top:46px; box-sizing:border-box; }
  body.modal-open #nav-burger{ display:none; }
  #nav-backdrop{ position:fixed; inset:0; z-index:950; background:rgba(0,0,0,.55); display:none; }
  #nav-drawer{ position:fixed; top:0; left:0; bottom:0; z-index:960; width:260px; max-width:82vw; background:var(--bg-void); border-right:1px solid var(--line);
    box-shadow:6px 0 24px rgba(0,0,0,.6); transform:translateX(-105%); transition:transform .18s ease; padding:14px 10px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  body.nav-open #nav-drawer{ transform:none; }
  body.nav-open #nav-backdrop{ display:block; }
  #nav-drawer .nav-title{ font-size:12px; color:var(--parchment-dim); letter-spacing:.08em; margin:0 6px 8px; }
  #nav-drawer button.nav-item{ text-align:left; width:100%; padding:10px 12px; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--parchment); font-size:14px; cursor:pointer; }
  #nav-drawer button.nav-item:hover{ background:rgba(255,255,255,.06); }
  #nav-drawer button.nav-item.current{ border-color:var(--blk); color:var(--blk); }
  #fx-layer{ position:fixed; inset:0; z-index:2400; pointer-events:none; overflow:hidden; }
  .fx-num{ position:fixed; font-weight:800; font-size:26px; line-height:1; color:var(--c,#fff); white-space:nowrap; opacity:0;
    text-shadow:0 0 3px #000, 0 2px 4px rgba(0,0,0,.85), 0 0 10px var(--c,#fff); animation:fxrise var(--d,1.1s) ease-out forwards; }
  .fx-num.lg{ font-size:34px; } .fx-num.sm{ font-size:19px; }
  @keyframes fxrise{
    0%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)),10px) scale(.55); }
    14%{ opacity:1; transform:translate(calc(-50% + var(--dx,0px)),-6px) scale(1.3); }
    30%{ transform:translate(calc(-50% + var(--dx,0px)),-14px) scale(1); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)),-62px) scale(1); } }
  .fx-burst{ position:fixed; border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:0;
    background:radial-gradient(circle, var(--c) 0%, transparent 68%); animation:fxburst var(--d,.5s) ease-out forwards; }
  .fx-burst span{ font-size:30px; text-shadow:0 0 6px #000; }
  .fx-burst.ring{ background:none; border:3px solid var(--c); box-shadow:0 0 12px var(--c); }
  @keyframes fxburst{ 0%{ opacity:.95; transform:translate(-50%,-50%) scale(.3); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.2); } }
  .fx-aura{ position:fixed; border-radius:50%; border:3px solid var(--c); box-shadow:0 0 14px var(--c), inset 0 0 14px var(--c); opacity:0; animation:fxaura var(--d,.8s) ease-out forwards; }
  @keyframes fxaura{ 0%{ opacity:.9; transform:translate(-50%,-50%) scale(.6); } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.5); } }
  .status-chip.el-weak{ border-color:#c0392b; } .status-chip.el-resist{ border-color:#5B9BD5; }
  .fx-num.simple{ animation-name:fxfade; }
  @keyframes fxfade{ 0%{ opacity:0; transform:translate(-50%,0); } 20%{ opacity:1; transform:translate(-50%,0); } 100%{ opacity:0; transform:translate(-50%,0); } }
  #dlg-layer{ position:fixed; inset:0; z-index:2500; cursor:pointer; opacity:0; transition:opacity .22s ease; -webkit-tap-highlight-color:transparent; }
  #dlg-layer.on{ opacity:1; }
  .dlg-bubble{ position:fixed; width:max-content; max-width:min(320px,88vw); box-sizing:border-box; padding:18px 16px; border-radius:10px; background:var(--bg-panel); color:var(--parchment);
    border:1px solid var(--gold); box-shadow:0 10px 26px rgba(0,0,0,.6); font-size:14px; line-height:1.55; text-align:right; transform:translateY(6px); transition:transform .22s ease; }
  #dlg-layer.on .dlg-bubble{ transform:translateY(0); }
  /* しっぽは敵の側（右）を向く */
  .dlg-bubble::after{ content:''; position:absolute; right:-9px; top:22px; border:8px solid transparent; border-right:0; border-left:9px solid var(--gold); }
  .lg-say{ color:var(--gold); font-style:italic; }
  #desc-pop, #tip-pop{ position:fixed; z-index:3000; max-width:260px; padding:8px 10px; border-radius:6px; background:var(--card-face); color:var(--ink);
    border:1px solid #8a7752; box-shadow:0 6px 18px rgba(0,0,0,.55); font-size:12px; line-height:1.45; pointer-events:none; display:none; }
  #desc-pop .desc-prefix{ font-style:italic; color:var(--ink-soft); }
  #tip-pop{ max-width:280px; }
  #tip-pop .tip-title{ font-weight:700; font-size:13px; margin-bottom:3px; }
  #tip-pop .tip-line{ margin-top:3px; }
  #tip-pop .tip-dim{ color:var(--ink-soft); font-size:11px; }
  #tip-pop .tip-when{ font-weight:700; }
  .status-chip[data-tip]{ cursor:help; }
  /* 仕込み（構え）: キャラクターのアイコンの真上。上の余白を確保して、出入りで画面が動かないようにする */
  .combatant{ position:relative; }
  .trigger-row{ position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%); width:max-content; max-width:190px;
    display:flex; flex-wrap:wrap-reverse; justify-content:center; gap:4px; z-index:5; }
  .trigger-chip{ max-width:186px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-color:var(--gold); }
  .card .art{ display:flex; align-items:center; justify-content:center; }
  .card .card-icon{ font-size:44px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .card.mini .card-icon{ font-size:34px; }
  .card .rarity-dot{ position:absolute; bottom:5px; right:7px; font-size:9px; letter-spacing:.03em; color:var(--ink-soft); font-family:var(--font-en); }


  /* ===== デッキ・レリックの閲覧（探索中、いつでも） ===== */
  #run-viewer-btn{ position:fixed; top:8px; right:8px; z-index:40; display:none; gap:6px; }
  #run-viewer-btn.on{ display:flex; }
  #run-viewer-btn button{ padding:5px 10px; font-size:12px; background:var(--bg-panel); border:1px solid var(--line); color:var(--parchment); border-radius:14px; cursor:pointer; opacity:.88; }
  #run-viewer-btn button:hover{ opacity:1; border-color:var(--gold); }
  .rv-overlay{ position:fixed; inset:0; background:rgba(10,8,6,.78); z-index:70; display:flex; align-items:center; justify-content:center; padding:12px; }
  .rv-box{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; width:100%; max-width:860px; max-height:92vh; display:flex; flex-direction:column; }
  .rv-head{ display:flex; gap:6px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .rv-head .rv-title{ flex:1; font-size:15px; min-width:80px; }
  .rv-tabs button, .rv-filters button{ padding:4px 10px; font-size:12px; background:transparent; border:1px solid var(--line); color:var(--parchment-dim); border-radius:12px; cursor:pointer; }
  .rv-tabs button.sel, .rv-filters button.sel{ border-color:var(--gold); color:var(--gold); }
  .rv-filters{ display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px 0; }
  .rv-body{ padding:12px; overflow-y:auto; overscroll-behavior:contain; }
  .rv-grid{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; }
  .rv-cell{ position:relative; }
  .rv-cell .rv-pile{ position:absolute; top:-6px; left:-4px; z-index:3; font-size:10px; background:var(--bg-void); border:1px solid var(--line); color:var(--parchment); border-radius:8px; padding:0 6px; }
  .rv-cell.rv-temp .card{ box-shadow:0 0 0 2px #4aa3ff, 0 0 14px 3px rgba(74,163,255,.75); }
  .rv-cell.rv-enemy .card{ box-shadow:0 0 0 2px #b46bff, 0 0 14px 3px rgba(180,107,255,.75); }
  .rv-cell .rv-stay{ position:absolute; bottom:-6px; left:-4px; z-index:3; font-size:10px; background:var(--bg-void); border:1px solid #b46bff; color:#d3a8ff; border-radius:8px; padding:0 6px; }
  .rv-legend{ font-size:11px; color:var(--parchment-dim); margin:6px 0 10px; }
  .rv-legend .b{ color:#6bb6ff; } .rv-legend .p{ color:#c79bff; }
  .rv-relic{ display:flex; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
  .rv-relic .rn{ font-size:14px; color:var(--gold); } .rv-relic .rd{ font-size:12px; color:var(--parchment-dim); margin-top:2px; line-height:1.6; }
  /* small card for editor list */
  .card.mini{ width:120px; height:168px; }
  .card.mini .name{ font-size:11px; }
  .card.mini .desc{ font-size:9.5px; min-height:44px; -webkit-line-clamp:4; }

  /* ---------- Battle screen ---------- */
  .battlefield{ display:flex; justify-content:space-between; align-items:flex-start; padding:10px 6px 20px; gap:10px;}
  .combatant{ text-align:center; width:150px; }
  .combatant .portrait{
    width:110px; height:110px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    font-size:44px; border:2px solid var(--line); background:radial-gradient(circle at 35% 30%, #362b1c, #14110f);
  }
  .combatant.enemy .portrait{ border-color:var(--ember-dim); }
  .combatant.player .portrait{ border-color:var(--steel-dim); }
  .combatant .cname{ font-family:var(--font-display); font-size:15px; margin-bottom:4px;}
  .hpbar-wrap{ background:#000; border:1px solid var(--line); border-radius:10px; height:20px; overflow:hidden; position:relative; }
  .hpbar-fill{ height:100%; background:linear-gradient(90deg,var(--hp-red-dim),var(--hp-red)); transition:width .3s ease; position:relative; }
  .hpbar-ghost{ position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg,#b8863a,#e9c46a); opacity:.9; transition:width .6s ease; }
  .hpbar-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-family:var(--font-en); font-weight:700; text-shadow:0 1px 2px #000;}
  .statuses{ display:flex; gap:5px; justify-content:center; margin-top:6px; flex-wrap:wrap;}
  .status-chip{ font-size:10.5px; background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:10px; padding:2px 7px;}
  .intent{ margin-top:8px; font-size:12px; color:var(--parchment-dim); background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:5px; padding:5px 8px; min-height:16px;}
  .intent.atk{ color:#e39a7f;}
  .intent.def{ color:#9fc3ce;}
  .intent.buf{ color:#c4a8de;}
  .intent .intent-sub{ margin-top:5px; padding-top:5px; border-top:1px dashed var(--line); line-height:1.5; color:var(--parchment);}
  .intent .intent-sub.dim{ margin-top:1px; padding-top:0; border-top:none; font-size:11px; color:var(--parchment-dim);}
  .intent.lethal{ border-color:#c0504a; box-shadow:0 0 0 1px #c0504a66 inset;}
  .intent .warn{ color:#ff8f86; font-weight:700;}

  :root{ --blk:#5CC8E8; --blk-rgb:92,200,232; --lg-sc:#E58FB5; --lg-fp:#F0675A; --lg-fm:#6FA8F0; --lg-n:#F4ECD8; }
  .lg-head{ color:var(--lg-n); font-weight:700; }
  .lg-line{ display:block; padding-left:1.2em; }
  .lg-line .lg-line{ padding-left:1em; }
  .lg-n{ color:var(--lg-n); } .lg-mul{ margin-left:.2em; }
  .lg-sc{ color:var(--lg-sc); } .lg-fp{ color:var(--lg-fp); } .lg-fm{ color:var(--lg-fm); }
  .lg-blk{ color:var(--blk); }
  .lg-fp,.lg-fm{ cursor:help; }
  .blk-auto{ opacity:.85; font-weight:600; }
  .log-btns{ display:flex; gap:6px; }
  #app:has(.log-right){ max-width:1360px; }
  .battle-screen.log-right{ display:flex; gap:16px; align-items:flex-start; }
  .battle-screen.log-right .battle-main{ flex:1; min-width:0; }
  .battle-log{ width:360px; flex-shrink:0; position:sticky; top:12px; }
  .battle-log .log-box{ max-height:calc(100vh - 90px); min-height:240px; resize:none; }
  @media (max-width: 960px){
    .battle-screen.log-right{ flex-direction:column; }
    .battle-log{ width:100%; position:static; }
    .battle-log .log-box{ max-height:240px; }
  }
  .blockline{ margin:0 auto; width:max-content; min-width:96px; font-size:12px; border:1px solid rgba(var(--blk-rgb),.25); color:rgba(var(--blk-rgb),.45); border-radius:10px; padding:2px 10px; }
  .blockline.on{ color:var(--blk); border-color:var(--blk); background:rgba(var(--blk-rgb),.12); font-weight:700; }
  /* ブロックをHPバー内に表示 */
  .hpbar-wrap.has-block{ border-color:var(--blk); box-shadow:0 0 6px rgba(var(--blk-rgb),.45); }
  .hpbar-text{ gap:5px; }
  #eo-list{ margin-bottom:12px; }
  .eo-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:4px; background:var(--bg-void); border:1px solid var(--line); border-radius:4px; font-size:13px; }
  .eo-item.dragging{ border-color:var(--blk); opacity:.8; }
  .eo-handle{ cursor:grab; touch-action:none; user-select:none; padding:2px 6px; color:var(--parchment-dim); }
  .eo-label{ flex:1; }
  .eo-btn{ padding:0 8px; min-width:0; height:26px; }
  .hpbar-block{ display:inline-flex; align-items:center; gap:2px; padding:0 6px; height:15px; line-height:15px; border-radius:8px; font-size:inherit; font-weight:700; color:var(--blk); white-space:nowrap; text-shadow:none; border:1px solid var(--blk); background:linear-gradient(rgba(var(--blk-rgb),.12),rgba(var(--blk-rgb),.12)), #0b1a20; }
  .hpbar-block .blk-auto{ font-size:inherit; font-weight:inherit; opacity:1; }
  .combatant .statuses{ min-height:26px; }
  .combatant.enemy{ position:relative; }
  .intent{ position:relative; cursor:pointer; }
  .intent-main{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.35; min-height:2.7em; }
  .intent .ip-calc{ color:var(--lg-n); margin-left:.15em; }

const TYPE_DEFAULT_ICON = {attack:'⚔️', skill:'🛡️', power:'✨'};

// icon set on the card wins; otherwise a per-card default, then a per-type default
function cardIcon(c){
  if(c && c.icon) return c.icon;
  const baseId = String((c && (c.baseId || c.id)) || '').replace(/\+$/,'');
  if(DEFAULT_ICONS[baseId]) return DEFAULT_ICONS[baseId];
  if(baseId.indexOf('enemy_buf_')===0) return '📢';
  return (c && TYPE_DEFAULT_ICON[c.type]) || '❔';
}
// タグの空白（半角・全角・タブなど）はすべて取り除く。複数タグの区切りは , 、 ，
function cleanTag(v){ return typeof v==='string' ? v.replace(/[\s\u3000]+/g,'') : ''; }
// ===== 有効タグ（明示タグ＋自動タグ） =====
// 自動タグ: 種類（アタック／スキル／パワー）と、印刷コスト（コスト0, コスト1 …。一時的なコスト増減・強化では変わらない）。
// カードごとに suppressTypeTag / suppressCostTag で自動タグを外せる。明示タグの配列（c.tags）には書き込まない。
const TYPE_TAG_NAME = {attack:'アタック', skill:'スキル', power:'パワー'};
function effectiveCardTags(c){
  if(!c) return [];
  const out = Array.isArray(c.tags) ? c.tags.slice() : [];
  if(!c.suppressTypeTag){ const t = TYPE_TAG_NAME[c.type]; if(t && !out.includes(t)) out.push(t); }
  if(!c.suppressCostTag){
    const m = (typeof S!=='undefined' && S.cards) ? S.cards.find(x=>x.id===String(c.id||'').replace(/\+$/,'')) : null;
    const v = Number((m||c).cost);
    const t = isXCost(m||c) ? 'コストX' : (Number.isFinite(v) ? 'コスト'+Math.max(0,Math.floor(v)) : '');
    if(t && !out.includes(t)) out.push(t);
  }
  return out;
}
function cardHasTag(c, tag){ return !!tag && effectiveCardTags(c).includes(tag); }
function parseTags(v){
  const out = [];
  String(v||'').split(/[,、，]/).forEach(x=>{ const t = cleanTag(x); if(t && !out.includes(t)) out.push(t); });
  return out;
}
// ===== 複数タグ指定（フェーズ7a: 共通部品） =====
// 指定欄の保存値は、正規化したカンマ区切りの文字列（例 '血,炎'）。1個だけの旧データもそのまま読める。
// 一致モード: 'any'＝指定したどれか1つを持てば対象 ／ 'all'＝指定したすべてを持つものだけ対象。未設定は 'any'。
function tagListOf(v){ return Array.isArray(v) ? parseTags(v.join(',')) : parseTags(v); }
function cleanTagList(v){ return tagListOf(v).join(','); }
function cleanTagMode(v){ return v==='all' ? 'all' : 'any'; }
// tagSet（持っているタグの配列）が、wanted（指定タグの配列／文字列）に、mode で一致するか。指定が空なら常に真（絞り込みなし）。
function tagsMatch(tagSet, wanted, mode){
  const w = tagListOf(wanted);
  if(!w.length) return true;
  const have = Array.isArray(tagSet) ? tagSet : [];
  return cleanTagMode(mode)==='all' ? w.every(t=>have.includes(t)) : w.some(t=>have.includes(t));
}
function cardMatchesTags(c, wanted, mode){ if(!tagListOf(wanted).length) return true; return !!c && tagsMatch(effectiveCardTags(c), wanted, mode); }
// 説明文用: タグ指定を「[A]の」「[A・B]のいずれかの」「[A・B]すべてを持つ」の形にする（指定が空なら ''）
function tagCondText(wanted, mode){
  const w = tagListOf(wanted);
  if(!w.length) return '';
  if(w.length===1) return `[${w[0]}]の`;
  return cleanTagMode(mode)==='all' ? `[${w.join('・')}]すべてを持つ` : `[${w.join('・')}]のいずれかの`;
}
// 参照増減の説明用: 1個は「[A]」、2個以上は「[A・B]のいずれか」「[A・B]すべて持つ」（指定が空なら ''）
// 「タグの種類数」の参照元。数えるのは、対象のカードが持つタグ（種類・コストの自動タグを含む）の種類の数。指定したタグは数えない（除外）
const TAG_KINDS_SOURCES = ['tagKindsHand','tagKindsPlayedThisTurn','tagKindsDrawDiscard'];
function distinctTagKinds(tagLists, excluded){
  const ex = tagListOf(excluded), seen = new Set();
  tagLists.forEach(list=> (list||[]).forEach(t=>{ if(!ex.includes(t)) seen.add(t); }));
  return seen.size;
}
// 参照増減の説明に付けるタグの表記。種類数の参照では「除外」の意味になる
function scaleSourceTagText(source, wanted, mode){
  if(TAG_KINDS_SOURCES.includes(source)){ const w = tagListOf(wanted); return w.length ? `（除外: ${w.join('・')}）` : ''; }
  return scaleTagText(wanted, mode);
}
function scaleTagText(wanted, mode){
  const w = tagListOf(wanted);
  if(!w.length) return '';
  if(w.length===1) return `[${w[0]}]`;
  return `[${w.join('・')}]` + (cleanTagMode(mode)==='all' ? 'すべて持つ' : 'のいずれか');
}
// 編集画面用: 一致モードの選択欄。attrs はセレクトに付ける属性（例 'data-f="filterTagMode"'）。タグが2個以上のときだけ表示する。
function tagModeFieldHTML(attrs, mode, wanted){
  const m = cleanTagMode(mode);
  return `<div class="field tagmode-field" style="${tagListOf(wanted).length>1 ? '' : 'display:none;'}"><label>複数タグのとき</label><select ${attrs}>`
    + `<option value="any" ${m==='any'?'selected':''}>どれか1つを持つものが対象</option>`
    + `<option value="all" ${m==='all'?'selected':''}>すべて持つものだけが対象</option></select></div>`;
}
// タグ入力欄＋モード選択欄の組。cls は外側の class、labelHTML は見出し（HTML）、inputStyle は入力欄の style（省略可）。
function tagPairHTML(cls, labelHTML, inputAttrs, value, modeAttrs, mode, inputStyle){
  return `<div class="${cls} tagpair">${labelHTML}<input type="text" ${inputAttrs} value="${escapeHtml(value||'')}"${inputStyle ? ` style="${inputStyle}"` : ''}>${tagModeFieldHTML(modeAttrs, mode, value)}</div>`;
}
// 編集画面の .tagpair で、入力のたびにタグが2個以上かを見て、モード選択欄の表示／非表示を切り替える（画面全体に1回だけ付ける）。
function bindTagPairs(root){
  if(!root) return;
  const sync = e=>{
    const t = e.target;
    if(!t || t.tagName!=='INPUT' || t.type!=='text') return;
    const pair = t.closest && t.closest('.tagpair'); if(!pair) return;
    const mf = pair.querySelector('.tagmode-field'); if(mf) mf.style.display = tagListOf(t.value).length>1 ? '' : 'none';
  };
  root.addEventListener('input', sync); root.addEventListener('change', sync);
}
// 敵専用・生成専用のカード（通常の報酬・ショップ・初期デッキには出ない）
// 通常入手不可のレリック。ランダムな報酬・ショップ・開始時の選択肢・イベントのランダム入手には出ず、
// 敵のドロップ指定・イベントのレリック指定・初期所持でだけ手に入る。
function isNonRewardRelic(rel){ return !!rel && rel.rarity==='special'; }
function isNonRewardCard(c){ return !!c && (c.rarity==='generated' || c.rarity==='enemy'); }
function migrateCard(c){
  if(c){
    if(Array.isArray(c.tags)){ const seen = []; c.tags.forEach(x=>{ const t = cleanTag(x); if(t && !seen.includes(t)) seen.push(t); }); c.tags = seen; }
    if(typeof c.triggerTag==='string') c.triggerTag = cleanTagList(c.triggerTag);
    if(c.cardOp && typeof c.cardOp.filterTag==='string') c.cardOp.filterTag = cleanTagList(c.cardOp.filterTag);
  }
  if(c && c.cardOp && c.cardOp.timing!==undefined){
    if(c.timing===undefined) c.timing = c.cardOp.timing;
    if(c.triggerTag===undefined) c.triggerTag = c.cardOp.triggerTag;
    if(c.duration===undefined) c.duration = c.cardOp.duration;
    delete c.cardOp.timing;
    delete c.cardOp.triggerTag;
    delete c.cardOp.duration;
  }
  // 単一の cardOp は、読み込み時に cardOps（配列）へ変換する
  if(c && !Array.isArray(c.cardOps) && c.cardOp){
    c.cardOps = c.cardOp.enabled ? [normalizeStatusOp(c.cardOp)] : [];
    delete c.cardOp;
  }
  // 旧データの変換: 敵専用・生成専用・使用者「敵のみ」のカードは、レアリティ「生成専用」にまとめる
  // 敵専用・生成専用は別のレアリティ（扱いは同じ：通常の報酬・ショップ・初期デッキには出ない）
  if(c){
    if(c.rarity!=='enemy' && c.rarity!=='generated'){
      if(c.usableBy==='enemy') c.rarity = 'enemy';
      else if(c.generatedOnly) c.rarity = 'generated';
    }
    if(c.rarity==='generated' && typeof c.id==='string' && c.id.startsWith('enemy_')) c.rarity = 'enemy';
  }
  if(c){ delete c.generatedOnly; delete c.usableBy; }
  return c;
}
function loadCards(){
  try{
    const value = localStorage.getItem('cards');
    if(value) return JSON.parse(value).map(migrateCard);
  }catch(e){ console.error(e); }
  return DEFAULT_CARDS;
}
function saveCards(cards){
  try{ localStorage.setItem('cards', JSON.stringify(cards)); }catch(e){ console.error(e); }
}
function loadSettings(){
  try{
    const value = localStorage.getItem('settings');
    if(value) return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(value));
  }catch(e){ console.error(e); }
  return {...DEFAULT_SETTINGS};
}

function cleanWorld(o){
  o = (o && typeof o==='object') ? o : {};
  const out = {};
  const hex = v=> typeof v==='string' && /^#[0-9a-fA-F]{6}$/.test(v);
  Object.keys(DEFAULT_WORLD).forEach(k=>{
    const dv = DEFAULT_WORLD[k], v = o[k];
    if(/^(accent|bg|panel|color)/.test(k)) out[k] = hex(v) ? v : dv;
    else if(k==='blockName'){ const t = (typeof v==='string' ? v.trim() : '').slice(0,12); out[k] = t || dv; }
    else if(/^mapLabel/.test(k)){ const t = (typeof v==='string' ? v.trim() : '').slice(0,12); out[k] = t || dv; }
    else if(/^mapIcon/.test(k)){ const t = typeof v==='string' ? Array.from(v.trim()).slice(0,3).join('') : ''; out[k] = t || dv; }
    else if(k==='blockIcon'){ const t = typeof v==='string' ? Array.from(v.trim()).slice(0,3).join('') : ''; out[k] = t || dv; }
    else out[k] = typeof v==='string' ? v.slice(0,2000) : dv;
  });
  return out;
}
function loadWorld(){
  try{ const v = localStorage.getItem('world'); if(v) return cleanWorld(JSON.parse(v)); }catch(e){ console.error(e); }
  return {...DEFAULT_WORLD};
}
function saveWorld(w){ try{ localStorage.setItem('world', JSON.stringify(w)); }catch(e){ console.error(e); } }
// 色を画面に反映する（--gold=アクセント、カードの種類ごとの色、背景）
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const c = i=> Math.max(0,Math.min(255,Math.round(((n>>i)&255)*f)));
  return '#'+[16,8,0].map(i=>c(i).toString(16).padStart(2,'0')).join('');
}

  st.setProperty('--gold', w.accent);
  st.setProperty('--bg-void', w.bg);

  st.setProperty('--bg-panel-raised', shade(w.panel,1.18));
  st.setProperty('--ember', w.colorAttack); st.setProperty('--ember-dim', shade(w.colorAttack,.6));
  st.setProperty('--steel', w.colorSkill);  st.setProperty('--steel-dim', shade(w.colorSkill,.6));
  st.setProperty('--violet', w.colorPower); st.setProperty('--violet-dim', shade(w.colorPower,.6));
  const D = DEFAULT_WORLD, hexAdd = (hex,r,g,b)=>{ const n = parseInt(hex.slice(1),16); const c = (sh,d)=> Math.max(0,Math.min(255,((n>>sh)&255)+d)).toString(16).padStart(2,'0'); return '#'+c(16,r)+c(8,g)+c(0,b); };
  st.setProperty('--parchment', w.colorText); st.setProperty('--parchment-dim', w.colorTextDim); st.setProperty('--line', w.colorLine);
  st.setProperty('--card-face', w.colorCard); st.setProperty('--card-face-hi', hexAdd(w.colorCard,5,6,8));

  st.setProperty('--primary-dim', w.colorPrimary.toUpperCase()===D.colorPrimary ? '#93381e' : shade(w.colorPrimary,.78));
  st.setProperty('--primary-border', w.colorPrimary.toUpperCase()===D.colorPrimary ? '#7a3620' : shade(w.colorPrimary,.64));
  st.setProperty('--glow1', w.colorGlow1); st.setProperty('--glow2', w.colorGlow2);
  st.setProperty('--lg-n', w.colorLogBase); st.setProperty('--lg-sc', w.colorLogScale); st.setProperty('--lg-fp', w.colorLogPlus); st.setProperty('--lg-fm', w.colorLogMinus);
  st.setProperty('--blk', w.colorBlockUi);
  st.setProperty('--blk-rgb', [16,8,0].map(i=>(parseInt(w.colorBlockUi.slice(1),16)>>i)&255).join(','));
  document.title = (w.title||'') + (w.subtitle ? ` -${w.subtitle}-` : '');

/* ブロックの呼び名: 画面に出る「ブロック」の文字を、世界観の設定の呼び名に置き換える。
   画面に追加された文字（ログ・説明文・ボタン・ツールチップ）を監視して、そのつど置き換える。
   呼び名が「ブロック」を含むときは、置き換えた文字に見えない印（U+2060）を入れて、二重に置き換わらないようにする。 */
const BLOCK_WORD = 'ブロック';
const BLK_ATTRS = ['title','data-tip','placeholder','aria-label'];
let __blkRepl = BLOCK_WORD, __blkObs = null;
function blockLabel(){ return (S.world || DEFAULT_WORLD).blockName || BLOCK_WORD; }
function blockIcon(){ return (S.world || DEFAULT_WORLD).blockIcon || '🛡️'; }
function blkSub(str){ return str.split(BLOCK_WORD).join(__blkRepl); }
function blkSkip(node){
  const el = node.nodeType===1 ? node : node.parentElement;
  return !el || !!el.closest('[data-noblock],textarea,script,style');
}
function blkAttr(el, a){
  const v = el.getAttribute(a);
  if(v && v.includes(BLOCK_WORD) && !blkSkip(el)) el.setAttribute(a, blkSub(v));
}
function blkWalk(root){
  if(!root) return;
  if(root.nodeType===3){ if(root.data.includes(BLOCK_WORD) && !blkSkip(root)) root.data = blkSub(root.data); return; }
  if(root.nodeType!==1 || blkSkip(root)) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  let n; while((n = tw.nextNode())) list.push(n);
  list.forEach(t=>{ if(t.data.includes(BLOCK_WORD) && !blkSkip(t)) t.data = blkSub(t.data); });
  [root, ...root.querySelectorAll('[title],[data-tip],[placeholder],[aria-label]')].forEach(el=>BLK_ATTRS.forEach(a=>blkAttr(el, a)));
}
function blkObserve(){
  __blkObs.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:BLK_ATTRS});
}
function applyBlockName(){
  const nm = blockLabel();
  __blkRepl = nm.includes(BLOCK_WORD) ? nm.split(BLOCK_WORD).join('ブ\u2060ロック') : nm;
  if(!document.body) return;
  if(!__blkObs){
    __blkObs = new MutationObserver(muts=>{
      if(blockLabel()===BLOCK_WORD) return;
      __blkObs.disconnect();
      try{
        muts.forEach(m=>{
          if(m.type==='childList') m.addedNodes.forEach(blkWalk);
          else if(m.type==='characterData') blkWalk(m.target);
          else if(m.type==='attributes') blkAttr(m.target, m.attributeName);
        });
      } finally { blkObserve(); }
    });
    blkObserve();
  }
  if(nm!==BLOCK_WORD) blkWalk(document.body);   // すでに出ている文字にも反映する
}
function worldText(key, vars){
  const w = S.world || DEFAULT_WORLD;
  return String(w[key]||'').replace(/\{(\w+)\}/g,(m,k)=> vars && vars[k]!==undefined ? vars[k] : m);
}

function migrateRelic(rel){
  if(rel){ if(typeof rel.triggerTag==='string') rel.triggerTag = cleanTagList(rel.triggerTag); if(typeof rel.favorTag==='string') rel.favorTag = cleanTagList(rel.favorTag); }
  if(rel && !rel.timing) rel.timing = 'onPickup';
  if(rel) rel.startingCount = clampInt(rel.startingCount,0,9,0);
  return rel;
}
// A status used to have exactly one effect (kind + magnitude, plus an optional card-op).
// It now has a list of effects; old data is converted on load.
function migrateCustomStatus(st){
  if(Array.isArray(st.effects)) return st;
  const effects = [];
  if(st.kind && st.kind!=='none' && st.kind!=='cardOp'){
    effects.push({kind:st.kind, magnitudeMode:st.magnitudeMode, magnitudeValue:st.magnitudeValue});
  }
  if(st.cardOp && st.cardOp.enabled){
    effects.push({kind:'cardOp', magnitudeMode:st.magnitudeMode, magnitudeValue:st.magnitudeValue, op:st.cardOp});
  }
  const out = {...st, effects};
  delete out.kind; delete out.magnitudeMode; delete out.magnitudeValue; delete out.cardOp;
  return out;
}
function loadCustomStatuses(){
  try{
    const value = localStorage.getItem('customStatuses');
    if(value) return JSON.parse(value).map(normalizeCustomStatus);
  }catch(e){ console.error(e); }
  return [];
}

function migrateEnemy(e){
  if(!e.category) e.category = e.boss ? 'boss' : (e.elite ? 'elite' : 'normal');
  if(!e.weight) e.weight = 1;
  if(!Array.isArray(e.deck)){
    // Older saves had an ordered "moveIds" list instead of a weighted deck; convert it.
    e.deck = Array.isArray(e.moveIds) ? e.moveIds.map(id=>({cardId:id, weight:1})) : [];
  }
  if(!e.startEffect || typeof e.startEffect!=='object') e.startEffect = {};
  if(typeof e.dropRelicId!=='string') e.dropRelicId = '';
  if(!Array.isArray(e.dropCardIds)) e.dropCardIds = [];
  alignDropChances(e);
  if(!Array.isArray(e.startCards)) e.startCards = [];
  if(!Array.isArray(e.forcedMoves)) e.forcedMoves = [];
  if(!Array.isArray(e.chains)) e.chains = [];
  return e;
}

// ===== 属性（攻撃の属性）=====
// element: {id, name, props:{}}。props は将来の拡張用（吸血・貫通のような、ダメージに作用する特殊効果などをここに足す）。
const DEFAULT_ELEMENTS = [
  {id:'fire', name:'火', props:{}, color:'#E8743B', emoji:'🔥'},
  {id:'ice', name:'氷', props:{}, color:'#6EC6E8', emoji:'❄️'},
  {id:'thunder', name:'雷', props:{}, color:'#F2D14B', emoji:'⚡'},
];
/* ===== 属性ごとの特殊効果 =====
   属性の props に {キー: 値} で持つ。新しい特殊効果は、ここに1項目足せば、属性の編集画面に入力欄が出て、保存・読み込み・一覧表示・複製にそのまま乗る。
   共通の項目: key / label / hint（編集画面の説明）/ short(value)（一覧の短い表示）
     type 'number'（既定）: min / max。0は「持たない」。 type 'list': clean(list)＝正規化、has(list)、rowHTML(row,i)、newRow()（編集画面の行）
   効く場所は次のどれか（両方でもよい）:
     blockMod(value) … ブロックを引く計算の前に効く。{pierce:％（ブロックを無視する割合）, breakPct:％（ブロックを削る力の増加）} を返す。複数の属性の分は足し合わせる。
     apply(ctx)      … 攻撃のダメージが確定した直後に、その攻撃が持つ属性のうち、この効果を持つものについて、まとめて1回呼ばれる。
         ctx: {side:'toEnemy'|'toPlayer', hit, attacker, attackerName, defender, defenderName, entries:[{element, value}]}
         hit は被弾の記録（hpLoss＝実際に減ったHP、total＝ダメージの合計、blocked＝ブロックで防いだ分、pierceAmt など）。
         ログに残す文は {text, kind}（または、その配列）で返す（攻撃のログの後に出す）。 */
const ELEMENT_BUILTIN_STATUSES = [['strength','強化'],['dexterity','器用'],['weak','弱体'],['vulnerable','脆弱'],['poison','毒'],['regen','再生'],['stun','麻痺'],['metallicize','自動ブロック'],['thorns','棘']];
function hitStatusOptions(){
  return ELEMENT_BUILTIN_STATUSES.map(([k,n])=>({key:'b:'+k, label: k==='stun' ? n+'（敵に付与したときだけ有効）' : n}))
    .concat((S.customStatuses||[]).map(st=>({key:'cs:'+st.id, label:`${st.emoji||''}${st.name}`})));
}
function cleanHitStatus(list){
  return (Array.isArray(list) ? list : []).filter(x=>x && typeof x==='object').map(x=>{
    const st = typeof x.status==='string' ? x.status : '';
    const ok = (st.startsWith('b:') && ELEMENT_BUILTIN_STATUSES.some(([k])=>'b:'+k===st)) || (st.startsWith('cs:') && st.length>3);
    if(!ok) return null;
    return {status:st.slice(0,80), stacks:clampInt(x.stacks,1,99,1), chance:clampInt(x.chance,1,100,100), target: x.target==='self' ? 'self' : 'opponent', when: x.when==='hit' ? 'hit' : 'hp'};
  }).filter(Boolean).slice(0,6);
}
const ELEMENT_PROP_DEFS = [
  {key:'lifesteal', label:'吸血（％）', min:0, max:999,
   hint:'この属性を持つ攻撃が、相手のHPを実際に減らしたとき、減らした分のこの％（端数は切り捨て）を、攻撃した側が回復します。ブロックで防がれた分は含めません。攻撃が複数の属性を持つときは、各属性の％を足し合わせます。カードの「吸収」とは別に計算して、回復を足します。0なら効果なし。',
   short: v=>`吸血${v}％`,
   apply(ctx){
     const loss = ctx.hit.hpLoss || 0, a = ctx.attacker;
     if(!(loss>0) || !a || !(a.hp>0)) return null;
     const pct = ctx.entries.reduce((sum,x)=>sum+x.value, 0);
     const heal = Math.floor(loss*pct/100); if(!(heal>0)) return null;
     const b = a.hp; a.hp = Math.min(a.maxHp, a.hp + heal);
     const got = a.hp - b; if(!(got>0)) return null;
     fxHeal(a, got);
     const names = ctx.entries.map(x=>x.element.name).join('・');
     return {text:`${ctx.attackerName}は${names}の吸血で${got}回復（HP ${b}→${a.hp}）。`, kind: ctx.side==='toPlayer' ? 'deal' : undefined};
   }},
  {key:'pierce', label:'貫通（％）', min:0, max:100,
   hint:'この属性を持つ攻撃のダメージのうち、この％（端数は切り捨て）が、ブロックを無視してHPに入ります。残りは通常どおり、ブロックで防がれます。攻撃が複数の属性を持つときは、各属性の％を足し合わせます（最大100％）。カード自体が「貫通」のときは、全部がブロックを無視します。0なら効果なし。',
   short: v=>`貫通${v}％`,
   blockMod: v=>({pierce:v})},
  {key:'blockBreak', label:'ブロック破壊（％）', min:0, max:999,
   hint:'この属性を持つ攻撃は、ブロックを削る力がこの％だけ強くなります（ダメージ1につき、ブロックを「1＋この％」失います）。たとえば50％なら、ダメージ10でブロック15分を壊せます。ダメージ10・ブロック10なら、ブロックは0になり、3ダメージがHPに通ります。ブロックを持たない相手には効果がありません。攻撃が複数の属性を持つときは、各属性の％を足し合わせます。0なら効果なし。',
   short: v=>`ブロック破壊${v}％`,
   blockMod: v=>({breakPct:v})},
  {key:'guard', label:'ヒット時ブロック獲得（％）', min:0, max:999,
   hint:'この属性を持つ攻撃が当たったとき、与えたダメージの合計（ブロックで防がれた分も含む）のこの％（端数は切り捨て）を、攻撃した側がブロックとして得ます。攻撃が複数の属性を持つときは、各属性の％を足し合わせます。0なら効果なし。',
   short: v=>`ヒット時ブロック${v}％`,
   apply(ctx){
     const total = ctx.hit.total || 0, a = ctx.attacker;
     if(!(total>0) || !a || !(a.hp>0)) return null;
     const pct = ctx.entries.reduce((sum,x)=>sum+x.value, 0);
     const gain = Math.floor(total*pct/100); if(!(gain>0)) return null;
     const b = a.block||0; a.block = b + gain; fxBlock(a, gain);
     const names = ctx.entries.map(x=>x.element.name).join('・');
     return {text:`${ctx.attackerName}は${names}の守りで${gain}のブロックを得た（ブロック ${b}→${a.block}）。`, kind: ctx.side==='toPlayer' ? 'deal' : undefined};
   }},
  {key:'hitStatus', type:'list', label:'ヒット時の状態付与（確率）',
   hint:'この属性を持つ攻撃が当たったとき、確率で状態を付与します。付与先は「攻撃を受けた側（相手）」か「攻撃した側（自分）」を選べます。付与は通常の状態付与と同じ扱いで、排他の設定やエフェクトもそのまま働きます。条件は「相手のHPを実際に減らしたとき」か「攻撃が当たったとき（ブロックで全部防がれても）」。最大6件まで。',
   clean: cleanHitStatus,
   has: v=> Array.isArray(v) && v.length>0,
   short: v=>`状態付与${v.length}件`,
   newRow: ()=>({status:(hitStatusOptions()[2]||hitStatusOptions()[0]).key, stacks:1, chance:100, target:'opponent', when:'hp'}),
   rowHTML(row, i){
     const opt = (v,t,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`;
     return `<div class="ev-eff" data-idx="${i}">
       <div class="ev-eff-head"><span>状態付与 ${i+1}</span><button type="button" class="ghost elm-row-del">削除</button></div>
       <div class="field"><label>付与する状態</label><select data-f="status">${hitStatusOptions().map(o=>opt(escapeHtml(o.key), escapeHtml(o.label), row.status)).join('')}</select></div>
       <div class="ev-eff-grid"><div><label>付与するスタック数</label><input type="number" data-f="stacks" value="${row.stacks}" min="1" max="99"></div>
         <div><label>確率（％）</label><input type="number" data-f="chance" value="${row.chance}" min="1" max="100"></div></div>
       <div class="field"><label>付与先</label><select data-f="target">${opt('opponent','攻撃を受けた側（相手）',row.target)}${opt('self','攻撃した側（自分）',row.target)}</select></div>
       <div class="field"><label>条件</label><select data-f="when">${opt('hp','相手のHPを実際に減らしたとき',row.when)}${opt('hit','攻撃が当たったとき（ブロックで全部防がれても）',row.when)}</select></div>
     </div>`;
   },
   apply(ctx){
     const notes = [];
     ctx.entries.forEach(en=>{
       (en.value||[]).forEach(row=>{
         const ok = row.when==='hit' ? (ctx.hit.total>0) : (ctx.hit.hpLoss>0);

  const color = x.color===undefined && d ? d.color : (hex(x.color) ? x.color : '');
  const emoji = x.emoji===undefined && d ? d.emoji : (typeof x.emoji==='string' ? x.emoji.trim().slice(0,4) : '');
  const props = (x.props && typeof x.props==='object' && !Array.isArray(x.props)) ? {...x.props} : {};
  ELEMENT_PROP_DEFS.forEach(def=>{
    if(def.type==='list'){ const v = def.clean(props[def.key]); if(v.length) props[def.key] = v; else delete props[def.key]; return; }

// A pile entry is normally just a card id string (e.g. "strike" or "strike+" once
// upgraded). When a card grants an effect to another card (cardOp type "grantBuff"),
// that specific physical copy needs its own identity so the bonus doesn't leak onto
// every other copy of the same card. We do this by suffixing the raw id with
// "::<instanceId>" and storing the actual bonus numbers in S.run.instanceBuffs,
// keyed by that instance id. Every other part of the game keeps treating pile
// entries as opaque strings (splice/indexOf/etc. all still work unchanged) — only
// cardById() needs to know how to unpack the suffix.
function splitInstanceId(raw){
  if(typeof raw!=='string') return {cid:raw, iid:null};
  const idx = raw.lastIndexOf('::');
  if(idx===-1) return {cid:raw, iid:null};
  return {cid:raw.slice(0,idx), iid:raw.slice(idx+2)};
}
function withInstanceSuffix(cid, iid){ return iid ? (cid+'::'+iid) : cid; }
function upgradeRawId(raw){
  const {cid, iid} = splitInstanceId(raw);
  if(cid.endsWith('+')) return raw;
  return withInstanceSuffix(cid+'+', iid);
}

// Cards created by a "generate" card-operation only exist for the current combat.
// Their instance id is registered in r.temporaryCardIids; this strips any such card
// out of every pile (and drops its buff record) once the fight is over.
function purgeTemporaryCards(r){
  if(!r.temporaryCardIids) r.temporaryCardIids = {};
  if(!r.tempInstanceBuffs) r.tempInstanceBuffs = {};
  if(!r.tempUpgradeIids) r.tempUpgradeIids = {};
  const isTemp = (rawId)=>{
    const {iid} = splitInstanceId(rawId);
    return !!(iid && r.temporaryCardIids[iid]);
  };
  ['hand','draw','discard','exhausted'].forEach(pileName=>{
    if(!r[pileName]) return;
    r[pileName] = r[pileName].filter(rawId=>{
      if(isTemp(rawId)){
        const {iid} = splitInstanceId(rawId);
        if(r.instanceBuffs) delete r.instanceBuffs[iid];
        if(r.permExhaustIids) delete r.permExhaustIids[iid];
        return false;
      }
      return true;
    }).map(rawId=>{
      // Undo combat-only upgrades granted by a (non-permanent) card-operation.
      const {cid, iid} = splitInstanceId(rawId);
      if(iid && r.tempUpgradeIids[iid] && typeof cid==='string' && cid.endsWith('+')){
        return withInstanceSuffix(cid.slice(0,-1), iid);
      }
      return rawId;
    });
  });
  r.temporaryCardIids = {};
  r.tempInstanceBuffs = {};   // combat-only stat grants wear off
  r.tempUpgradeIids = {};
}

function isUpgradedInstanceId(raw){
  const cid = splitInstanceId(raw).cid;
  return typeof cid==='string' && cid.endsWith('+');
}

function upgradedCardView(base){
  const up = {...base, id: base.id+'+', name: base.name+'+', baseId: base.id};
  const upg = base.upgrades || {};
  up.cost = isXCost(base) ? base.cost : Math.max(0, (base.cost||0) + (upg.costDelta||0));
  up.scales = {};
  allEffectFieldDefs().forEach(def=>{
    const baseVal = base[def.key]!==undefined ? base[def.key] : (def.default||0);
    const min = def.min!==undefined ? def.min : 0;
    up[def.key] = Math.max(min, baseVal + (upg[def.key]||0));
    if(base.scales && base.scales[def.key]){
      const s = base.scales[def.key];
      const ppDelta = (upg.scalePP && upg.scalePP[def.key]) || 0;
      up.scales[def.key] = {...s, perPoint: s.perPoint + ppDelta};
    }
    // 「両方に付与」の相手への量にも、強化時の変化を反映する
    if(def._statusId && base['csT_'+def._statusId]==='both'){
      const xk = 'csX_'+def._statusId;
      up[xk] = Math.max(-99, (base[xk]|0) + (upg[xk]||0));
    }

  return up;
}

// ===== コスト =====
// costMode:'x' のカード（Xコスト）は、使用するとき所持エネルギーをすべて消費し、その値（X）を効果計算に渡す。エネルギー0では使えない。

function getDisplayedCardCost(c){ return isXCost(c) ? 'X' : c.cost; }

function withXValue(r, x, fn, done){

function cardById(id){
  const {cid, iid} = splitInstanceId(id);

  if(isUpgradedInstanceId(cid)){
    const base = S.cards.find(c=>c.id===cid.slice(0,-1));
    card = base ? upgradedCardView(base) : null;
  } else {
    card = S.cards.find(c=>c.id===cid);
  }
  if(!card) return null;
  const permBuffs = iid && S.run && S.run.instanceBuffs && S.run.instanceBuffs[iid];
  const tempBuffs = iid && S.run && S.run.tempInstanceBuffs && S.run.tempInstanceBuffs[iid];
  if((permBuffs && Object.keys(permBuffs).length) || (tempBuffs && Object.keys(tempBuffs).length)){
    const merged = {...card};
    // 補正の記録: 数値は加算、文字列（付与先 csT_<状態ID>）は上書き、'='+欄名 は「その値に上書き（set）」、__el は属性の付与／除去の記録

    [permBuffs, tempBuffs].forEach(b=>{
      if(!b) return;
      Object.keys(b).forEach(k=>{
        if(k==='__el'){ (b[k]||[]).forEach(x=>elOps.push(x)); return; }
        if(k==='__tags'){ (b[k]||[]).forEach(x=>tagOps.push(x)); return; }
        if(k.charAt(0)==='=') return;
        merged[k] = (typeof b[k]==='string') ? b[k] : ((merged[k]||0) + b[k]);
      });
      Object.keys(b).forEach(k=>{ if(k.charAt(0)==='=') merged[k.slice(1)] = b[k]; });
    });
    if(elOps.length){
      let els = Array.isArray(merged.elements) ? merged.elements.slice() : [];
      elOps.forEach(([kind,id])=>{
        if(kind==='+'){ if(id && elementById(id) && !els.includes(id)) els.push(id); }
        else if(id==='all' || !id) els = [];
        else els = els.filter(e=>!elementMatchesSelector(e, id));
      });
      merged.elements = els;
    }
    if(tagOps.length){
      const tg = Array.isArray(merged.tags) ? merged.tags.slice() : [];
      tagOps.forEach(t=>{ if(t && !tg.includes(t)) tg.push(t); });
      merged.tags = tg;
    }
    if(merged.cost<0) merged.cost = 0;   // 「コストを増減する」で0未満にはならない
    return merged;
  }
  return card;
}

// カードが持つカード操作（有効なもの）の配列。新形式は cardOps、旧形式の単一 cardOp にも対応する。
function cardOpsOf(c){
  if(!c) return [];
  if(Array.isArray(c.cardOps)) return c.cardOps.filter(o=>o && o.enabled!==false);
  return (c.cardOp && c.cardOp.enabled) ? [c.cardOp] : [];
}

// 効果付与の付与先の表記（カスタム状態の付与で、付与先を指定したときだけ）
function buffTargetText(op){

}

function cardOpDescParts(op){

// 「さらに選ぶ」の説明（操作の説明の末尾に付ける）
function opPickText(op){

function cardDescription(c){

      const src = allScaleSources().find(s=>s.key===scale.source);

  cardOpsOf(c).forEach(op=> parts.push(...cardOpDescParts(op)));
  const elNames = cardElementIds(c).map(elementName);
  if(elNames.length) parts.push(`属性: ${elNames.join('・')}`);
  { const et = effectiveCardTags(c); if(et.length) parts.push(`タグ: ${et.join(', ')}`); }
  if(c.exhaust) parts.push(`(使用後: 消滅)`);
  let desc = parts.length ? parts.join('。')+'。' : '効果なし';
  if(hasTrigger(c)){
    const _tl = tagListOf(c.triggerTag);
    const tagPart = _tl.length>1 ? tagCondText(c.triggerTag, c.triggerTagMode) : (_tl.length ? `[${_tl[0]}]` : '任意の');
    const durPart = triggerDurText(c);
    const tgp = tagCondText(c.triggerTag, c.triggerTagMode);
    const onKind = cleanTriggerOn(c.triggerOn);
    const th = triggerHitsOf(c);
    const both = hasImmediate(c);
    const head = both ? '【仕込み】' : '【仕込み】';
    const body = both ? `同じ効果${th>1?`を${th}回`:''}` : desc;
    let t = onKind==='damaged'
      ? `${head}今後、敵の攻撃で${c.triggerBlocked?'':'HPが減る'}ダメージを受けるたびに発動（${durPart}）: ` + body
      : onKind==='drawn'
      ? `${head}今後、カードの効果で${tgp}カードを引くたびに発動（${durPart}）: ` + body
      : onKind==='discarded'
      ? `${head}今後、カードの効果で${tgp}カードが捨て札に移るたびに発動（${durPart}）: ` + body
      : onKind==='turnStart'
      ? `${head}今後、${turnIntervalOf(c)>1 ? `${turnIntervalOf(c)}ターンごとに、` : '毎ターン、'}自分のターンの開始時に発動（${durPart}）: ` + body
      : `${head}今後${tagPart}カードを使うたびに発動（${durPart}）: ` + body;
    if(onKind!=='turnStart' && triggerEveryOf(c)>1) t = t.replace('たびに発動', `たびに数え、${triggerEveryOf(c)}回目ごとに発動`);
    desc = both ? `【即時】${desc} ／ ${t}` : t;
  }
  const drawParts = [];
  drawEffectFieldDefs().forEach(def=>{
    const v = c[def.key]||0;
    const show = def._statusId ? (v!==0 || (c['dw_csT_'+def._statusId]==='both' && ((c['dw_csX_'+def._statusId])|0)!==0)) : v>0;
    if(show) drawParts.push(def.desc(v, c));
  });
  if(drawParts.length) desc += `【ドロー時】${drawParts.join('。')}。`;
  const exParts = [];
  exhaustEffectFieldDefs().forEach(def=>{
    const v = c[def.key]||0;
    const show = def._statusId ? (v!==0 || (c['ex_csT_'+def._statusId]==='both' && ((c['ex_csX_'+def._statusId])|0)!==0)) : v>0;
    if(show) exParts.push(def.desc(v, c));
  });
  if(exParts.length) desc += `【消滅時】${exParts.join('。')}。`;
  const reqTexts = (Array.isArray(c.requirements) ? c.requirements : []).map(requirementText).filter(Boolean);
  if(reqTexts.length) desc = `【使用条件】${reqTexts.join('、')}。` + desc;
  // 冒頭の自由テキスト（カード編集の「説明文の冒頭」）
  if(c.descPrefix) desc = `<span class="desc-prefix">${escapeHtml(c.descPrefix)}</span> ` + desc;
  return desc;
}

/* ============================= DATA SAVE / LOAD ============================= */

// Everything the player edits (cards, relics, rules) can be exported to one JSON file and
// imported on another device or browser. To add a new kind of data later (custom statuses,
// enemies...), add one entry to DATA_SECTIONS — export, import, preview and backup pick it up.
// To change the file format, bump SAVE_FORMAT_VERSION and add a converter to SAVE_MIGRATIONS.
const SAVE_APP_ID = 'ashbound-codex';
const SAVE_FORMAT_VERSION = 1;
const BACKUP_KEY = 'backup_before_import';
// SAVE_MIGRATIONS[1] = (d)=>{ ...convert v1 data to v2...; d.version = 2; return d; };
const SAVE_MIGRATIONS = {};

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// IDs: letters, digits, _ and - only. A trailing "+" marks an upgraded card and "::" separates
// an instance id, so neither may appear in an id.
function validSaveId(id){ return typeof id==='string' && /^[A-Za-z0-9_-]{1,64}$/.test(id); }

// Names are inserted into the page as HTML (also inside value="..."), so strip the characters
// that could break out of it from anything that arrives in a file.
function deepClean(v){
  if(typeof v==='string') return v.replace(/[<>"]/g,'');
  if(Array.isArray(v)) return v.map(deepClean);
  if(v && typeof v==='object'){
    const o = {};
    Object.keys(v).forEach(k=>{ if(k!=='__proto__') o[k] = deepClean(v[k]); });
    return o;
  }
  return v;
}

// Fill in anything missing on imported items rather than trusting the file.
function normalizeCard(c){
  c = migrateCard({...c});
  c.cost = Number.isFinite(c.cost) ? Math.max(0, Math.floor(c.cost)) : 1;
  c.costMode = c.costMode==='x' ? 'x' : 'fixed';
  if(!RARITY_LABEL[c.rarity]) c.rarity = 'common';
  // 発動タイミング: 即時効果と予約（仕込み）を独立して有効にできる。旧データ（timing:'trigger'）は予約のみに移行し、hits は予約側（triggerHits）へ引き継ぐ。
  if(c.immediateEnabled===undefined && c.triggerEnabled===undefined){
    if(c.timing==='trigger'){ c.triggerEnabled = true; c.immediateEnabled = false; c.triggerHits = clampInt(c.hits,1,99,1); c.hits = 1; }
    else { c.immediateEnabled = true; c.triggerEnabled = false; }
  } else {
    c.triggerEnabled = !!c.triggerEnabled;
    c.immediateEnabled = c.immediateEnabled===undefined ? !c.triggerEnabled : !!c.immediateEnabled;
  }
  if(!c.immediateEnabled && !c.triggerEnabled) c.immediateEnabled = true;
  c.triggerHits = clampInt(c.triggerHits,1,99,1);
  c.turnInterval = clampInt(c.turnInterval,1,99,1);
  c.timing = (c.triggerEnabled && !c.immediateEnabled) ? 'trigger' : 'immediate';   // 旧版との互換用（新しい処理は hasTrigger / hasImmediate を使う）
  c.triggerOn = cleanTriggerOn(c.triggerOn);
  c.triggerEvery = triggerEveryOf(c);
  c.triggerBlocked = !!c.triggerBlocked;
  if(typeof c.triggerTag==='string') c.triggerTag = cleanTagList(c.triggerTag);
  c.triggerTagMode = cleanTagMode(c.triggerTagMode);
  if(!Array.isArray(c.tags)) c.tags = [];
  c.tags = c.tags.map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i);
  c.suppressTypeTag = !!c.suppressTypeTag; c.suppressCostTag = !!c.suppressCostTag;
  c.elements = Array.isArray(c.elements) ? c.elements.filter((id,i,a)=>typeof id==='string' && a.indexOf(id)===i) : [];
  if(!c.scales || typeof c.scales!=='object') c.scales = {};
  Object.keys(c.scales).forEach(k=>{ const x = c.scales[k]; if(x && typeof x==='object'){ x.tag = cleanTagList(x.tag); x.tagMode = cleanTagMode(x.tagMode); } });
  if(!Number.isFinite(c.startingCount)) c.startingCount = 0;
  if(typeof c.icon!=='string') c.icon = '';
  c.statusOp = normalizeCardStatusOp(c.statusOp);
  // カード操作は複数持てる（cardOps）。旧データの単一の cardOp は1件の配列に変換する。
  if(Array.isArray(c.cardOps)) c.cardOps = c.cardOps.filter(o=>o && typeof o==='object').map(normalizeStatusOp);
  else c.cardOps = (c.cardOp && c.cardOp.enabled) ? [normalizeStatusOp(c.cardOp)] : [];
  ensureOpIds(c.cardOps);
  delete c.cardOp;
  return c;
}
function normalizeRelic(r){
  r = migrateRelic({...r});
  if(!['common','uncommon','rare','special'].includes(r.rarity)) r.rarity = 'common';
  if(!r.effect || typeof r.effect!=='object') r.effect = {};
  if(!RELIC_TIMINGS.some(t=>t.key===r.timing)) r.timing = 'onPickup';
  if(typeof r.triggerTag!=='string') r.triggerTag = '';
  r.favorTag = cleanTagList(r.favorTag);
  r.triggerTag = cleanTagList(r.triggerTag);
  r.favorTagMode = cleanTagMode(r.favorTagMode);
  r.triggerTagMode = cleanTagMode(r.triggerTagMode);
  r.favorPct = clampInt(r.favorPct,0,1000,0);
  r.turnCond = ['eq','gte','every'].includes(r.turnCond) ? r.turnCond : 'always';   // ターン開始時の発動条件（always=毎ターン／eq=N回目だけ／gte=N回目以降／every=Nターンごと）
  r.turnN = clampInt(r.turnN,1,99,1);
  r.useLimit = clampInt(r.useLimit,0,99,0);                                  // 使える回数の上限（0で無制限）
  r.useScope = ['run','round','battle'].includes(r.useScope) ? r.useScope : 'run';   // 回数を数える範囲
  r.shopPrice = clampInt(r.shopPrice,0,9999,0);                              // ショップでの価格（0で標準）
  return r;
}
// カード操作の数値に付けられる参照増減。値: [最小, 最大]。参照増減の結果はこの範囲に収める。
const OP_SCALE_FIELDS = {countFixed:[0,99], countMin:[0,99], countMax:[0,99], buffAmount:[-999,999], costDelta:[-99,99], deckWeight:[1,99]};
const OP_SCALE_LABELS = {countFixed:'枚数', countMin:'ランダム最小', countMax:'ランダム最大', buffAmount:'付与量', costDelta:'コスト増減量', deckWeight:'重み'};
function cleanOpScales(sc){
  const out = {};
  if(!sc || typeof sc!=='object') return out;
  Object.keys(OP_SCALE_FIELDS).forEach(f=>{
    const x = sc[f];
    if(!x || typeof x.source!=='string' || !x.source || x.source==='none') return;
    out[f] = {source:x.source, tag: cleanTagList(x.tag), tagMode: cleanTagMode(x.tagMode), perPoint: clampFloat(x.perPoint,-10,10,0)};
  });
  return out;
}
function defaultStatusOp(){
  return {enabled:true, type:'moveToDiscard', fromPile:'hand', genPool:'normal', countMode:'fixed',
    countFixed:1, countMin:1, countMax:1, filterTag:'', filterTagMode:'any', buffField:'', buffAmount:0, costDelta:1, deckWeight:1, drawNext:false, sequential:false, pickMode:'none', pickCount:1, pickOptional:false, permanent:false};
}
// 空のIDに、カード内で一意なID（op1, op2…）を振る。すでにあるIDは変えない。
function ensureOpIds(list){
  const used = new Set();
  list.forEach(o=>{ if(o && o.id){ if(used.has(o.id)) o.id = ''; else used.add(o.id); } });
  let n = 1;
  list.forEach(o=>{ if(o && !o.id){ while(used.has('op'+n)) n++; o.id = 'op'+n; used.add(o.id); } });
  return list;
}
function normalizeStatusOp(o){
  const d = defaultStatusOp();
  o = (o && typeof o==='object') ? o : {};
  const okType = ['moveToHand','moveToDiscard','moveToDraw','moveToExhausted','upgrade','duplicate','play','grantBuff','costChange','captureEffect','elementAdd','elementRemove','generateToHand','generateToDraw','generatePlay','generateToEnemyDeck'];
  return {
    enabled:true,
    type: okType.includes(o.type) ? o.type : d.type,
    fromPile: PILE_OPTIONS.some(x=>x.key===o.fromPile) ? o.fromPile : d.fromPile,
    genPool: GENERATE_POOL_OPTIONS.some(x=>x.key===o.genPool) ? o.genPool : d.genPool,
    countMode: ['fixed','random','all','choose'].includes(o.countMode) ? o.countMode : d.countMode,
    countFixed: clampInt(o.countFixed,0,20,1),
    // 枚数の元: value=設定値／xLast=直前のカード操作の対象枚数(X)／xTotal=ここまでのカード操作の対象枚数の合計(X)。X×倍率＋設定値（加算）が、枚数になる
    countSource: ['xLast','xTotal'].includes(o.countSource) ? o.countSource : 'value',
    xMult: clampFloat(o.xMult,0,20,1),
    countMin: clampInt(o.countMin,0,20,1),
    countMax: clampInt(o.countMax,0,20,1),
    filterTag: cleanTagList(o.filterTag),
    filterTagMode: cleanTagMode(o.filterTagMode),
    buffField: typeof o.buffField==='string' ? o.buffField : '',
    buffAmount: clampInt(o.buffAmount,-99,99,0),
    addTags: cleanTagList(o.addTags),   // 効果付与で、対象のカードに追加するタグ（カンマ区切り）
    buffTarget: ['self','opponent'].includes(o.buffTarget) ? o.buffTarget : 'default',   // カスタム状態の付与先（default＝カード側の設定／状態の標準のまま）
    costDelta: clampInt(o.costDelta,-9,9,1),
    deckWeight: clampInt(o.deckWeight,1,99,1),
    drawNext: !!o.drawNext,
    sequential: !!o.sequential,
    // 「さらに選ぶ」: 対象が決まったあと、操作を行う前に、その中から pickCount 枚をランダム／プレイヤーが選ぶ。選ばれなかったカードには何も起きない（生成は作られない）。
    // 枚数の決め方が「プレイヤーが任意に選ぶ」のとき、「1枚ずつ選び直す」のときは使えない。pickOptional＝選ばなくてもよい（プレイヤーが選ぶときだけ）
    pickMode: (['random','choose'].includes(o.pickMode) && o.countMode!=='choose' && !o.sequential) ? o.pickMode : 'none',
    pickCount: clampInt(o.pickCount,1,20,1),
    pickOptional: o.pickMode==='choose' && !!o.pickOptional,
    permanent: !!o.permanent,
    exhaustMode: EXHAUST_MODES.some(m=>m.key===o.exhaustMode) ? o.exhaustMode : (o.permanent ? 'destroy' : 'combat'),
    buffSource: o.buffSource==='captured' ? 'captured' : 'fixed',   // fixed=設定した効果／captured=直前に取得した効果
    buffMode: o.buffMode==='set' ? 'set' : 'add',                  // add=加算／set=上書き
    captureFields: Array.isArray(o.captureFields) && o.captureFields.length ? o.captureFields.filter(k=>typeof k==='string').slice(0,80) : [CAPTURE_ALL],
    elementId: typeof o.elementId==='string' ? o.elementId.slice(0,64) : '',
    id: (typeof o.id==='string' && /^[A-Za-z0-9_-]{1,24}$/.test(o.id)) ? o.id : '',   // 効果の順番で、この操作を指す安定したID（カード内で一意）
    scales: cleanOpScales(o.scales),
    // 値（付与量・コスト増減量）を「設定値 × 対象の枚数」にする（枚数は、絞り込みと選択が終わったあとの実際の対象数）
    valueMode: o.valueMode==='targetCount' ? 'targetCount' : 'fixed',
    // 続けて、同じ対象のカードに行う操作（カードを追跡して順に行う。生成・敵のデッキへの追加は入れられない）
    ...(Array.isArray(o.then) && o.then.length ? {then: o.then.filter(t=>t && typeof t==='object' && !['generateToHand','generateToDraw','generatePlay','generateToEnemyDeck','useCardById','captureEffect'].includes(t.type)).slice(0,6)
      .map(t=>normalizeStatusOp({...t, then:[], countMode:'all', fromPile:'hand', sequential:false, filterTag:'', pickMode:'none'}))} : {}),
  };
}
function normalizeStatusEffect(x){
  if(!x || typeof x!=='object') return null;
  if(x.kind!=='cardOp' && !CUSTOM_STATUS_KINDS.some(k=>k.key===x.kind)) return null;
  const e = {
    kind: x.kind,
    magnitudeMode: x.magnitudeMode==='perStack' ? 'perStack' : 'fixed',
    magnitudeValue: DECIMAL_MAG_KINDS.includes(x.kind)
      ? (Number.isFinite(parseFloat(x.magnitudeValue)) ? Math.max(-999, Math.min(999, Math.round(parseFloat(x.magnitudeValue)*1000)/1000)) : 1)
      : clampInt(x.magnitudeValue,-999,999,1),
  };
  if(x.kind==='cardOp') e.op = normalizeStatusOp(x.op);
  if(ELEMENT_KINDS.includes(x.kind)) e.element = (typeof x.element==='string' && x.element) ? x.element.slice(0,64) : 'all';
  if(ELEMENT_ATTACH_KINDS.includes(x.kind)){
    e.element = (typeof x.element==='string' && x.element) ? x.element.slice(0,64) : '';
    if(x.kind==='elGrant' && e.element==='all') e.element = '';   // 付与に「全属性」はない
  }
  if(x.kind==='cardMod'){
    e.modField = (typeof x.modField==='string' && x.modField) ? x.modField.slice(0,80) : 'damage';
    e.modTag = cleanTagList(x.modTag);
    e.modTagMode = cleanTagMode(x.modTagMode);
    e.decayOnUse = !!x.decayOnUse;
    e.decayN = clampInt(x.decayN,1,99,1);
  }
  if(x.kind==='revive'){
    e.reviveUnit = x.reviveUnit==='percent' ? 'percent' : 'fixed';
    e.reviveGrants = (Array.isArray(x.reviveGrants) ? x.reviveGrants : []).filter(g=> g && typeof g.statusId==='string')
      .map(g=>({statusId:g.statusId, stacks:clampInt(g.stacks,1,99,1)}));
  }
  return e;
}
function parseExclTags(v){ return Array.isArray(v) ? v.map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i) : parseTags(v); }
function normalizeCustomStatus(st){
  st = {...st};
  st.tags = (Array.isArray(st.tags) ? st.tags : []).map(cleanTag).filter((t,i,a)=>t && a.indexOf(t)===i);
  st = migrateCustomStatus({...st});
  if(st.target!=='opponent') st.target = 'self';
  if(!Number.isFinite(st.perTurnDelta)) st.perTurnDelta = 0;
  st.persistent = !!st.persistent;
  st.color = (typeof st.color==='string' && /^#[0-9a-fA-F]{6}$/.test(st.color)) ? st.color : '';   // 付与エフェクトの色（空欄なら、良い状態/悪い状態の色）
  // 排他: 付与のときに、指定タグ（組み込みの強化・弱体などの同名タグも可）の状態をどう扱うか
  st.exclOverwrite = parseExclTags(st.exclOverwrite);   // 付与する前に、これらのタグの状態をすべて取り除く
  st.exclYield = parseExclTags(st.exclYield);           // これらのタグの状態が付与されている間は、自分を付与しない
  st.exclReplaced = parseExclTags(st.exclReplaced);     // これらのタグの状態が後から付与されたら、自分が消える
  st.exclGuard = parseExclTags(st.exclGuard);           // 自分がいる間、これらのタグの状態の付与を無効にする
  st.effects = (Array.isArray(st.effects) ? st.effects : []).map(normalizeStatusEffect).filter(Boolean);
  return st;
}
/* ============================= IMAGES ============================= */
// Pictures (enemies, events) are stored inside the data itself as small "data:" URLs, so
// they travel with save files and need no server. Uploads are shrunk first to keep the
// browser's storage (about 5 MB in total) from filling up.
const IMAGE_MAX_CHARS = 700000;
function cleanImage(v){
  return (typeof v==='string' && v.length<=IMAGE_MAX_CHARS && /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v)) ? v : '';
}
function imageFileToDataUrl(file, maxSide, done){
  if(!file || !/^image\//.test(file.type)){ done(null,'画像ファイルを選んでください。'); return; }
  const reader = new FileReader();
  reader.onerror = ()=> done(null,'画像を読み込めませんでした。');
  reader.onload = ()=>{
    const img = new Image();
    img.onerror = ()=> done(null,'画像を読み込めませんでした。');
    img.onload = ()=>{
      let side = maxSide, out = '';
      for(let attempt=0; attempt<5; attempt++){
        const scale = Math.min(1, side/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        out = cv.toDataURL('image/webp', 0.85);
        if(out.indexOf('data:image/webp')!==0) out = cv.toDataURL('image/png'); // browsers without WebP export
        if(out.length <= 350000) break;
        side = Math.round(side*0.75);
      }
      const clean = cleanImage(out);
      if(clean) done(clean); else done(null,'画像が大きすぎて縮小できませんでした。別の画像を試してください。');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// ドロップ確率（%）。dropCardChances は dropCardIds と同じ並び。未設定（旧データ）は100%。
function alignDropChances(e){
  const src = Array.isArray(e.dropCardChances) ? e.dropCardChances : [];
  e.dropCardChances = (e.dropCardIds||[]).map((_,i)=> clampInt(src[i],0,100,100));
  e.dropRelicChance = clampInt(e.dropRelicChance,0,100,100);
}
function normalizeEnemy(e){
  e = migrateEnemy({...e});
  if(!['normal','elite','boss'].includes(e.category)) e.category = 'normal';
  e.baseHp = Number.isFinite(e.baseHp) ? Math.max(1, Math.floor(e.baseHp)) : 30;
  e.weight = Number.isFinite(e.weight) ? Math.max(1, Math.floor(e.weight)) : 1;
  e.minFloor = clampInt(e.minFloor,1,99,1);     // この階層以降から出る（1で制限なし）
  e.minRound = clampInt(e.minRound,1,99,1);     // このラウンド以降から出る（1で制限なし）
  e.noRepeat = !!e.noRepeat;                    // 1度出たら、同じラウンドでは出ない
  if(!Array.isArray(e.deck)) e.deck = [];
  e.deck = e.deck.filter(x=> x && S.cards.some(c=>c.id===x.cardId))
    .map(x=>({cardId:x.cardId, weight: Number.isFinite(x.weight) ? Math.max(1, Math.floor(x.weight)) : 1}));
  if(!e.startEffect || typeof e.startEffect!=='object') e.startEffect = {};
  e.dropRelicId = typeof e.dropRelicId==='string' ? e.dropRelicId : '';
  e.dropCardIds = Array.isArray(e.dropCardIds) ? e.dropCardIds.filter(x=>typeof x==='string') : [];
  alignDropChances(e);
  e.startCards = e.startCards.filter(id=> typeof id==='string' && S.cards.some(c=>c.id===id));
  e.forcedMoves = cleanForcedMoves(e.forcedMoves);
  e.chains = cleanChains(e.chains);
  e.lines = cleanEnemyLines(e.lines);
  e.elementMods = cleanElementMods(e.elementMods);
  e.image = cleanImage(e.image);
  return e;
}
// ---- 敵の属性相性（弱点・耐性） ----
// elementMods: [{element:属性ID, pct:被ダメージの増減％}]。+50＝弱点（1.5倍）、-50＝耐性（半分）、-100＝無効。0は持たない。
function cleanElementMods(list){
  return (Array.isArray(list) ? list : []).filter(x=>x && typeof x==='object' && typeof x.element==='string' && x.element)
    .map(x=>({element:x.element.slice(0,64), pct:clampInt(x.pct,-100,500,0)})).filter(x=>x.pct!==0).slice(0,30);
}
// ---- 敵のセリフ ----
// 各セリフは、条件を満たしたとき戦闘中に1回だけ言う。trigger の種類と、HPの割合(pct)を使うもの。
const ENEMY_LINE_TRIGGERS = [
  {key:'start',          label:'戦闘開始時'},
  {key:'playerHpBelow',  label:'プレイヤーのHPが残り○％以下になったとき', pct:true},
  {key:'selfHpBelow',    label:'自身のHPが残り○％以下になったとき', pct:true},
  {key:'selfDefeated',   label:'自身が倒されたとき（HPが0になり、復活しなかったとき）'},
  {key:'selfRevived',    label:'自身が復活したとき'},
  {key:'playerDefeated', label:'プレイヤーが倒されたとき（HPが0になり、復活しなかったとき）'},
  {key:'playerRevived',  label:'プレイヤーが復活したとき'},
];
function cleanEnemyLines(list){
  return (Array.isArray(list) ? list : []).filter(x=> x && typeof x==='object' && typeof x.text==='string' && x.text.trim()
      && ENEMY_LINE_TRIGGERS.some(t=>t.key===x.trigger))
    .map(x=>({id: (typeof x.id==='string' && x.id) ? x.id.slice(0,40) : newId(), trigger:x.trigger,
              pct: clampInt(x.pct,1,100,50), text: x.text.trim().slice(0,200)}));
}
// Only known keys of the right type are taken (numbers stay numbers, switches stay booleans).
function cleanSettings(obj){
  const out = {};
  Object.keys(DEFAULT_SETTINGS).forEach(k=>{
    const dv = DEFAULT_SETTINGS[k], v = obj[k];
    if(typeof dv==='boolean' && typeof v==='boolean') out[k] = v;
    else if(typeof dv==='number' && typeof v==='number' && Number.isFinite(v)) out[k] = Math.max(0, Math.floor(v));
  });
  return out;
}

function buildSaveData(keys){
  const data = {app:SAVE_APP_ID, version:SAVE_FORMAT_VERSION, exportedAt:new Date().toISOString()};
  DATA_SECTIONS.forEach(sec=>{
    if(!keys || keys.includes(sec.key)) data[sec.key] = JSON.parse(JSON.stringify(sec.get()));
  });
  return data;
}

// Text -> validated data. Throws an Error with a readable message if anything is wrong.
function parseSaveText(text){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('JSONとして読み取れませんでした。ファイルが壊れているか、別の形式のデータです。'); }
  if(!data || typeof data!=='object' || data.app!==SAVE_APP_ID){
    throw new Error('このゲームの保存データではありません。');
  }
  let v = parseInt(data.version,10);
  if(isNaN(v) || v<1) throw new Error('バージョン情報が不正です。');
  if(v>SAVE_FORMAT_VERSION) throw new Error(`より新しい形式（v${v}）のファイルです。ゲーム側を更新してください。`);
  while(v<SAVE_FORMAT_VERSION){
    const fn = SAVE_MIGRATIONS[v];
    if(!fn) throw new Error(`v${v}の変換処理がありません。`);
    data = fn(data);
    v = parseInt(data.version,10);
  }
  const result = {sections:{}, dups:{}, skipped:0, exportedAt: typeof data.exportedAt==='string' ? data.exportedAt : ''};
  // 正規化では、他のデータへの参照（敵のデッキのカード、属性、状態など）が「いま存在するか」を確かめて、無いものを取り除く。
  // 同じファイルで一緒に読み込むカード・状態・属性・レリックは、まだ保存前なので、正規化のあいだだけ、いまのデータに加えて見せる
  // （そうしないと、新しいカードを参照する敵の行動などが、1回目の読み込みで消えてしまう）。
  const incomingRaw = {};
  DATA_SECTIONS.forEach(sec=>{
    if(sec.kind!=='list' || !(sec.key in data) || !Array.isArray(data[sec.key])) return;
    incomingRaw[sec.key] = data[sec.key].map(deepClean).filter(x=>sec.check(x));
  });
  const stateKeyOf = {cards:'cards', relics:'relics', customStatuses:'customStatuses', elements:'elements', enemies:'enemies', events:'events'};
  const saved = {};
  Object.keys(incomingRaw).forEach(k=>{
    const sk = stateKeyOf[k]; saved[sk] = S[sk];
    const ids = new Set(incomingRaw[k].map(x=>x.id));
    S[sk] = incomingRaw[k].concat((S[sk]||[]).filter(x=>!ids.has(x.id)));
  });
  try{
    DATA_SECTIONS.forEach(sec=>{
      if(!(sec.key in data)) return;
      const raw = data[sec.key];
      if(sec.kind==='list'){
        if(!Array.isArray(raw)) return;
        const seen = new Set(), items = [];
        raw.forEach(x=>{
          x = deepClean(x);
          if(sec.check(x) && !seen.has(x.id)){ seen.add(x.id); items.push(sec.normalize(x)); }
          else result.skipped++;
        });
        const cur = new Set((saved[stateKeyOf[sec.key]] || sec.get()).map(x=>x.id));
        result.dups[sec.key] = items.filter(x=>cur.has(x.id)).length;
        result.sections[sec.key] = items;
      } else if(raw && typeof raw==='object' && !Array.isArray(raw)){
        result.sections[sec.key] = sec.key==='world' ? cleanWorld(deepClean(raw)) : cleanSettings(deepClean(raw));
      }
    });
  } finally {
    Object.keys(saved).forEach(sk=>{ S[sk] = saved[sk]; });
  }
  if(Object.keys(result.sections).length===0) throw new Error('読み込めるデータが含まれていません。');
  return result;
}

// mode: 'replace' (swap everything) | 'overwrite' (add; same id is overwritten) | 'skip' (add; same id is kept)
function applySaveData(parsed, mode, keys, makeBackup){
  if(makeBackup){
    // Safety net: keep the state from before the import (ignore failures such as a full storage).
    try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(buildSaveData())); }catch(e){ console.error(e); }
  }
  const results = [];
  DATA_SECTIONS.forEach(sec=>{
    const incoming = parsed.sections[sec.key];
    if(incoming===undefined || !keys.includes(sec.key)) return;
    if(sec.kind==='list'){
      if(incoming.length===0){ results.push(`${sec.label}: 有効なデータが0件のため変更しませんでした。`); return; }
      if(mode==='replace'){
        sec.set(incoming);
        results.push(`${sec.label}: ${incoming.length}件で置き換えました。`);
      } else {
        const cur = sec.get().slice();
        const idx = new Map(cur.map((x,i)=>[x.id,i]));
        let added = 0, replaced = 0, skipped = 0;
        incoming.forEach(x=>{
          if(idx.has(x.id)){
            if(mode==='overwrite'){ cur[idx.get(x.id)] = x; replaced++; } else skipped++;
          } else { cur.push(x); idx.set(x.id, cur.length-1); added++; }
        });
        sec.set(cur);
        results.push(`${sec.label}: 追加${added}件・上書き${replaced}件・そのまま${skipped}件。`);
      }
    } else {
      if(mode==='replace') sec.set(Object.assign({}, DEFAULT_SETTINGS, incoming));
      else if(mode==='overwrite') sec.set(Object.assign({}, sec.get(), incoming));
      else { results.push(`${sec.label}: 「そのまま残す」を選んだため変更しませんでした。`); return; }
      results.push(`${sec.label}: 読み込みました。`);
    }
  });
  return results;
}

function downloadTextFile(filename, text){
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

      if(!confirm('直前の読み込みの前の状態に戻します。今のデータは上書きされます。よろしいですか？')) return;
      try{
        const parsed = parseSaveText(localStorage.getItem(BACKUP_KEY)||'');
        applySaveData(parsed, 'replace', DATA_SECTIONS.map(s=>s.key), false);
        localStorage.removeItem(BACKUP_KEY);
        st.msg = '読み込み前の状態に戻しました。';
      }catch(e){ st.msg = '元に戻せませんでした: ' + e.message; }
      renderDataScreen();
    };
  }
}

function clampInt(v,min,max,def){
  v = parseInt(v,10); if(isNaN(v)) return def; return Math.max(min,Math.min(max,v));
}
function clampFloat(v,min,max,def){
  v = parseFloat(v); if(isNaN(v)) return def; return Math.max(min,Math.min(max,v));
}

// 参照元の一覧。カスタム状態ごとに「自分の○○スタック数」「敵の○○スタック数」を追加する
function allScaleSources(){
  const extra = [];
  (S.customStatuses||[]).forEach(st=>{
    const nm = `${st.emoji?st.emoji+' ':''}${st.name}`;
    extra.push({key:'csSelf:'+st.id, label:`自分の「${nm}」スタック数`});
    extra.push({key:'csEnemy:'+st.id, label:`敵の「${nm}」スタック数`});
  });
  return SCALE_SOURCES.concat(extra);
}
// actor='enemy' のとき、「自分」は行動する敵、「敵」はプレイヤーとして数える。
// 敵には手札・山札・ゴールドがないため、それらを参照する項目は0になる。
function scaleSourceValue(key, tag, actor, mode){
  const r = S.run; if(!r) return 0;
  const isE = actor==='enemy';
  const me = isE ? r.enemy : r.player;
  const foe = isE ? r.player : r.enemy;
  const n = (o,k)=> (o && Number(o[k])) || 0;
  if(typeof key==='string' && key.startsWith('csSelf:')) return customStatusStacks(me, key.slice(7));
  if(typeof key==='string' && key.startsWith('csEnemy:')) return foe ? customStatusStacks(foe, key.slice(8)) : 0;
  const ownPile = !isE;
  const tl = tagListOf(tag);           // 指定タグ（複数可）
  // 失っているHPの割合（％）。小数のまま返し、最終的な増減量の切り捨てだけで丸める
  const missPct = o=>{ const mx = n(o,'maxHp'); return mx>0 ? Math.max(0, Math.min(100, (mx - n(o,'hp'))/mx*100)) : 0; };
  switch(key){
    case 'playerStrength': return n(me,'strength') + n(me,'permStrength');
    case 'playerMetallicize': return n(me,'metallicize') + n(me,'permMetallicize');
    case 'playerBlock': return n(me,'block');
    case 'playerGold': return ownPile ? n(me,'gold') : 0;
    case 'playerMissingHp': return Math.max(0, n(me,'maxHp') - n(me,'hp'));
    case 'playerMissingHpPct': return missPct(me);
    case 'enemyMissingHpPct': return missPct(foe);
    case 'playerHandSize': return ownPile ? r.hand.length : 0;
    case 'playerDrawSize': return ownPile ? r.draw.length : 0;
    case 'playerDiscardSize': return ownPile ? r.discard.length : 0;
    case 'playerDrawDiscardSize': return ownPile ? r.draw.length + r.discard.length : 0;
    case 'enemyWeak': return n(foe,'weak');
    case 'enemyVulnerable': return n(foe,'vulnerable');
    case 'enemyPoison': return n(foe,'poison');
    case 'enemyBlock': return n(foe,'block');
    case 'enemyStrength': return n(foe,'strength');
    case 'cardsPlayedThisTurn': return ownPile ? (r.cardsPlayedThisTurn || 0) : 0;
    case 'combatPlayed': return ownPile ? ((r.combatStats||{}).played || 0) : 0;
    case 'combatTagPlayed': return ownPile && tl.length ? (((r.combatStats||{}).tagSetsPlayed)||[]).filter(set=>tagsMatch(set, tl, mode)).length : 0;
    case 'combatDrawn': return ownPile ? ((r.combatStats||{}).drawn || 0) : 0;
    case 'combatDiscarded': return ownPile ? ((r.combatStats||{}).discarded || 0) : 0;
    case 'combatExhausted': return ownPile ? (r.exhausted||[]).length : 0;
    case 'combatHitsTaken': return ownPile ? ((r.combatStats||{}).hitsTaken || 0) : 0;
    case 'combatTurn': return ownPile ? (r.turnNo || 0) : 0;
    case 'xValue': return ownPile ? (r.xValue || 0) : 0;
    case 'lastOpTargets': return ownPile ? ((r._opX||{}).last || 0) : 0;
    case 'totalOpTargets': return ownPile ? ((r._opX||{}).total || 0) : 0;
    case 'tagCountHand': return ownPile && tl.length ? r.hand.filter(cid=>{ const c=cardById(cid); return c && cardMatchesTags(c, tl, mode); }).length : 0;
    case 'tagCountPlayedThisTurn': return ownPile && tl.length ? (r.tagSetsPlayedThisTurn||[]).filter(set=>tagsMatch(set, tl, mode)).length : 0;
    case 'tagKindsHand': return ownPile ? distinctTagKinds(r.hand.map(cid=>effectiveCardTags(cardById(cid))), tl) : 0;
    case 'tagKindsPlayedThisTurn': return ownPile ? distinctTagKinds([r.tagsPlayedThisTurn||[]], tl) : 0;
    case 'tagKindsDrawDiscard': return ownPile ? distinctTagKinds([...r.draw, ...r.discard].map(cid=>effectiveCardTags(cardById(cid))), tl) : 0;
    case 'selfTagStacks': return tl.length ? tagStacks(me, tl, mode) : 0;
    case 'enemyTagStacks': return tl.length ? tagStacks(foe, tl, mode) : 0;
    case 'tagCountDrawDiscard': return ownPile && tl.length ? [...r.draw, ...r.discard].filter(cid=>{ const c=cardById(cid); return c && cardMatchesTags(c, tl, mode); }).length : 0;
    default: return 0;
  }
}
function scaleBonus(c, field, actor){
  const s = c.scales && c.scales[field];
  if(!s || !s.source || s.source==='none') return 0;
  return Math.floor((s.perPoint||0) * scaleSourceValue(s.source, s.tag, actor, s.tagMode));
}
// 敵が使うカードの効果値（参照増減を含む）
function enemyVal(c, key){ return Math.max(0, (c[key]||0) + scaleBonus(c, key, 'enemy')); }
