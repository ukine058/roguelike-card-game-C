function cleanChains(list){
  return (Array.isArray(list) ? list : []).filter(x=> x && typeof x==='object' && S.cards.some(c=>c.id===x.fromId) && S.cards.some(c=>c.id===x.toId))
    .map(x=>({fromId:x.fromId, toId:x.toId}));
}
function forcedConditionMet(r, e, rule){
  const p = r.player, v = rule.value|0;
  const cmp = cur=> rule.cmp==='lte' ? cur<=v : rule.cmp==='eq' ? cur===v : cur>=v;
  // 状態の指定は、組み込みの名前／'cs:状態ID'／任意のタグ（使用条件と同じ）。削除された状態を指していれば成立しない。
  const stat = (ent, key)=> !!key && !!requirementStatLabel(key, rule.tagMode) && cmp(requirementValueOf(ent, key, rule.tagMode));
  switch(rule.subject){
    case 'turn': { const n = e.rollCount||0; return rule.cmp==='every' ? (v>0 && n%v===0) : (rule.cmp==='gte' ? n>=v : n===v); }
    case 'selfHpPct': return e.maxHp>0 && cmp(e.hp*100/e.maxHp);
    case 'playerHpPct': return p.maxHp>0 && cmp(p.hp*100/p.maxHp);
    case 'selfBlock': return cmp(e.block||0);
    case 'playerBlock': return cmp(p.block||0);
    case 'selfTag': return stat(e, rule.tag);
    case 'playerTag': return stat(p, rule.tag);

function pickForcedMove(r, e, followPending){
  const rules = e.forcedMoves || [];
  // 先送りされた確定行動は、次の予告で最優先に使う（先送りは1回だけ）
  if(e.deferredIdx>=0){
    const i = e.deferredIdx; e.deferredIdx = -1;
    if(rules[i] && cardById(rules[i].cardId)) return {idx:i, rule:rules[i], fromDefer:true};
  }
  for(let i=0;i<rules.length;i++){
    const rule = rules[i];
    if(!rule || !cardById(rule.cardId)) continue;
    if(rule.once && e.forcedUsed && e.forcedUsed[i]) continue;
    if(!forcedConditionMet(r, e, rule)) continue;
    if(followPending){
      const mode = rule.conflict || 'priority';
      if(mode==='ignore') continue;                          // 無視：この条件は成立しなかったことにする
      if(mode==='defer'){ e.deferredIdx = i; return {defer:true}; } // 先送り：今回は連続行動、次回にこの行動
    }
    return {idx:i, rule};
  }
  return null;
}
// 敵の行動で、カード自身のカード操作を（プレイヤーの次のターン開始時に処理するよう）予約する
function queueEnemyCardOp(r, e, move){
  if(!move || r.player.hp<=0) return;
  cardOpsOf(move).forEach(op=>{
    if(!GENERATE_TYPES.includes(op.type) && op.fromPile==='self') return;   // 敵が使うときは「そのカード自身」は効果なし
    enqueueEnemyOp(r, {...op, enabled:true, fromEnemy:true}, `${e.name}の「${move.name}」`, ': ');

// （そうしないと、加えたカードを次のターンに引けない）。
function enqueueEnemyOp(r, op, label, sep){

// 敵のカードの「使用後に消滅する」: 使ったカードをこの戦闘のデッキから取り除く（最後の1枚は残す）。
// entry を渡すと、そのデッキ項目を対象にする。渡さなければ、同じIDの最初の項目。
// 仕込みの発動のきっかけ: cardUsed=指定タグのカードを使う／damaged=ダメージを受ける／drawn=カードの効果でカードを引く／discarded=カードの効果でカードが捨て札に移る
function cleanTriggerOn(v){ return ['damaged','drawn','discarded','turnStart'].includes(v) ? v : 'cardUsed'; }

function enemyExhaustUsed(r, e, card, rawId, entry){

function rollEnemyMove(e){
  e.rollCount = (e.rollCount||0) + 1;
  e.nextForced = false;
  const follow = (e.followId && cardById(e.followId)) ? e.followId : '';   // 前の行動による「次は必ずこの行動」
  e.followId = '';
  const forced = S.run ? pickForcedMove(S.run, e, !!follow) : null;
  let id = '';
  if(forced && !forced.defer){
    if(forced.rule.once){ e.forcedUsed = e.forcedUsed || {}; e.forcedUsed[forced.idx] = true; }
    e.nextForced = true;
    id = forced.rule.cardId;
  } else if(follow){
    id = follow;
  } else {
    const deck = e.deck || [];
    if(deck.length===0) id = 'strike';
    else {
      const pool = deck.slice();
      const drawn = [];
      for(let i=0;i<3 && pool.length>0;i++){
        const idx = Math.floor(Math.random()*pool.length);
        drawn.push(pool[idx]);
        pool.splice(idx, 1);
      }
      id = weightedPickFrom(drawn).cardId;
    }
  }

  const ch = (e.chains||[]).find(c=> c.fromId===id && cardById(c.toId));
  e.followId = ch ? ch.toId : ((forced && forced.fromDefer) ? follow : '');
  return id;
}

function makeEnemy(floorIndex, forcedCategory, scaleIndex){
  const s = S.settings;
  const isElite = (floorIndex % s.eliteEvery === 0);
  const isLast = floorIndex === s.floorCount;
  // forcedCategory: マップのマスで決まった種類（boss / elite / normal）。なければ従来どおり階層から決める
  const category = forcedCategory || (isLast ? 'boss' : (isElite ? 'elite' : 'normal'));
  let pool = S.enemies.filter(e => e.category===category);
  if(pool.length===0) pool = S.enemies.filter(e=>e.category==='normal');
  if(pool.length===0) pool = S.enemies;
  {  // 出現条件: 最小階層・最小ラウンド・同じラウンドでは1度だけ。合う敵がいなければ、条件をゆるめる
    const run = S.run, rd = (run && run.round) || 1, seen = (run && run.seenEnemies) || [];
    const okMin = e=> (e.minRound||1)<=rd && (e.minFloor||1)<=floorIndex;
    const okSeen = e=> !(e.noRepeat && seen.includes(e.id));
    let cand = pool.filter(e=>okMin(e) && okSeen(e));
    if(!cand.length) cand = pool.filter(okMin);
    if(!cand.length) cand = pool;
    pool = cand;
  }
  const totalWeight = pool.reduce((sum,e)=> sum + (e.weight||1), 0);
  let x = Math.random()*totalWeight;
  let t = pool[pool.length-1];
  for(const e of pool){ x -= (e.weight||1); if(x<=0){ t = e; break; } }
  if(S.run){ (S.run.seenEnemies = S.run.seenEnemies || []).push(t.id); }
  // 敵のHP補正は、ラウンドをまたいだ通しの階層数で増える
  const scale = 1 + (Math.max(0,(scaleIndex||floorIndex)-1) * (s.enemyHpScalePct/100));
  const hp = Math.round(t.baseHp * scale);
  const runtimeEnemy = {
    defId: t.id, name: t.name, emoji: t.emoji, image: t.image||'', elite: t.category==='elite', boss: t.category==='boss',
    hp, maxHp: hp, block:0, strength:0, dexterity:0, weak:0, vulnerable:0, poison:0, stun:0, thorns:0,
    // copied, so cards added during the battle never touch the enemy's saved definition
    deck: (t.deck && t.deck.length ? t.deck : [{cardId:'strike', weight:1}]).map(x=>({...x})),
    customStatus: {}, triggers: [], startEffect: t.startEffect || {},
    dropRelicId: t.dropRelicId || '', dropCardIds: (t.dropCardIds||[]).slice(),
    dropCardChances: (t.dropCardChances||[]).slice(), dropRelicChance: t.dropRelicChance===undefined ? 100 : t.dropRelicChance,
    startCards: (t.startCards||[]).slice(), forcedMoves: (t.forcedMoves||[]).map(x=>({...x})), forcedUsed: {}, rollCount: 0, nextForced: false,
    chains: (t.chains||[]).map(x=>({...x})), followId: '', deferredIdx: -1,
    lines: (t.lines||[]).map(x=>({...x})),
    elementMods: (t.elementMods||[]).map(x=>({...x})),
  };
  runtimeEnemy.nextMoveId = rollEnemyMove(runtimeEnemy);
  return runtimeEnemy;
}

function startRunBody(){

  if(S.settings.startRelicPickEnabled){ S.screen='startRelicPick'; renderStartRelicPick(); return; }
  afterStartRelics();
}

// ログは新しいものが上。kind: 'hit'(HPが減った) / 'guard'(全部防いだ) / 'deal'(自分の攻撃) / 'sum'(まとめ) / 'turn'(ターン区切り)。
// detail を渡すと、その行の下に小さく内訳を表示する。
const LOG_MAX = 400;
let LOG_EXPANDED = false;
function pushLog(msg, kind, detail){
  let html = kind ? `<span class="lg lg-${kind}">${msg}</span>` : msg;
  if(detail) html += `<span class="lg-sub">${detail}</span>`;
  if(LOG_GROUPS.length){ LOG_GROUPS[LOG_GROUPS.length-1].lines.push(html); return; }
  S.run.log.unshift(html);
  if(S.run.log.length>LOG_MAX) S.run.log.pop();
}
/* ===== 戦闘エフェクト（数字・ヒットの光と揺れ・状態付与） =====
   ゲームの処理は一瞬で終わるので、処理側は fxHit / fxHeal / fxBlock / fxLose / fxStatus で「何が起きたか」を記録するだけにする。
   記録は fxFlush で少しずつずらして、画面の外側の層（#fx-layer）に再生する（戦闘画面は描き直されても消えない）。
   エフェクトはゲームの進行を止めない。止めるのは、倒されたとき（fxSettle）だけ。 */
const FX = {prefs:{on:true, speed:1, simple:'auto'}, queue:[], flushing:false, endAt:0, hpShown:{player:null, enemy:null}, ghostTimer:null};
function fxLoadPrefs(){
  try{ const v = JSON.parse(localStorage.getItem('fxPrefs')||'null');
    if(v && typeof v==='object') FX.prefs = {on: v.on!==false, speed: [0.5,1,1.5,2].includes(+v.speed) ? +v.speed : 1, simple: ['auto','on','off'].includes(v.simple) ? v.simple : 'auto'}; }catch(e){}
}
function fxSavePrefs(){ try{ localStorage.setItem('fxPrefs', JSON.stringify(FX.prefs)); }catch(e){} }
fxLoadPrefs();
const FX_STAGGER_MS = 170;
const FX_BUILTIN = {   // 組み込みの状態: [絵文字, 名前, 色の種類]
  strength:['💪','強化','buff'], permStrength:['💪','強化','buff'], dexterity:['🤸','器用','buff'], permDexterity:['🤸','器用','buff'],
  weak:['😮‍💨','弱体','debuff'], vulnerable:['🎯','脆弱','debuff'], poison:['☠️','毒','poison'], regen:['✨','再生','buff'], stun:['💫','麻痺','debuff'],
  metallicize:['🛡️','自動','buff'], permMetallicize:['🛡️','自動','buff'], thorns:['🌵','棘','buff'], permThorns:['🌵','棘','buff'],
};
function fxWorldColor(kind){
  const w = S.world || DEFAULT_WORLD;
  return w[{damage:'colorDamage', block:'colorBlock', heal:'colorHeal', poison:'colorPoison', buff:'colorBuff', debuff:'colorDebuff'}[kind]] || '#ffffff';
}
function fxSide(entity){
  const r = S.run; if(!r || S.screen!=='battle') return null;
  return entity===r.player ? 'player' : (entity===r.enemy ? 'enemy' : null);
}
// 簡易表示（揺れ・光・輪・オーラ・HPバーの残像を省き、数字だけをフェードで出す）。設定が 'auto' のときだけ、OSの「動きを減らす」に従う
function fxReduced(){
  if(FX.prefs.simple==='on') return true;
  if(FX.prefs.simple==='off') return false;
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; }
}
function fxEmit(ev){
  if(!FX.prefs.on || !ev.side) return;
  FX.queue.push(ev);
  if(!FX.flushing){ FX.flushing = true; setTimeout(fxFlush, 0); }
}
// 攻撃が持つ属性のうち、最初に色か絵文字が設定されているものを使う
function fxElementStyle(elems){
  for(const id of (elems||[])){
    const el = elementById(id);
    if(el && (el.color || el.emoji)) return {color: el.color||'', emoji: el.emoji||''};
  }
  return {color:'', emoji:''};
}
function fxHit(entity, hit, elems){
  const side = fxSide(entity); if(!side || !hit || !(hit.total>0)) return;
  const st = fxElementStyle(elems);
  fxEmit({type:'hit', side, hpLoss:hit.hpLoss||0, blocked:hit.blocked||0, pierce:!!hit.pierce || hit.pierceAmt>0, color: st.color || fxWorldColor('damage'), emoji: st.emoji});
}
function fxHeal(entity, n){ const side = fxSide(entity); if(side && n>0) fxEmit({type:'num', side, text:'+'+n, color:fxWorldColor('heal')}); }
function fxBlock(entity, n){ const side = fxSide(entity); if(side && n>0) fxEmit({type:'num', side, text:blockIcon()+'+'+n, color:fxWorldColor('block'), small:true}); }
// 攻撃以外でHPが減るとき（毒・反射・代償など）。kind='poison' なら毒の色
function fxLose(entity, n, kind){
  const side = fxSide(entity); if(!side || !(n>0)) return;
  fxEmit({type:'hit', side, hpLoss:n, blocked:0, color: fxWorldColor(kind==='poison' ? 'poison' : 'damage'), emoji:''});
}
function fxStatus(entity, label, color, n){
  const side = fxSide(entity); if(!side || !(n>0)) return;
  fxEmit({type:'status', side, text:`${label} +${n}`, color});
}
function fxStatusColorOf(st){ return st.color || fxWorldColor(st.target==='opponent' ? 'debuff' : 'buff'); }
function fxLayer(){
  let l = document.getElementById('fx-layer');
  if(!l){ l = document.createElement('div'); l.id = 'fx-layer'; document.body.appendChild(l); }
  return l;
}
function fxRectOf(side){
  const p = document.querySelector(`.combatant.${side} .portrait`);
  const rc = p ? p.getBoundingClientRect() : null;
  if(rc && rc.width) return {x: rc.left+rc.width/2, y: rc.top+rc.height/2, w: rc.width, h: rc.height, top: rc.top, node:p};
  const vw = window.innerWidth||800, vh = window.innerHeight||600;
  return {x: vw*(side==='player'?0.25:0.75), y: vh*0.3, w:96, h:96, top: vh*0.3-48, node:null};
}
function fxPut(node, ms){
  const l = fxLayer();
  if(l.children.length>40) return;   // 同時に出す数の上限（重くならないように）
  l.appendChild(node);
  setTimeout(()=> node.remove(), ms+80);
}
function fxNum(side, text, color, opts){
  opts = opts||{};
  const rc = fxRectOf(side), sp = FX.prefs.speed, dur = Math.round(1100/sp);
  const n = document.createElement('div');
  n.className = 'fx-num' + (opts.big?' lg':'') + (opts.small?' sm':'') + (fxReduced()?' simple':'');
  n.textContent = text;
  n.style.left = rc.x+'px'; n.style.top = (rc.top + rc.h*0.15 + (opts.row||0)*0)+'px';
  n.style.setProperty('--c', color); n.style.setProperty('--d', dur+'ms');
  n.style.setProperty('--dx', Math.round((Math.random()-0.5)*44)+'px');
  fxPut(n, dur);
}
function fxBurst(side, color, emoji, ring){
  if(fxReduced()) return;
  const rc = fxRectOf(side), sp = FX.prefs.speed, dur = Math.round(480/sp), size = Math.max(70, Math.min(rc.w, rc.h)*1.15);
  const b = document.createElement('div');
  b.className = 'fx-burst' + (ring?' ring':'');
  b.style.left = rc.x+'px'; b.style.top = rc.y+'px'; b.style.width = b.style.height = size+'px';
  b.style.setProperty('--c', color); b.style.setProperty('--d', dur+'ms');
  if(emoji) b.innerHTML = `<span>${escapeHtml(emoji)}</span>`;
  fxPut(b, dur);
}
function fxAura(side, color){
  if(fxReduced()) return;
  const rc = fxRectOf(side), sp = FX.prefs.speed, dur = Math.round(800/sp), size = Math.max(70, Math.min(rc.w, rc.h)*1.05);
  const a = document.createElement('div');
  a.className = 'fx-aura';
  a.style.left = rc.x+'px'; a.style.top = rc.y+'px'; a.style.width = a.style.height = size+'px';
  a.style.setProperty('--c', color); a.style.setProperty('--d', dur+'ms');
  fxPut(a, dur);
}
function fxShake(side){
  if(fxReduced()) return;
  const node = fxRectOf(side).node; if(!node || !node.animate) return;
  try{ node.animate([{transform:'translateX(0)', filter:'brightness(1.9)'},{transform:'translateX(-7px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)', filter:'brightness(1)'}], {duration: 330/FX.prefs.speed, easing:'ease-out'}); }catch(e){}
}
// 描き直したHPバーの残像を、少し待ってから、いまのHPの長さまで縮める（描き直しのたびに待ち直す）
function fxStartGhosts(){
  clearTimeout(FX.ghostTimer);
  const gs = [...document.querySelectorAll('.hpbar-ghost')];
  if(!gs.length) return;
  const sp = FX.prefs.speed;
  gs.forEach(g=> g.style.transitionDuration = Math.round(600/sp)+'ms');
  FX.ghostTimer = setTimeout(()=>{
    gs.forEach(g=>{ const to = parseFloat(g.dataset.to); g.style.width = to+'%'; FX.hpShown[g.dataset.side] = to; });
  }, Math.round(450/sp));
}
function fxPlay(ev){
  if(S.screen!=='battle') return;
  const sp = FX.prefs.speed;
  if(ev.type==='hit'){
    if(ev.blocked>0){
      fxNum(ev.side, blockIcon()+ev.blocked, fxWorldColor('block'), {small:true});
      if(ev.hpLoss<=0) fxBurst(ev.side, fxWorldColor('block'), '✦', true);
    }
    if(ev.hpLoss>0){
      const go = ()=>{ fxBurst(ev.side, ev.color, ev.emoji, ev.pierce); fxShake(ev.side); fxNum(ev.side, String(ev.hpLoss), ev.color, {big:true}); };
      if(ev.blocked>0) setTimeout(go, 110/sp); else go();
    }
  } else if(ev.type==='num'){
    fxNum(ev.side, ev.text, ev.color, {small:ev.small});
  } else if(ev.type==='status'){
    fxAura(ev.side, ev.color);
    fxNum(ev.side, ev.text, ev.color, {small:true});
  }
}
function fxFlush(){
  FX.flushing = false;
  const evs = FX.queue.splice(0); if(!evs.length) return;
  const sp = FX.prefs.speed, cnt = {player:0, enemy:0}, now = Date.now();
  evs.forEach(ev=>{
    const k = Math.min(cnt[ev.side]++, 8), delay = Math.round(k*FX_STAGGER_MS/sp);
    FX.endAt = Math.max(FX.endAt, now + delay + 950/sp);
    if(delay<=0) fxPlay(ev); else setTimeout(()=>fxPlay(ev), delay);
  });
}
// 倒されたとき: 最後の一撃のエフェクトが終わるまで（最大0.65秒）待ってから cont を実行する。待つ間はHP0の画面に描き直す
function fxSettle(cont){
  if(FX.queue.length) fxFlush();
  const rem = FX.prefs.on ? FX.endAt - Date.now() : 0;
  if(!(rem>40)){ cont(); return; }
  try{ if(S.screen==='battle') renderBattle(); }catch(err){ console.error(err); }
  setTimeout(cont, Math.min(rem, 650));
}

/* ===== 敵のセリフ（吹き出し） =====
   条件を満たしたセリフは、戦闘中に1回だけキューに積まれ、1つずつ吹き出しで表示される。
   表示はフェードイン、クリック／キー操作で送る（一定時間で自動でも消える）。ログにも残す。
   敵が倒された・プレイヤーが倒されたときは、セリフが全部消えるまで画面遷移を待つ（dialogueThen）。 */
const DLG = {queue:[], current:null, waiters:[], timer:null, layer:null, leaving:false};
const DLG_FADE_MS = 220;
function dlgAutoMs(text){ return Math.max(2500, Math.min(6000, 1400 + text.length*90)); }
function fireEnemyLine(l){
  const r = S.run; if(!r || !r.enemy || S.screen!=='battle') return;
  r.dlgFired = r.dlgFired || {};
  if(r.dlgFired[l.id]) return;
  r.dlgFired[l.id] = true;
  pushLog(`💬 ${escapeHtml(r.enemy.name)}「${escapeHtml(l.text)}」`, 'say');
  DLG.queue.push({name:r.enemy.name, emoji:r.enemy.emoji||'', image:r.enemy.image||'', text:l.text});
  if(!DLG.current) setTimeout(dlgPump, 0);
}
function fireEnemyLines(trigger){
  const r = S.run; if(!r || !r.enemy || !Array.isArray(r.enemy.lines)) return;
  r.enemy.lines.forEach(l=>{ if(l.trigger===trigger) fireEnemyLine(l); });
}
// HPの割合の条件（毎回の画面更新の前に確認する。HPが0以下のときは「倒されたとき」の担当なので対象外）
function scanEnemyLines(){
  const r = S.run; if(!r || !r.enemy || S.screen!=='battle' || !Array.isArray(r.enemy.lines) || !r.enemy.lines.length) return;
  const pct = o=> o.maxHp>0 ? o.hp/o.maxHp*100 : 100;
  r.enemy.lines.forEach(l=>{
    if(l.trigger==='playerHpBelow' && r.player.hp>0 && pct(r.player)<=l.pct) fireEnemyLine(l);
    if(l.trigger==='selfHpBelow' && r.enemy.hp>0 && pct(r.enemy)<=l.pct) fireEnemyLine(l);
  });
}
// trigger のセリフを言わせ、すべて消えてから cont を実行する（言うセリフがなければすぐ実行）
function dialogueThen(trigger, cont){
  fireEnemyLines(trigger);
  if(!DLG.current && !DLG.queue.length){ cont(); return; }
  // セリフを出す前に、HPバーを0に更新した戦闘画面へ描き直す（吹き出しはこの直後に出る）
  if(S.screen==='battle'){ try{ renderBattle(); }catch(err){ console.error(err); } }
  DLG.waiters.push(cont);
  if(!DLG.current) setTimeout(dlgPump, 0);
}
function dlgFlushWaiters(){
  const w = DLG.waiters; DLG.waiters = [];
  w.forEach(fn=>{ try{ fn(); }catch(err){ console.error(err); } });
}
function dlgReset(){
  clearTimeout(DLG.timer); DLG.timer = null;
  DLG.queue = []; DLG.current = null; DLG.leaving = false;
  if(DLG.layer){ DLG.layer.remove(); DLG.layer = null; }
}
function dlgPump(){
  if(DLG.current) return;
  if(S.screen!=='battle'){ DLG.queue = []; }   // 戦闘画面でなくなっていたら、残りは捨てる
  const item = DLG.queue.shift();
  if(!item){ dlgFlushWaiters(); return; }
  DLG.current = item; DLG.leaving = false;
  const layer = document.createElement('div');
  layer.id = 'dlg-layer';
  layer.innerHTML = `<div class="dlg-bubble"><div class="dlg-text">${escapeHtml(item.text).replace(/\n/g,'<br>')}</div></div>`;
  layer.onclick = ev=>{ ev.stopPropagation(); ev.preventDefault(); dlgDismiss(); };
  document.body.appendChild(layer);
  DLG.layer = layer;
  dlgReposition();
  requestAnimationFrame(()=> layer.classList.add('on'));
  clearTimeout(DLG.timer);
  DLG.timer = setTimeout(dlgDismiss, dlgAutoMs(item.text));
}
function dlgDismiss(){
  if(!DLG.current || DLG.leaving) return;
  DLG.leaving = true;
  clearTimeout(DLG.timer);
  const layer = DLG.layer;
  if(layer) layer.classList.remove('on');
  setTimeout(()=>{
    if(layer) layer.remove();
    if(DLG.layer===layer) DLG.layer = null;
    DLG.current = null; DLG.leaving = false;
    dlgPump();
  }, DLG_FADE_MS);
}
// 吹き出しを、プレイヤーと敵のアイコンの間の空間の上部に置く（敵のほうを向く）。
// 横は敵のアイコンの手前に右端をそろえる（敵寄り）、縦はアイコンの上端にそろえる。間が狭いときは、はみ出さない範囲で幅を詰める。
function dlgReposition(){
  const layer = DLG.layer; if(!layer) return;
  const b = layer.querySelector('.dlg-bubble'); if(!b) return;
  const vw = window.innerWidth || 800, vh = window.innerHeight || 600;
  const pp = document.querySelector('.combatant.player .portrait'), ep = document.querySelector('.combatant.enemy .portrait');
  const pr = pp ? pp.getBoundingClientRect() : null, er = ep ? ep.getBoundingClientRect() : null;
  const ok = pr && er && pr.width && er.width;
  const gap = ok ? Math.max(0, er.left - pr.right) : 0;
  b.style.maxWidth = ok ? Math.min(320, vw*0.88, Math.max(170, gap - 20))+'px' : '';
  const bw = b.offsetWidth || 260, bh = b.offsetHeight || 80;
  let top = ok ? Math.min(pr.top, er.top) : vh*0.18;
  // 横は、敵のアイコンの手前に右端をそろえる（敵寄り）。アイコンの間が狭くて入りきらないときは左へはみ出さない範囲で置く
  const left = ok ? Math.max(8, Math.min(vw - bw - 8, er.left - bw - 12)) : Math.max(8, vw*0.75 - bw/2);
  top = Math.max(8, Math.min(vh - bh - 8, top));
  b.style.left = left+'px'; b.style.top = top+'px';
}
document.addEventListener('keydown', ev=>{
  if(!DLG.current) return;
  if(ev.key==='Enter' || ev.key===' ' || ev.key==='Escape'){ ev.preventDefault(); ev.stopPropagation(); dlgDismiss(); }
}, true);
window.addEventListener('resize', dlgReposition);

// ---- 戦闘ログの書式 ----
// 1回の行動（カード使用・敵の行動）は「使用者：カード名」の見出しの下に、効果ごとの行をまとめて1件として残す。
// 効果の行:  {対象} に ダメージ{合計} ({基礎}{±参照増減}{±固定値}{×倍率 状態名}、{N}ブロック)
// 最後に、変化した値を「{対象}：HP 前 → 後」の形でまとめる（多段攻撃なら、最初の前と最後の後）。
const LOG_GROUPS = [];
function logGroupBegin(head){ LOG_GROUPS.push({head, lines:[], res:{}, order:[]}); }
function logResultLine(x){
  const t = `${x.who}：${x.label} ${x.before} → ${x.after}`;
  return x.cls ? `<span class="${x.cls}">${t}</span>` : t;
}
function logGroupEnd(){
  const g = LOG_GROUPS.pop(); if(!g) return;
  g.order.forEach(k=>{ const x = g.res[k]; if(x.before!==x.after) g.lines.push(logResultLine(x)); });
  const html = `<span class="lg lg-head">${g.head}</span>` + g.lines.map(l=>`<span class="lg-line">${l}</span>`).join('');
  if(LOG_GROUPS.length) LOG_GROUPS[LOG_GROUPS.length-1].lines.push(html);
  else S.run.log.unshift(html), (S.run.log.length>LOG_MAX && S.run.log.pop());
}
function logResult(key, who, label, before, after, cls){
  const g = LOG_GROUPS[LOG_GROUPS.length-1];
  if(!g){ if(before!==after) pushLog(logResultLine({who,label,before,after,cls})); return; }
  if(g.res[key]) g.res[key].after = after;
  else { g.res[key] = {who,label,before,after,cls}; g.order.push(key); }
}
function pctMult(pct){ return Math.round((1+pct/100)*1000)/1000; }
const EL_KIND_OF = {damageDealtFlat:'elDealtFlat', damageDealtPct:'elDealtPct', damageTakenFlat:'elTakenFlat', damageTakenPct:'elTakenPct'};
function csLabel(entity, kind, elems){
  const names = customEffectsOn(entity, kind).map(x=>x.st.name);
  if(EL_KIND_OF[kind]) elementEffectsOn(entity, EL_KIND_OF[kind], elems).forEach(x=>{
    const nm = x.st.name + '(' + (x.eff.element==='all' || !x.eff.element ? '全属性' : (String(x.eff.element).startsWith('tag:') ? 'タグ'+String(x.eff.element).slice(4) : (elementName(x.eff.element)||'属性'))) + ')';
    if(!names.includes(nm)) names.push(nm);
  });
  return names.length ? names.join('・') : '状態';

function nSign(n){ return (n>0?'+':'')+n; }
// 計算式。o: {base, scale, flats:[{v,label}], steps, blocked, pierce}
function logExprHTML(o){
  const parts = [`<span class="lg-n">基礎${o.base}</span>`];
  if(o.scale) parts.push(`<span class="lg-sc">${nSign(o.scale)}</span>`);
  let flat = 0; const names = [];
  (o.flats||[]).concat((o.steps||[]).filter(s=>s.t==='flat')).forEach(f=>{
    if(f.v){ flat += f.v; names.push(`${f.label}${nSign(f.v)}`); }
  });
  if(flat) parts.push(`<span class="${flat>0?'lg-fp':'lg-fm'}" title="${names.join(' ')}">${nSign(flat)}</span>`);
  (o.steps||[]).forEach(s=>{ if(s.t==='mult') parts.push(`<span class="lg-n lg-mul">×${s.v} ${s.label}</span>`); });
  let html = parts.join('');
  if(o.blocked>0) html += `、<span class="lg-blk">${o.blocked}ブロック</span>`;
  if(o.pierce) html += '、貫通';
  return html;
}
function logHeadPrefix(name){ return LOG_GROUPS.length ? '' : `${name}：`; }
function logHitLine(name, target, h, o){
  pushLog(`${logHeadPrefix(name)}${target}にダメージ<b>${h.total}</b> (${logExprHTML({...o, steps:h.steps, blocked:h.blocked, pierce:h.pierce && h.blockBefore>0})})`,

// ブロック獲得。who: 対象名、ent: 'p'|'e'、before/after: 獲得前後のブロック
function logBlockGain(name, who, ent, total, o, before, after){

// ダメージ・ブロック以外の効果。書式: {対象}に{効果名}{値} (基礎N±参照増減) → 最後に {対象}：{状態} 前 → 後
// 「従来」書式に切り替えたときは、legacy（旧来の1行）だけを出す。
let LOG_UNIFIED = (()=>{ try{ return localStorage.getItem('logUnified')!=='0'; }catch(e){ return true; } })();
function logStat(o){

  pushLog(`${logHeadPrefix(o.name)}${o.who}に${o.eff}<b>${shown}</b> (${logExprHTML({base:o.base, scale:o.v-o.base})})`);

/* ============================= MAP（マップ） =============================
   探索を、枝分かれ・合流する道のマップとして進める。上から下へ進み、最後の階層がボス。
   r.map = { rows, width, nodes:{ "行-列": {id,row,col,type,next:[id],visited,revealed} }, current:id|null, freeMoves:n }
   type: battle / elite / rest / event / shop / unknown(？) / boss
   拡張の余地:
   - r.map.freeMoves … 1以上のあいだ、次の階層の「つながっていないマス」も選べる（選ぶと1減る）。
     イベントやレリックからは grantMapFreeMoves(n) を呼ぶ。
   - mapSelectable(r) が「いま選べるマス」を返す唯一の窓口。道を封じる・開く効果は、ここに足す。
   - MAP_CFG の数値は、のちに設定画面に出す。 */
const MAP_CFG = {
  width: 5,          // 列の数
  paths: 4,          // 最初の階層から伸ばす道の数
  weights: {battle:50, unknown:20, event:12, shop:8, rest:10},   // 通常の階層のマスの出現比率
  unknownWeights: {battle:45, event:30, shop:10, rest:15},       // ？のマスに入ったときの中身（エリート・ボスにはならない）
  eliteChance: 60,   // エリートの階層で、各マスがエリートになる確率（％）。少なくとも1つはエリート
};
const MAP_ROW_H = 96;
const MAP_TYPES = ['battle','elite','rest','event','shop','unknown','boss'];
const MAP_TYPE_CAP = {battle:'Battle', elite:'Elite', rest:'Rest', event:'Event', shop:'Shop', unknown:'Unknown', boss:'Boss'};
// [設定のキー, 表示名, 初期値]（先頭5つ: 通常の階層／残り4つ: ？の中身）
const MAP_WEIGHT_FIELDS = [['mapWBattle','戦闘',50],['mapWUnknown','？',20],['mapWEvent','イベント',12],['mapWShop','ショップ',8],['mapWRest','休憩',10],
  ['mapUBattle','戦闘',45],['mapUEvent','イベント',30],['mapUShop','ショップ',10],['mapURest','休憩',15]];
// 設定画面の値から、マップの生成に使う設定を作る（MAP_CFG は初期値）
function mapCfg(){
  const st = S.settings || {};
  const g = (k,d)=> Number.isFinite(st[k]) ? st[k] : d;
  return {
    width: Math.max(3, Math.min(9, g('mapWidth', MAP_CFG.width))),
    paths: Math.max(2, Math.min(8, g('mapPaths', MAP_CFG.paths))),
    weights: {battle:g('mapWBattle',50), unknown:g('mapWUnknown',20), event:g('mapWEvent',12), shop:g('mapWShop',8), rest:g('mapWRest',10)},
    unknownWeights: {battle:g('mapUBattle',45), event:g('mapUEvent',30), shop:g('mapUShop',10), rest:g('mapURest',15)},
    eliteChance: Math.max(0, Math.min(100, g('mapEliteChance', MAP_CFG.eliteChance))),
  };
}
// 世界観の設定を反映した、マスの表示（アイコン・名前・色）
function mapInfo(t){
  const base = MAP_NODE_INFO[t], w = S.world || DEFAULT_WORLD, c = MAP_TYPE_CAP[t];
  return {icon: w['mapIcon'+c] || base.icon, label: w['mapLabel'+c] || base.label, desc: base.desc, color: w['colorMap'+c] || '#888'};
}
function roundLabel(n){
  const lines = String((S.world||{}).roundNames||'').split('\n').map(x=>x.trim());
  return lines[n-1] || `ラウンド${n}`;
}
// 次のマスを選ぶ場面の、選択の初期値
function mapDefaultPickId(r, sel){
  const ids = [...sel], mode = S.settings.mapDefaultPick;
  if(!ids.length || mode===0) return null;
  if(ids.length===1) return ids[0];
  if(mode===1) return null;
  const m = r.map, cur = m.current ? m.nodes[m.current] : null, ref = cur ? cur.col : (m.width-1)/2;
  return ids.map(id=>m.nodes[id]).sort((a,b)=> Math.abs(a.col-ref)-Math.abs(b.col-ref) || a.col-b.col)[0].id;
}
let __mapKeyBound = false;
const MAP_NODE_INFO = {
  battle:  {icon:'⚔️', label:'戦闘',     desc:'通常の敵と戦います。'},
  elite:   {icon:'💀', label:'エリート', desc:'強い敵との戦闘です。'},
  rest:    {icon:'🏕️', label:'休憩',     desc:'休んでHPを回復できます。'},
  event:   {icon:'📜', label:'イベント', desc:'さまざまな出来事が起こります。'},
  shop:    {icon:'🛒', label:'ショップ', desc:'ゴールドで買い物ができます。'},
  unknown: {icon:'❓', label:'？',       desc:'何が起こるか分かりません（戦闘・イベント・ショップ・休憩のどれか）。'},
  boss:    {icon:'👑', label:'ボス',     desc:'この探索の最後の戦いです。'},
};
function mapPickWeighted(w){
  const keys = Object.keys(w), total = keys.reduce((a,k)=>a+w[k],0);
  if(!(total>0)) return 'battle';
  let x = Math.random()*total;
  for(const k of keys){ x -= w[k]; if(x<=0) return k; }
  return keys[keys.length-1];
}
function generateMap(settings){
  const cfg = mapCfg();
  const F = Math.max(1, settings.floorCount|0), W = cfg.width;
  const eliteEvery = Math.max(1, settings.eliteEvery|0);
  const nodes = {}, idOf = (row,col)=>`${row}-${col}`;
  const ensure = (row,col)=>{ const k = idOf(row,col); if(!nodes[k]) nodes[k] = {id:k, row, col, type:'battle', next:[], visited:false}; return nodes[k]; };
  const bossCol = Math.floor(W/2);
  if(F===1){ ensure(1,bossCol).type = 'boss'; return {rows:1, width:W, nodes, current:null, freeMoves:0}; }
  const last = F-1;   // ボスの手前の階層
  const starts = [];
  for(let p=0; p<cfg.paths; p++){
    let col;
    do{ col = Math.floor(Math.random()*W); }while(p===1 && col===starts[0]);   // 最初の2本は別の列から
    starts.push(col);
    let cur = ensure(1, col);
    for(let row=1; row<last; row++){
      const cands = [];
      [-1,0,1].forEach(d=>{
        const nc = cur.col + d; if(nc<0 || nc>=W) return;
        // 道が交差しない: 隣のマスが、逆向きに伸びる道を持っていたら避ける
        if(d!==0){ const nb = nodes[idOf(row, cur.col+d)]; if(nb && nb.next.includes(idOf(row+1, cur.col))) return; }
        cands.push(nc);
      });
      const nx = ensure(row+1, cands[Math.floor(Math.random()*cands.length)]);
      if(!cur.next.includes(nx.id)) cur.next.push(nx.id);
      cur = nx;
    }
  }
  const boss = ensure(F, bossCol); boss.type = 'boss';
  Object.values(nodes).filter(n=>n.row===last).forEach(n=>{ n.next = [boss.id]; });
  for(let row=1; row<=last; row++){
    const list = Object.values(nodes).filter(n=>n.row===row);
    list.forEach(n=>{ n.type = row===1 ? 'battle' : mapPickWeighted(cfg.weights); });
    if(row===last && last>=2 && !list.some(n=>n.type==='rest')) list[Math.floor(Math.random()*list.length)].type = 'rest';   // ボスの手前に、休憩を最低1つ（ほかは通常どおり）
    if(row % eliteEvery === 0){                                          // エリートの階層（避けられるよう、通常の戦闘も混ぜる）
      list.forEach(n=>{ n.type = Math.random()*100 < cfg.eliteChance ? 'elite' : 'battle'; });
      if(!list.some(n=>n.type==='elite')) list[Math.floor(Math.random()*list.length)].type = 'elite';
    }
  }
  Object.values(nodes).forEach(n=>{ if(n.type==='unknown') n.hidden = mapPickWeighted(cfg.unknownWeights); });   // ？の中身は、生成時に決めておく
  return {rows:F, width:W, nodes, current:null, freeMoves:0};
}
// いま選べるマス。つながっている次の階層のマス。freeMoves があれば、次の階層のすべて
function mapSelectable(r){
  const m = r.map; if(!m) return [];
  const cur = m.current ? m.nodes[m.current] : null;
  const nextRow = cur ? cur.row+1 : 1;
  if(nextRow > m.rows) return [];
  const row = Object.values(m.nodes).filter(n=>n.row===nextRow).map(n=>n.id);
  if((m.freeMoves||0) > 0 || relicPassive(r, 'mapFree') > 0) return row;
  return cur ? cur.next.slice() : row;
}
function grantMapFreeMoves(n){ const r = S.run; if(r && r.map) r.map.freeMoves = (r.map.freeMoves||0) + (n|0); }
// display=true のとき、レリックの効果で？の中身が見えるならそれを返す
function mapNodeType(n, display){
  if(n.type!=='unknown') return n.type;
  if(n.revealed) return n.revealed;
  if(display && n.hidden && S.run && relicPassive(S.run, 'revealUnknown') > 0) return n.hidden;
  return 'unknown';
}
function mapEnterNode(id){
  const r = S.run, m = r.map, n = m && m.nodes[id];
  if(!n || !mapSelectable(r).includes(id)) return;
  const cur = m.current ? m.nodes[m.current] : null;
  if(cur && !cur.next.includes(id)){   // つながっていないマスを選んだとき: 特別な移動の回数、なければレリックの使える回数を消費
    if((m.freeMoves||0)>0) m.freeMoves--; else relicUsePassive(r, ['mapFree']);
  }
  m.current = id; n.visited = true; r.floor = n.row;
  let type = n.type;
  if(type==='unknown'){
    if(!n.revealed && relicPassive(r, 'revealUnknown') > 0) relicUsePassive(r, ['revealUnknown']);
    type = n.revealed = n.hidden || mapPickWeighted(mapCfg().unknownWeights);
  }
  if(type==='rest'){ r.restState = null; S.screen='rest'; renderRest(); }
  else if(type==='event'){ S.screen='event'; renderEvent(); }
  else if(type==='shop'){ S.screen='shop'; renderShop(); }
  else beginFloorLegacy(type==='boss' ? 'boss' : (type==='elite' ? 'elite' : 'normal'));
}
// ラウンドをまたいだ通しの階層数（敵のHP・ゴールドの計算に使う）
function mapGlobalFloor(r){ return ((r.round||1)-1) * S.settings.floorCount + r.floor; }
function beginFloor(){
  const r = S.run;
  if(!r.round) r.round = 1;
  if(r.map===undefined) r.map = generateMap(S.settings);
  if(!r.map){ beginFloorLegacy(); return; }   // マップなし（従来の直線の進行）
  S.screen = 'map'; renderMap();
}
// 戦闘・イベント・休憩・ショップのあと、次へ進む
function advanceFloor(){
  const r = S.run;
  if(r.map){
    const cur = r.map.current && r.map.nodes[r.map.current];
    if(cur && cur.row >= r.map.rows){   // ボスを倒した: 次のラウンドのマップへ（HP・永続の状態・デッキはそのまま引き継ぐ）
      r.round = (r.round||1) + 1; r.seenEnemies = [];
      relicResetUses(r, 'round');
      r.map = generateMap(S.settings);
    }
    S.screen = 'map'; renderMap(); return;
  }
  r.floor++; beginFloorLegacy();
}
function renderMap(){
  const r = S.run, m = r.map, W = m.width, H = m.rows*MAP_ROW_H;
  const sel = new Set(mapSelectable(r)), cur = m.current ? m.nodes[m.current] : null;

    return `<line class="${cls}" x1="${xOf(n)}" y1="${yOf(n)}" x2="${xOf(b)}" y2="${yOf(b)}"/>`;
  }).join('')).join('');

    const t = mapNodeType(n, true), info = mapInfo(t), peek = n.type==='unknown' && !n.revealed && t!=='unknown';
    const free = sel.has(n.id) && cur && !cur.next.includes(n.id);
    const cls = ['map-node', t, n.visited?'visited':'', (cur&&cur.id===n.id)?'current':'', sel.has(n.id)?'selectable':'', free?'free':'', peek?'peek':''].join(' ');
    return `<button class="${cls}" data-id="${n.id}" style="left:${xOf(n)}%; top:${yOf(n)}px; --nc:${info.color};"><span class="mi">${info.icon}</span><span class="ml">${peek?'？→':''}${info.label}</span></button>`;
  }).join('');
  const rowNos = Array.from({length:m.rows}, (_,i)=>`<span class="map-rowno" style="top:${(i+0.5)*MAP_ROW_H}px;">${i+1}</span>`).join('');
  const legend = MAP_TYPES.map(k=>{ const i = mapInfo(k); return `<span class="map-chip" style="border-color:${i.color};">${i.icon} ${i.label}</span>`; }).join('');
  const nextRow = cur ? cur.row+1 : 1;
  app().innerHTML = `
  <div class="screen map-screen">
    <div class="map-head">
      <p class="eyebrow">MAP</p>
      <h2>進む道を選べ</h2>
      <p class="hint" style="margin:6px 0;">${S.settings.roundCount>1 ? `${roundLabel(r.round||1)}（${r.round||1}/${S.settings.roundCount}） ・ ` : ''}階層 ${nextRow} / ${m.rows} ・ HP ${r.player.hp} / ${r.player.maxHp} ・ 💰${r.player.gold}</p>
      ${(m.freeMoves||0)>0 ? `<p class="hint" style="color:var(--gold);">特別な移動: 次の階層なら、つながっていないマスも選べます（残り${m.freeMoves}回）</p>` : ''}
      ${((m.freeMoves||0)===0 && relicPassive(r,'mapFree')>0) ? '<p class="hint" style="color:var(--gold);">レリックの効果: 次の階層なら、つながっていないマスも選べます</p>' : ''}
      ${relicPassive(r,'revealUnknown')>0 ? '<p class="hint" style="color:var(--gold);">レリックの効果: ？のマスの中身が分かります</p>' : ''}
      <div class="map-legend">${legend}</div>
    </div>
    <div class="map-wrap" style="height:${H}px;">
      <svg class="map-svg" viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="height:${H}px;">${lines}</svg>
      ${rowNos}${nodeHTML}
    </div>
    <div class="map-bar"><span id="map-info">光っているマスを選ぶと、中身が表示されます。</span><button class="primary" id="map-go" style="display:none;">この道へ進む</button></div>
  </div>`;
  let picked = null;
  const pick = (b)=>{
    const n = m.nodes[b.dataset.id], t = mapNodeType(n, true), info = mapInfo(t);
    app().querySelectorAll('.map-node.picked').forEach(x=>x.classList.remove('picked'));
    b.classList.add('picked');
    qs('#map-info').innerHTML = `<b>${info.icon} ${info.label}</b>（${n.row}階層）: ${info.desc}${(n.type==='unknown' && !n.revealed && t!=='unknown') ? '（？の中身）' : ''}${n.visited ? '（通過済み）' : (sel.has(n.id) ? '' : '（いまは進めません）')}`;

  // 選択の初期値（一本道のときなど、押す手間を減らす）。進むには「この道へ進む」かEnterキー
  { const def = mapDefaultPickId(r, sel); if(def){ const b = app().querySelector(`.map-node[data-id="${def}"]`); if(b) pick(b); } }

function beginFloorLegacy(forcedCategory){
  const r = S.run;
  if(r.battlesSinceSpecial===undefined) r.battlesSinceSpecial = 0;
  const isBoss = r.floor === S.settings.floorCount;
  const isElite = r.floor % S.settings.eliteEvery === 0;
  if(!forcedCategory && !isBoss && !isElite && r.battlesSinceSpecial>=2){
    r.battlesSinceSpecial = 0;
    const roll = Math.random();
    if(roll < 0.4){ S.screen='rest'; renderRest(); return; }
    else if(roll < 0.75){ S.screen='event'; renderEvent(); return; }
    else{ S.screen='shop'; renderShop(); return; }
  }
  r.battlesSinceSpecial++;
  // Rebuild the full card pool for the new battle: everything in the draw pile,
  // hand, discard pile, and exhaust pile returns and gets reshuffled. This mirrors
  // standard deckbuilder behavior and prevents cards from being lost between floors.
  LOG_GROUPS.length = 0;
  purgeTemporaryCards(r);
  r.permExhaustIids = r.permExhaustIids || {};
  const isStay = id=>{ const t = splitInstanceId(id).iid; return !!(t && r.permExhaustIids[t]); };
  const fullPool = [...r.draw, ...r.hand, ...r.discard, ...r.exhausted.filter(id=>!isStay(id))];
  const stayExhausted = [...r.draw, ...r.hand, ...r.discard, ...r.exhausted].filter(isStay);
  r.draw = shuffle(fullPool.filter(id=>!isStay(id)));
  r.hand = [];
  r.discard = [];
  r.exhausted = stayExhausted;   // 永続の消滅は、次の戦闘でも消滅札に残る

  // Temporary strength/dexterity/metallicize/thorns and any lingering statuses are
  // combat-only and reset here; the permanent versions (permStrength/permDexterity/
  // permMetallicize/permThorns) are untouched and carry across the run.
  r.player.strength = 0;
  r.player.dexterity = 0;
  r.player.metallicize = 0;
  r.player.thorns = 0;
  r.player.weak = 0;
  r.player.vulnerable = 0;
  r.player.poison = 0;
  r.player.regen = 0;
  { // 「戦闘後も残す」状態だけは、次の戦闘に持ち越す
    const keep = {};
    (S.customStatuses||[]).forEach(st=>{ const n = r.player.customStatus && r.player.customStatus[st.id]; if(st.persistent && n>0) keep[st.id] = n; });
    r.player.customStatus = keep;
  }
  r.activeTriggers = [];
  r.pileEvents = []; r._effectDepth = 0; r._pileTrigDepth = 0;
  relicResetUses(r, 'battle');
  r.combatStats = {played:0, tagsPlayed:[], tagSetsPlayed:[], drawn:0, discarded:0, hitsTaken:0};
  r.pendingTurnStartOps = [];

  r.enemy = makeEnemy(r.floor, forcedCategory, mapGlobalFloor(r));
  applyEnemyStartEffects(r, r.enemy, r.enemy.startEffect);
  r.player.block = 0; r.player.autoGranted = 0;
  r.log = [];
  r.turnNo = 0;
  r.dlgFired = {}; r.defeatWait = false; dlgReset(); FX.hpShown = {player:null, enemy:null}; clearTimeout(FX.ghostTimer);   // 敵のセリフ: 戦闘ごとに「1回だけ」を数え直す
  pushLog(`${r.enemy.name}が現れた！`);
  applyNextCombatEffects(r);
  runEnemyStartCards(r);
  // 戦闘開始時の状態（開始時の効果・開始時に使ったカード）を踏まえて、最初の予告を引き直す
  r.enemy.rollCount = 0; r.enemy.forcedUsed = {}; r.enemy.followId = ''; r.enemy.deferredIdx = -1;
  r.enemy.nextMoveId = rollEnemyMove(r.enemy);
  queueRelicStartCards(r);   // 最初の手札を引いたあとに、レリックが使うカードを使用する
  startPlayerTurn(true);
  fireRelicTiming(r, 'combatStart');
  S.screen='battle';
  fireEnemyLines('start');
  renderBattle();
}

function drawCards(n){
  const r = S.run;
  const drawn = [];   // 引いたカード（呼び出し元が、仕込みの記録などに使う）
  for(let i=0;i<n;i++){
    if(r.draw.length===0){
      if(r.discard.length===0) return drawn;
      r.draw = shuffle(r.discard);
      r.discard = [];
      pushLog('捨札を山札に戻した。');
    }
    const cid = r.draw.pop();
    r.hand.push(cid); drawn.push(cid);
    if(r.combatStats) r.combatStats.drawn++;
    applyCardDrawEffect(r, cardById(cid));
    if(r.enemy.hp<=0 || r.player.hp<=0) return drawn; // stop drawing further cards; the caller checks for defeat
  }
  return drawn;
}

// A card's "drawn" effect is a second, independent set of the same numeric fields
// (damage/block/buffs/debuffs/heal/...), stored under "dw_"-prefixed keys so it can
// reuse the exact same rendering/upgrade/save machinery as the main effect while never
// colliding with it. It fires once whenever this specific card is moved into hand by a
// draw — whether or not it's ever played. cardOp, hits (repeat count)
// and per-field scaling are not supported here, to keep a passive, always-on trigger safe.
// カスタム状態の付与も使える（キーは dw_cs_<状態ID>。付与先は dw_csT_<状態ID>、「両方」のときの相手への量は dw_csX_<状態ID>）。
function pileEffectFieldDefs(pre){
  const num = EFFECT_FIELD_DEFS.filter(d=>d.key!=='hits').map(def=>({...def, key:pre+def.key, _base:def.key}));
  const cs = customStatusFieldDefs().map(def=>({...def, key:pre+def.key, _base:def.key,
    desc:(v,obj)=>{
      const view = {};
      if(obj){ view['csT_'+def._statusId] = obj[pre+'csT_'+def._statusId]; view['csX_'+def._statusId] = obj[pre+'csX_'+def._statusId]; }
      return def.desc(v, view);
    }}));
  return num.concat(cs);
}
function drawEffectFieldDefs(){ return pileEffectFieldDefs('dw_'); }
// 消滅したときの効果（ex_ の接頭辞。ドロー時効果と同じ仕組み）
function exhaustEffectFieldDefs(){ return pileEffectFieldDefs('ex_'); }
function fxPickerHTML(group, title){
  return `<div class="ev-add fx-picker" data-group="${group}" style="margin:8px 0;"><select class="fx-pick" aria-label="${title}"></select><button type="button" class="fx-add">＋ ${title}を追加</button></div>`;
}
function applyCardPileEffect(r, c, defs, pre){
  if(!c) return;
  const temp = {name: c.name};
  let hasAny = false;
  defs.forEach(def=>{
    const v = c[def.key]||0;
    if(def._statusId){
      const id = def._statusId, t = c[pre+'csT_'+id], x = (c[pre+'csX_'+id])|0;
      if(v!==0 || (t==='both' && x!==0)) hasAny = true;
      if(t==='self' || t==='opponent' || t==='both') temp['csT_'+id] = t;
      if(x!==0) temp['csX_'+id] = x;
    } else if(v>0) hasAny = true;
    temp[def._base] = v;
  });
  if(hasAny) applyEffectValues(r, temp);
}
function applyCardDrawEffect(r, c){ applyCardPileEffect(r, c, drawEffectFieldDefs(), 'dw_'); }
// カードが消滅したときの効果。ids は消滅したカード（インスタンスID付きでよい）
function applyCardExhaustEffect(r, c){ applyCardPileEffect(r, c, exhaustEffectFieldDefs(), 'ex_'); }
function noteExhausted(r, ids){ (ids||[]).forEach(id=>{ if(id) applyCardExhaustEffect(r, cardById(id)); }); }

function startPlayerTurn(first){
  const r = S.run;
  r.turnNo = (r.turnNo||0) + 1;
  pushLog(`ターン${r.turnNo}`, 'turn');
  if(r.player.poison>0){
    const hpBefore = r.player.hp, pv = r.player.poison;
    r.player.hp = Math.max(0, r.player.hp - pv);
    fxLose(r.player, hpBefore-r.player.hp, 'poison');
    pushLog(`毒によって${pv}ダメージを受けた（HP ${hpBefore}→${r.player.hp}。毒は${pv-1}に減少）。`, 'hit');
    r.player.poison--;
    if(playerFallen()){ onPlayerDefeated(); return; }
  }
  if(r.player.regen>0){
    { const hb = r.player.hp; r.player.hp = Math.min(r.player.maxHp, r.player.hp + r.player.regen); fxHeal(r.player, r.player.hp-hb); }
    pushLog(`再生によってHPを${r.player.regen}回復した。`);
    r.player.regen--;
  }
  r.player.block = 0;
  const autoBlock = r.player.metallicize + r.player.permMetallicize;
  if(autoBlock>0){ r.player.block += autoBlock; fxBlock(r.player, autoBlock); }
  const customSkip = tickCustomStatusesForTurn(r.player);
  r.player.autoGranted = r.player.block; // このターン開始時に自動ブロックで入った分（表示で「ブロック+自動」を分けるため）
  if(playerFallen()){ onPlayerDefeated(); return; }
  if(!first){
    // discard hand from previous turn, except cards flagged "retain"
    const keep = [];
    const toDiscard = [];
    r.hand.forEach(cid=>{
      const c = cardById(cid);
      if(c && c.retain) keep.push(cid); else toDiscard.push(cid);
    });
    r.discard.push(...toDiscard);
    r.hand = keep;
  }
  r.player.energy = S.settings.energyPerTurn + (r.player.extraEnergy||0);
  r.cardsPlayedThisTurn = 0;
  r.tagsPlayedThisTurn = [];
  r.tagSetsPlayedThisTurn = [];
  if(r.activeTriggers) r.activeTriggers = expireTriggers(r.activeTriggers);
  drawCards(S.settings.handSize + (r.player.extraDraw||0));
  if(enemyFallen()){ onEnemyDefeated(); return; }
  if(playerFallen()){ onPlayerDefeated(); return; }
  // Card operations queued by statuses / enemy moves resolve now that the hand is drawn.
  // A "choose" operation pauses here until the player picks; the rest of the turn start
  // then continues from the callback (and re-renders, since the caller already has).
  let sync = true;
  queueRelicTurnCards(r);
  runTurnStartCardOps(r, ()=>{
    if(enemyFallen()){ onEnemyDefeated(); return; }
    if(playerFallen()){ onPlayerDefeated(); return; }
    // ターン開始時の予約（仕込み）は、手札を引き、状態のカード操作を終えたあとに発動する。そのあとレリックが発動する。
    fireTurnStartTriggers(r, ()=>{
      if(enemyFallen()){ onEnemyDefeated(); return; }
      if(playerFallen()){ onPlayerDefeated(); return; }
      fireRelicTiming(r, 'turnStart');
      r.turnPhase='player';
      // 行動不能でも自動でターンは送らない。カードは使えないので、敵の予告やログを確認してから手動でターン終了する。
      r.turnSkipped = !!customSkip;
      if(customSkip) pushLog('行動できない！ カードは使えない。敵の行動を確認して、ターンを終了してください。');
      if(!sync) renderBattle();
    });
  });
  sync = false;
}

// その効果（def）を持つ属性（攻撃が持つ属性のうち）を集める
function elementEntriesFor(def, elems){
  const entries = [];
  (elems||[]).forEach(id=>{
    const el = elementById(id); if(!el || !el.props) return;
    const raw = el.props[def.key];
    if(def.has ? def.has(raw) : Number(raw)>0) entries.push({element:el, value: def.type==='list' ? raw : Number(raw)});
  });
  return entries;
}
// 攻撃のダメージ確定後に、攻撃が持つ属性の特殊効果（ELEMENT_PROP_DEFS の apply）を適用する。
// ログは hit.elementNotes に溜め、攻撃のログのあとに flushElementNotes で出す（敵の攻撃・プレイヤーの攻撃のどちらも）。
function applyElementProps(elems, side, hit){
  const r = S.run; if(!r || !hit || !elems || !elems.length) return;
  const attacker = side==='toEnemy' ? r.player : r.enemy, defender = side==='toEnemy' ? r.enemy : r.player;
  const attackerName = side==='toEnemy' ? 'あなた' : ((r.enemy && r.enemy.name) || '敵');
  const defenderName = side==='toEnemy' ? ((r.enemy && r.enemy.name) || '敵') : 'あなた';
  ELEMENT_PROP_DEFS.forEach(def=>{
    if(!def.apply) return;
    const entries = elementEntriesFor(def, elems);
    if(!entries.length) return;
    [].concat(def.apply({side, hit, attacker, attackerName, defender, defenderName, entries}) || []).forEach(note=>{
      if(note) (hit.elementNotes = hit.elementNotes || []).push(note);
    });
  });
}
// ブロックを引く計算の前に効く特殊効果（貫通・ブロック破壊）を、攻撃が持つ属性から集める
function elementBlockMods(elems){
  const out = {pierce:0, breakPct:0, pierceNames:[], breakNames:[]};
  ELEMENT_PROP_DEFS.forEach(def=>{
    if(!def.blockMod) return;
    elementEntriesFor(def, elems).forEach(en=>{
      const m = def.blockMod(en.value) || {};
      if(m.pierce){ out.pierce += m.pierce; out.pierceNames.push(en.element.name); }
      if(m.breakPct){ out.breakPct += m.breakPct; out.breakNames.push(en.element.name); }
    });
  });
  out.pierce = Math.min(100, out.pierce);
  return out;
}
// ダメージ dmg が、ブロック block に当たったときの結果。
//   pierceAmt: ブロックを無視してHPに入る分／absorbed: ブロックで防がれたダメージ／blockUsed: 失うブロック／hpLoss: HPに通る分
function resolveBlock(dmg, block, bm){
  const pierceAmt = bm.pierce>0 ? Math.min(dmg, Math.floor(dmg*bm.pierce/100)) : 0;
  const rest = dmg - pierceAmt, mult = 1 + (bm.breakPct||0)/100;
  const absorbed = Math.min(rest, block>0 ? Math.ceil(block/mult) : 0);
  const blockUsed = Math.min(block, Math.ceil(absorbed*mult));
  return {pierceAmt, absorbed, blockUsed, hpLoss: dmg - absorbed};
}
// 貫通・ブロック破壊が実際に効いたときの、ログの文
function blockModNotes(hit, bm, rb, side){
  const kind = side==='toPlayer' ? 'deal' : undefined, out = [];
  if(rb.pierceAmt>0) out.push({text:`${bm.pierceNames.join('・')}の貫通: ${rb.pierceAmt}ダメージがブロックを無視した。`, kind});
  const extra = rb.blockUsed - rb.absorbed;
  if(extra>0) out.push({text:`${bm.breakNames.join('・')}のブロック破壊: ブロックを余分に${extra}失った。`, kind});
  if(out.length) hit.elementNotes = (hit.elementNotes||[]).concat(out);
}
// 敵に最初から設定された、属性の弱点・耐性（被ダメージの増減％）。攻撃が持つ属性の分を足し合わせる
function enemyElementMod(e, elems){
  let pct = 0; const names = [];
  (e.elementMods||[]).forEach(m=>{
    (elems||[]).forEach(id=>{
      if(m.element==='all' || !elementMatchesSelector(id, m.element)) return;
      pct += m.pct; const el = elementById(id); if(el && !names.includes(el.name)) names.push(el.name);
    });
  });
  return {pct, names};
}
function flushElementNotes(hit){
  if(!hit || !hit.elementNotes) return;
  hit.elementNotes.forEach(n=> pushLog(n.text, n.kind));
  hit.elementNotes = [];
}
function applyDamageToEnemy(raw, pierce, onHit, elems){
  elems = elems || [];
  const r = S.run; const e = r.enemy;
  let dmg = raw;
  const steps = [];
  const dealtBonus = customDamageDealtBonus(r.player, elems);
  if(dealtBonus.flat){ dmg += dealtBonus.flat; steps.push({t:'flat', v:dealtBonus.flat, label:csLabel(r.player,'damageDealtFlat',elems)}); }
  if(r.player.weak>0){ dmg = Math.floor(dmg*0.75); steps.push({t:'mult', v:0.75, label:'弱体'}); }
  if(dealtBonus.pct){ dmg = Math.max(0, Math.floor(dmg*(1+dealtBonus.pct/100))); steps.push({t:'mult', v:pctMult(dealtBonus.pct), label:csLabel(r.player,'damageDealtPct',elems)}); }
  if(e.vulnerable>0){ dmg = Math.floor(dmg*1.5); steps.push({t:'mult', v:1.5, label:'脆弱'}); }
  const takenFlat = customDamageTakenFlat(e, elems);
  if(takenFlat && dmg>0){ dmg = Math.max(0, dmg + takenFlat); steps.push({t:'flat', v:takenFlat, label:csLabel(e,'damageTakenFlat',elems)}); }
  const takenPct = customDamageTakenPct(e, elems);
  if(takenPct){ dmg = Math.max(0, Math.floor(dmg*(1+takenPct/100))); steps.push({t:'mult', v:pctMult(takenPct), label:csLabel(e,'damageTakenPct',elems)}); }
  const innate = enemyElementMod(e, elems);   // 敵の弱点・耐性
  if(innate.pct){ dmg = Math.max(0, Math.floor(dmg*(1+innate.pct/100))); steps.push({t:'mult', v:pctMult(innate.pct), label:`${innate.names.join('・')}の${innate.pct>0?'弱点':'耐性'}`}); }
  dmg = Math.max(0, dmg);
  const hpBefore = e.hp, blockBefore = e.block, dmgTotal = dmg;
  let blocked = 0, rb = {pierceAmt:0, absorbed:0, blockUsed:0, hpLoss:dmg}, bm = null;
  if(!pierce){
    bm = elementBlockMods(elems); rb = resolveBlock(dmg, e.block, bm);
    blocked = rb.absorbed; e.block -= rb.blockUsed; dmg -= blocked;
  }
  e.hp = Math.max(0, e.hp - dmg);
  const hit = {raw, steps, total: dmg+blocked, blocked, hpLoss: dmg, pierce: !!pierce, pierceAmt: rb.pierceAmt, hpBefore, hpAfter: e.hp, blockBefore, blockAfter: e.block};
  if(bm) blockModNotes(hit, bm, rb, 'toEnemy');
  r.lastEnemyHit = hit;
  fxHit(e, hit, elems);
  applyElementProps(elems, 'toEnemy', hit);
  if(onHit) onHit(hit);   // 敵の構え（トリガー）のログより先に、この攻撃のログを残すため
  flushElementNotes(hit);
  if(dmg+blocked>0) fireEnemyTriggers(r, 'damaged', {hpLoss: dmg, total: dmg+blocked});
  return dmg+blocked;
}
// 敵の攻撃1発あたり、プレイヤーが受けるダメージ（ブロックを引く前）を計算する。状態は変更しない。
// 実際の処理（applyDamageToPlayer）と行動予告の予測の両方がこれを使うので、予告と結果がずれにくい。
// opts.vulnerable: プレイヤーの脆弱の残りターン数を仮定して計算したいとき（予測用）
function calcPlayerDamage(raw, opts){
  opts = opts||{};
  const r = S.run, p = r.player, en = r.enemy;
  const vuln = opts.vulnerable!==undefined ? opts.vulnerable : p.vulnerable;
  const elems = opts.elems || [];
  const steps = [];
  let dmg = raw;
  const dealtBonus = customDamageDealtBonus(en, elems);
  if(dealtBonus.flat){ dmg += dealtBonus.flat; steps.push({t:'flat', v:dealtBonus.flat, label:csLabel(en,'damageDealtFlat',elems)}); }
  if(en.weak>0){ dmg = Math.floor(dmg*0.75); steps.push({t:'mult', v:0.75, label:'弱体'}); }
  if(dealtBonus.pct){ dmg = Math.max(0, Math.floor(dmg*(1+dealtBonus.pct/100))); steps.push({t:'mult', v:pctMult(dealtBonus.pct), label:csLabel(en,'damageDealtPct',elems)}); }
  if(vuln>0){ dmg = Math.floor(dmg*1.5); steps.push({t:'mult', v:1.5, label:'脆弱'}); }
  const takenFlat = customDamageTakenFlat(p, elems);
  if(takenFlat && dmg>0){ dmg = Math.max(0, dmg + takenFlat); steps.push({t:'flat', v:takenFlat, label:csLabel(p,'damageTakenFlat',elems)}); }
  const takenPct = customDamageTakenPct(p, elems);
  if(takenPct){ dmg = Math.max(0, Math.floor(dmg*(1+takenPct/100))); steps.push({t:'mult', v:pctMult(takenPct), label:csLabel(p,'damageTakenPct',elems)}); }
  return {raw, total: Math.max(0, dmg), steps};
}
function applyDamageToPlayer(raw, pierce, elems){
  const r = S.run; const p = r.player;
  const calc = calcPlayerDamage(raw, {elems});
  const total = calc.total;
  const hpBefore = p.hp, blockBefore = p.block;
  let rb = {pierceAmt:0, absorbed:0, blockUsed:0, hpLoss:total}, bm = null;
  if(!pierce){ bm = elementBlockMods(elems); rb = resolveBlock(total, p.block, bm); }   // カードが貫通なら、ブロックを無視する
  const blocked = rb.absorbed;
  p.block -= rb.blockUsed;
  const hpLoss = total - blocked;
  p.hp = Math.max(0, p.hp - hpLoss);
  r.lastHit = {raw, steps: calc.steps, hpLoss, total, blocked, pierce: !!pierce, pierceAmt: rb.pierceAmt, hpBefore, hpAfter: p.hp, blockBefore, blockAfter: p.block};
  if(bm) blockModNotes(r.lastHit, bm, rb, 'toPlayer');
  fxHit(p, r.lastHit, elems);
  applyElementProps(elems, 'toPlayer', r.lastHit);
  return total;
}

function playCard(handIdx){
  const r = S.run; if(r.turnPhase!=='player' || r.turnSkipped || r.defeatWait) return;
  const cardId = r.hand[handIdx];
  const c = cardById(cardId);
  if(!c || !canAffordCard(c, r.player.energy)) return;
  const reqFail = requirementFailure(r, c);
  if(reqFail){ pushLog(`${c.name}: 使用条件を満たしていないため使えない（${reqFail}）。`); renderBattle(); return; }
  const xPaid = isXCost(c) ? r.player.energy : 0;
  r.player.energy -= getCardPaymentCost(c, r.player.energy);

  // The played card leaves the hand BEFORE its effects resolve. Otherwise a hand-targeting
  // card operation (discard / buff / upgrade / duplicate ...) could pick the card that is
  // being played; and since buffing re-tags a card with a new instance id, the card would
  // then end up both in the hand (buffed) and in the discard pile (original) — two copies.
  r.hand.splice(handIdx,1);

  logGroupBegin(`あなた：${cardIcon(c)}${c.name}`);
  if(isXCost(c)) pushLog(`${c.name}: X=${xPaid}（エネルギーをすべて消費）。`);
  runWithSelfCard(r, cardId, cb=>withXValue(r, xPaid, cb2=>resolveCardPlayCore(r, c, cb2), cb), finalId=>{
    logGroupEnd();
    // 「そのカード自身」の操作で行き先が決まっていなければ、いつもどおり捨て札／消滅へ
    if(finalId){
      if(c.exhaust){ r.exhausted.push(finalId); noteExhausted(r, [finalId]); }
      else{ r.discard.push(finalId); }
    }

    if(enemyFallen()){ onEnemyDefeated(); return; }
    if(playerFallen()){ onPlayerDefeated(); return; }
    renderBattle();
  });
}

function endPlayerTurn(){
  const r = S.run; if(r.turnPhase!=='player') return;
  // tick down player debuffs at end of player's turn
  if(r.player.weak>0) r.player.weak--;
  if(r.player.vulnerable>0) r.player.vulnerable--;
  r.turnPhase='enemy';
  renderBattle();
  setTimeout(runEnemyTurn, 550);
}

function runEnemyTurn(){
  const r = S.run; const e = r.enemy;
  if(r.ended) return;
  pushLog(`ターン${r.turnNo||1}・${e.name}の行動`, 'turn');
  // poison at start of enemy turn
  if(e.poison>0){
    const eBefore = e.hp, pv = e.poison;
    e.hp = Math.max(0, e.hp - pv);
    fxLose(e, eBefore-e.hp, 'poison');
    pushLog(`${e.name}は毒で${pv}ダメージ（敵HP ${eBefore}→${e.hp}。毒は${pv-1}に減少）。`, 'deal');
    e.poison--;
    if(enemyFallen()){ onEnemyDefeated(); return; }
  }
  // 再生・自動ブロック（プレイヤーのターン開始と同じ。再生は1ずつ減る。敵のブロックは持ち越しなので、自動ブロックは毎ターン積み増す）
  if(e.regen>0){
    const hb = e.hp, rv = e.regen;
    e.hp = Math.min(e.maxHp, e.hp + rv); fxHeal(e, e.hp-hb);
    e.regen--;
    pushLog(`${e.name}は再生でHPを${e.hp-hb}回復（敵HP ${hb}→${e.hp}。再生は${e.regen}に減少）。`, 'deal');
  }
  const eAuto = (e.metallicize||0) + (e.permMetallicize||0);
  if(eAuto>0){
    const bb = e.block; e.block += eAuto; fxBlock(e, eAuto);
    pushLog(`${e.name}は自動ブロックで${eAuto}のブロックを得た（敵ブロック ${bb}→${e.block}）。`, 'deal');
  }
  const customSkip = tickCustomStatusesForTurn(e);
  if(enemyFallen()){ onEnemyDefeated(); return; }
  if(e.stun>0){
    e.stun--;
    pushLog(`${e.name}は麻痺していて行動できない。`);
    enemyTurnTail(r, e);
  } else if(customSkip){
    pushLog(`${e.name}は行動できない。`);
    enemyTurnTail(r, e);
  } else {
    const move = cardById(e.nextMoveId);
    r.damageEvents = [];
    e.triggers = expireTriggers(e.triggers); // 有効ターンが尽きた構え（「このターンのみ」は次の行動の前）は解ける
    fireEnemyTurnStartTriggers(r, e);
    r.enemyTurnStat = {hits:0, total:0, blocked:0, hpLoss:0, hpStart:r.player.hp};
    if(move) resolveEnemyMoveEffects(r, e, move);
    logEnemyTurnSummary(r);
    // ダメージを受けたときのトリガー（カード操作で選択画面が出る場合は、選び終わってから続きへ）
    fireDamageTriggers(r, ()=>{
      // Resolved at the start of the player's next turn, once the new hand is drawn (視点反転: resolveEnemyCardOp).
      queueEnemyCardOp(r, e, move);
      enemyExhaustUsed(r, e, move, e.nextMoveId);
      if(enemyFallen()){ onEnemyDefeated(); return; }
      if(playerFallen()){ onPlayerDefeated(); return; }
      e.nextMoveId = rollEnemyMove(e);
      enemyTurnTail(r, e);
    });
  }
}
function enemyTurnTail(r, e){
  if(e.weak>0) e.weak--;
  if(e.vulnerable>0) e.vulnerable--;
  if(playerFallen()){ onPlayerDefeated(); return; }
  startPlayerTurn(false);
  renderBattle();
}

function goldForFloor(floorIndex, elite, boss){
  let base = 15 + floorIndex*3;
  if(boss) base *= 2.2;
  else if(elite) base *= 1.6;
  return Math.round(base * (0.85 + Math.random()*0.3));
}

// 確率（%）の抽選。未設定（undefined）は100%＝必ず当たる。
function rollChance(pct){
  const p = (pct===undefined || pct===null) ? 100 : pct;
  return p>=100 || Math.random()*100 < p;
}
// 倒されたときのセリフを言い終わるまで待ってから、勝利・敗北の処理に進む
function onEnemyDefeated(){
  const r = S.run; if(r.defeatWait) return; r.defeatWait = true;
  fxSettle(()=> dialogueThen('selfDefeated', onEnemyDefeatedCore));
}
function onPlayerDefeated(){
  const r = S.run; if(r.defeatWait) return; r.defeatWait = true;
  fxSettle(()=> dialogueThen('playerDefeated', onPlayerDefeatedCore));
}
function onEnemyDefeatedCore(){
  const r = S.run;
  r.rewardChoices = null; r.rewardRerollCount = 0; r.rewardFocusTag = '';
  r.rewardBoost = r.enemy.elite ? {rarePct: S.settings.eliteRarePct, extra: S.settings.eliteExtraChoices} : null;   // エリートの報酬の強化
  purgeTemporaryCards(r);
  fireRelicTiming(r, 'combatEnd');
  const gained = goldForFloor(mapGlobalFloor(r), r.enemy.elite, r.enemy.boss);
  r.player.gold += gained;
  r.lastGoldGained = gained;
  pushLog(`${r.enemy.name}を撃破した！ ゴールド+${gained}。`);
  if(r.floor >= S.settings.floorCount && (r.round||1) >= (S.settings.roundCount||1)){
    S.screen='victory'; renderVictory(); return;
  }
  // 敵ごとに設定されたドロップカード（必ず入手）
  r.lastDropCards = [];
  r.pendingDropCards = (r.enemy.dropCardIds||[]).filter((id,i)=> !!cardById(id) && rollChance(r.enemy.dropCardChances && r.enemy.dropCardChances[i]));
  // 敵ごとに設定されたドロップレリック（未所持のときのみ）。なければ従来のエリート／ボス報酬
  let dropRelic = null;
  if(r.enemy.dropRelicId){
    const fixed = S.relics.find(rel=>rel.id===r.enemy.dropRelicId);
    if(fixed && !r.player.relics.includes(fixed.id) && rollChance(r.enemy.dropRelicChance)) dropRelic = fixed;
  }
  if(!dropRelic && (r.enemy.elite || r.enemy.boss) && (!r.enemy.elite || rollChance(S.settings.eliteRelicChance))){
    const avail = S.relics.filter(rel=>!r.player.relics.includes(rel.id) && !isNonRewardRelic(rel));
    if(avail.length>0) dropRelic = avail[Math.floor(Math.random()*avail.length)];
  }
  r.pendingRelic = dropRelic;
  proceedAfterDrops();
}
// 撃破後の流れ: ドロップカード（受け取る/拒否）→ レリック（手に入れる/見送る）→ 通常の報酬
function proceedAfterDrops(){
  const r = S.run;
  if(r.pendingDropCards && r.pendingDropCards.length){ S.screen='dropCards'; renderDropCards(); return; }
  if(r.pendingRelic){ S.screen='relicReward'; renderRelicReward(); return; }
  S.screen='reward'; renderReward();
}
function renderDropCards(){
  const r = S.run;
  const ids = r.pendingDropCards;
  if(!r.dropSelected || r.dropSelected.length!==ids.length) r.dropSelected = ids.map(()=>true);
  const sel = r.dropSelected;
  const n = sel.filter(Boolean).length;
  app().innerHTML = `
  <div class="screen center-screen">
    <p class="eyebrow">DROP</p>
    <h2>${escapeHtml(r.enemy.name)}が落としたカード</h2>
    <p style="color:var(--parchment-dim); margin-top:6px;">受け取るカードを選んでください（クリックで切り替え）。</p>
    <div class="reward-row" id="drop-row">
      ${ids.map((id,i)=>`<div data-idx="${i}" style="cursor:pointer; ${sel[i]?'outline:3px solid var(--gold); border-radius:10px;':'opacity:.4;'}">${renderCardHTML(cardById(id),{mini:true})}</div>`).join('')}
    </div>
    <div style="margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="primary" id="btn-drop-take" ${n===0?'disabled':''}>選んだ${n}枚を受け取る</button>
      <button class="ghost" id="btn-drop-none">すべて受け取らない</button>
    </div>
    ${battleLogDetails(r, false)}
  </div>`;
  qsa('#drop-row > div').forEach(w=>{
    w.onclick = ()=>{ const i = parseInt(w.dataset.idx,10); sel[i] = !sel[i]; renderDropCards(); };
  });
  const finish = (take)=>{
    const got = [];
    ids.forEach((id,i)=>{
      if(take && sel[i]){ r.discard.push(id); noteCardAcquired(r, id); got.push(cardById(id).name); }
    });
    r.lastDropCards = got;
    if(got.length) pushLog(`ドロップ: ${got.join('、')}をデッキに加えた。`);
    r.pendingDropCards = null; r.dropSelected = null;
    proceedAfterDrops();
  };
  qs('#btn-drop-take').onclick = ()=>finish(true);
  qs('#btn-drop-none').onclick = ()=>finish(false);
}
function onPlayerDefeatedCore(){
  S.run.ended = true;
  S.screen='defeat';
  renderDefeat();
}

function fmtNum(n){ return String(Math.round(n*1000)/1000); }
function signed(n){ return n>0 ? `+${fmtNum(n)}` : fmtNum(n); }
function tipElementName(id){ return (!id || id==='all') ? '全属性' : (typeof id==='string' && id.startsWith('tag:')) ? `タグ「${id.slice(4)}」の属性` : (elementName(id) || '（削除された属性）'); }
// カスタム状態の効果1つぶんの説明（stacks＝いまのスタック数）
function customEffectText(eff, stacks){
  const mag = customStatusMagnitude(eff, stacks);
  const per = eff.magnitudeMode==='perStack' ? `<span class="tip-dim">（1スタックにつき${fmtNum(eff.magnitudeValue)}。いま${stacks}スタックで計${fmtNum(mag)}）</span>` : '';
  const el = escapeHtml(tipElementName(eff.element));
  switch(eff.kind){
    case 'damageDealtPct':  return `与えるダメージが${signed(mag)}％${per}`;
    case 'damageTakenPct':  return `受けるダメージが${signed(mag)}％${per}`;
    case 'damageTakenFlat': return `受けるダメージが攻撃1回ごとに${signed(mag)}（ダメージ0の攻撃には加算されません）${per}`;
    case 'damageDealtFlat': return `与えるダメージが${signed(mag)}${per}`;
    case 'blockGainFlat':   return `ブロック獲得量が${signed(mag)}${per}`;
    case 'autoBlock':       return `ターン開始時にブロックを${fmtNum(Math.max(0,mag))}獲得${per}`;
    case 'turnStartDamage': return `ターン開始時に${fmtNum(Math.max(0,mag))}ダメージを受ける${per}`;
    case 'turnStartHeal':   return `ターン開始時にHPが${fmtNum(Math.max(0,mag))}回復${per}`;
    case 'reflectDamage':   return `攻撃を受けるたびに、相手に${fmtNum(mag)}の反射ダメージ${per}`;
    case 'skipTurn':        return `自分のターンを休む（発動のたびにスタックが1減ります）`;
    case 'cardMod': {
      const fd = allEffectFieldDefs().find(d=>d.key===eff.modField);
      const nm = fd ? fd.label.replace(/（.*$/,'') : eff.modField;
      return `${escapeHtml(tagCondText(eff.modTag, eff.modTagMode))}カードを使うとき、「${escapeHtml(nm)}」が${signed(mag)}${eff.decayOnUse ? `（使うたびにスタック-${eff.decayN||1}）` : ''}${per}`;
    }
    case 'revive':          return `HPが0になったとき、HP${fmtNum(mag)}で復活（発動のたびにスタックが1減ります）${per}`;
    case 'elDealtFlat':     return `${el}の攻撃の与ダメージが${signed(mag)}${per}`;
    case 'elDealtPct':      return `${el}の攻撃の与ダメージが${signed(mag)}％${per}`;
    case 'elTakenFlat':     return `${el}の攻撃を受けるとき、ダメージが${signed(mag)}（ダメージ0の攻撃には加算されません）${per}`;
    case 'elTakenPct':      return `${el}の攻撃を受けるとき、ダメージが${signed(mag)}％${per}`;
    case 'elGrant':         return `持ち主の攻撃に「${el}」属性が加わる`;

function customStatusTip(st, stacks){
  const nm = `${escapeHtml(st.emoji||'❔')} ${escapeHtml(st.name)} ${stacks}`;
  const lines = (st.effects||[]).map(eff=> customEffectText(eff, stacks));
  if(!lines.length) lines.push('<span class="tip-dim">（効果なし）</span>');
  const notes = [];
  if(st.perTurnDelta) notes.push(`持ち主のターン開始時に、スタックが${signed(st.perTurnDelta)}されます。`);
  if(st.persistent) notes.push('戦闘が終わっても残ります。');
  const ex = (arr, f)=> (arr||[]).length ? f((arr||[]).map(t=>`[${escapeHtml(t)}]`).join('')) : '';
  notes.push(ex(st.exclOverwrite, t=>`付与されたとき、${t}の状態をすべて取り除きます。`));
  notes.push(ex(st.exclYield,     t=>`${t}の状態を持っている間は、付与されません。`));
  notes.push(ex(st.exclReplaced,  t=>`${t}の状態が後から付与されると、消えます。`));
  notes.push(ex(st.exclGuard,     t=>`この状態がある間、${t}の状態は付与されません。`));
  if((st.tags||[]).length) notes.push(`タグ: ${st.tags.map(escapeHtml).join('、')}`);
  return tipHTML(nm, lines.concat(notes.filter(Boolean).map(n=>`<span class="tip-dim">${n}</span>`)));
}

// ---- 仕込み（構え）: キャラクターのアイコンの上に出す。ホバーで、発動条件・残りターン・効果を見られる ----
function triggerTipHTML(t, isEnemy, e){
  const c = isEnemy ? t.card : t.cardData;
  if(!c) return '';
  const tag = escapeHtml(tagCondText(t.triggerTag, t.triggerTagMode));
  const when = t.triggerOn==='damaged'
    ? `${isEnemy ? '敵が' : ''}ダメージを受けるたびに発動${t.triggerBlocked ? '（ブロックで全部防いだ場合も）' : ''}`
    : PILE_TRIGGER_KINDS.includes(t.triggerOn)
    ? (isEnemy ? '（敵はカードを引いたり捨てたりしないため、発動しません）' : `カードの効果で${tag}カードを${t.triggerOn==='drawn' ? '引く' : '捨て札に移す'}たびに発動`)
    : t.triggerOn==='turnStart'
    ? `${isEnemy ? '敵の' : '自分の'}ターン開始時に発動`
    : (isEnemy ? `敵が${tag || 'どの'}カードを使うたびに発動` : `${tag || 'どの'}カードを使うたびに発動`);

  const left = t.turnsLeft>0 ? `あと${t.turnsLeft}ターン` : (t.duration==='turn' ? 'このターンのみ' : 'この戦闘中ずっと');
  let effect;
  if(isEnemy){

  return tipHTML(`⚡ ${escapeHtml(cardIcon(c))} ${escapeHtml(c.name)}（仕込み）`, [
    `<span class="tip-when">${when}${everyTxt}</span>`,
    `残り: ${left}`,
    `<span class="tip-dim">効果:</span> ${effect}`,

// 敵の行動（カード）のダメージ以外の効果を、短い文のリストにする（行動予告と、構えのホバー表示で共通）
function enemyMoveParts(e, c){
  const V = key=> enemyVal(c, key);
  const parts = [];
  const hits = Math.max(1, (c.hits||1) + scaleBonus(c,'hits','enemy'));
  if(V('block')>0) parts.push(`ブロック${Math.max(0, V('block') + customBlockGainBonus(e))}`);
  const str = V('strength')+V('permStrength');
  if(str>0) parts.push(`強化${str}`);
  const dex = V('dexterity')+V('permDexterity');
  if(dex>0) parts.push(`器用${dex}`);
  const met = V('metallicize')+V('permMetallicize');
  if(met>0) parts.push(`自動ブロック${met}`);
  const thr = V('thorns')+V('permThorns');
  if(thr>0) parts.push(`棘${thr}`);
  if(V('weak')>0) parts.push(`弱体${V('weak')}`);
  if(V('vulnerable')>0) parts.push(`脆弱${V('vulnerable')}`);
  if(V('poison')>0) parts.push(`毒${V('poison')}`);
  if(V('heal')>0) parts.push(`回復${V('heal')}`);
  if(c.regen>0) parts.push(`再生${c.regen}`);
  customStatusFieldDefs().forEach(def=>{
    const amt = (c[def.key]||0) + scaleBonus(c, def.key, 'enemy');
    const st = (S.customStatuses||[]).find(x=>x.id===def._statusId);
    if(!st) return;
    const both = csGrantSide(c, st)==='both';
    const extra = both ? ((c['csX_'+st.id])|0) : 0;
    if(both){
      if(amt!==0) parts.push(`${st.emoji||''}${st.name}${amt}（自分に）`);
      if(extra!==0) parts.push(`${st.emoji||''}${st.name}${extra}（相手に）`);
    } else if(amt!==0){
      parts.push(`${st.emoji||''}${st.name}${amt}`);
    }
  });
  { const so = statusOpText(c.statusOp); if(so) parts.push(so); }
  cardOpsOf(c).forEach(op=>{
    const t = enemyOpText(withOpScales(op, 'enemy'));   // 参照増減を反映した値で予告する
    if(t) parts.push(t);
  });
  return parts;
}
function intentLabel(e){
  let c = cardById(e.nextMoveId);
  if(!c) return {cls:'buf', text:'予告: ？'};
  c = applyCardModsTo(c, e).card;   // 敵の「使用カードの効果補正」状態を反映した予告にする
  // Format: 予告: <icon><skill name> <effect><value>・<effect><value>...
  // 数値は、敵の現在の強化・器用や、参照増減（失ったHPなど）を反映した値を表示する。
  const V = key=> enemyVal(c, key);
  const parts = enemyMoveParts(e, c);
  const isTrig = isTriggerOnly(c);
  const cls = isTrig ? 'buf' : (V('damage')>0 ? 'atk' : (V('block')>0 ? 'def' : 'buf'));
  let trigText = '';
  if(hasTrigger(c)){
    const onKind = cleanTriggerOn(c.triggerOn);
    const when = PILE_TRIGGER_KINDS.includes(onKind) ? '発動しない（敵は引く・捨てることがない）' : onKind==='turnStart' ? '自分のターン開始時' : (onKind==='damaged' ? 'ダメージを受けたとき' : `${tagCondText(c.triggerTag, c.triggerTagMode)}カードを使ったとき`);
    const ev = triggerCountEveryOf(c);
    trigText = `【${isTrig ? '' : '＋'}構え：${when}${ev>1 ? (onKind==='turnStart' ? `・${ev}ターンに1回` : `・${ev}回に1回`) : ''}】`;
  }
  const pred = isTrig ? null : predictEnemyAttack(e, c);
  // 表記: {カード名}：ダメージ {予測合計}({基礎}×{回数})・その他の効果…（詳細はポップオーバー）
  const all = parts.slice();
  if(pred) all.unshift(`${pred.lethal?'<span class="warn">⚠</span>':''}ダメージ <b>${pred.total}</b>${pred.hits>1?`<span class="ip-calc">(${V('damage')}×${pred.hits})</span>`:(V('damage')!==pred.total?`<span class="ip-calc">(${V('damage')})</span>`:'')}`);
  const text = `${cardIcon(c)}${escapeHtml(c.name)}${trigText}：${all.length?all.join('・'):'―'}`;
  const pop = `<div class="intent-pop">
    <div class="ip-title">${cardIcon(c)}${escapeHtml(c.name)}${trigText}</div>
    ${parts.length?`<div class="ip-parts">${parts.join('・')}</div>`:''}
    ${pred ? predictionPopHTML(e, c, pred) : ''}
  </div>`;
  return {cls, text, pop, lethal: !!(pred && pred.lethal)};
}

// 敵の攻撃を、実際の処理（applyEnemyCardPayload）と同じ順序でシミュレートして、被ダメージを予測する。
// 反映するもの: 強化・弱体・脆弱・状態異常の増減、多段攻撃での「1発ごとの強化の積み上がり」「同じ行動で脆弱が付く場合の後続ヒット」、
//              現在のブロック（1発ごとに減っていく）、貫通（攻撃全体のフラグと属性の貫通）、属性のブロック破壊、プレイヤーのターン終了時に脆弱が1減る処理。
// 反映しないもの: 敵の構え（トリガー）による追加攻撃、敵のターン開始時の状態の変化、プレイヤーの仕込みの効果。
function predictEnemyAttack(e, c){
  const r = S.run, p = r.player;
  const V = key=> enemyVal(c, key);
  const base = V('damage');
  if(isTriggerOnly(c) || base<=0) return null;
  const hits = Math.max(1, (c.hits||1) + scaleBonus(c,'hits','enemy'));
  const strGain = V('strength') + V('permStrength');   // 同じ行動で強化を得るなら、1発ごとに積み上がる
  const vulnGain = V('vulnerable');                    // 同じ行動で脆弱を付けるなら、2発目以降に効く
  const ticking = r.turnPhase==='player' && p.vulnerable>0;
  let vuln = r.turnPhase==='player' ? Math.max(0, p.vulnerable-1) : p.vulnerable;   // ターン終了時に脆弱が1減ってから、敵が動く
  const vulnStart = vuln;
  let blk = p.block, hp = p.hp, strAdd = 0;
  const rows = [];
  const atkElems = attackElements(e, c);
  const bm = c.pierce ? null : elementBlockMods(atkElems);
  let pierceSum = 0;
  for(let i=0; i<hits && hp>0; i++){
    const calc = calcPlayerDamage(base + e.strength + strAdd, {vulnerable: vuln, elems: atkElems});
    let blocked = 0;
    if(!c.pierce){
      const rb = resolveBlock(calc.total, blk, bm);
      blocked = rb.absorbed; blk -= rb.blockUsed; pierceSum += rb.pierceAmt;
    }
    const loss = calc.total - blocked;
    hp = Math.max(0, hp - loss);
    rows.push({total: calc.total, blocked, loss, steps: calc.steps, str: e.strength + strAdd, hpAfter: hp});
    strAdd += strGain;
    if(vulnGain>0) vuln += vulnGain;
  }
  const sum = k=> rows.reduce((a,x)=>a+x[k],0);
  const total = sum('total');
  return {base, hits, rows, total, blocked: sum('blocked'), loss: sum('loss'), strGain, newVuln: vulnGain>0 && vulnStart<=0,
          hpBefore: p.hp, hpAfter: hp, blockBefore: p.block, blockAfter: blk,
          lethal: hp<=0, pierce: !!c.pierce, bm, pierceSum,
          needBlock: c.pierce ? 0 : needBlockFor(rows, p.block, bm),
          vulnNote: ticking ? `あなたの脆弱${p.vulnerable}は、ターン終了時に${vulnStart}へ減る前提` : ''};
}
// 全部防ぐのに必要なブロック量（貫通で素通りする分、ブロック破壊で余計に減る分を含む）。足りるまで二分探索
function needBlockFor(rows, have, bm){
  const need = start=>{
    let b = start;
    for(const x of rows){
      const rb = resolveBlock(x.total, b, bm);
      if(x.total - rb.absorbed > (bm.pierce>0 ? rb.pierceAmt : 0)) return false;
      b -= rb.blockUsed;
    }
    return true;
  };
  if(need(have)) return 0;
  let lo = have, hi = Math.max(have+1, 1);
  while(!need(hi) && hi<100000) hi *= 2;
  while(hi-lo>1){ const m = (lo+hi)>>1; if(need(m)) hi = m; else lo = m; }
  return hi - have;
}
// ポップオーバー: 1発ごとの計算（基礎・参照増減・固定値・倍率・ブロック）と、最終的なHP・ブロックの変化
function predictionPopHTML(e, c, pr){
  const printed = c.damage||0, scale = pr.base - printed;
  let html = pr.rows.map((x,i)=>{
    const expr = logExprHTML({base:printed, scale, flats:[{v:x.str, label:'強化'}], steps:x.steps, blocked:x.blocked, pierce:pr.pierce && pr.blockBefore>0});
    const res = x.loss>0 ? `HP-${x.loss}` : (x.total>0 ? 'HP変化なし' : '');
    return `<div class="ip-row"><span class="ip-k">${i+1}発目</span>ダメージ<b>${x.total}</b> (${expr}) <span class="ip-k">${res}</span></div>`;
  }).join('');
  let sum = `ダメージ合計 <b>${pr.total}</b>`;
  if(pr.total<=0) sum += '（ダメージなし）';
  html += `<div class="ip-sum">${sum}${pr.lethal?' <span class="warn">⚠ 致死</span>':''}
    <div>あなた：HP ${pr.hpBefore} → ${pr.hpAfter}</div>
    ${pr.blockBefore!==pr.blockAfter?`<div class="lg-blk">あなた：ブロック ${pr.blockBefore} → ${pr.blockAfter}</div>`:''}</div>`;
  const notes = [];
  if(pr.rows.length>1 && pr.strGain>0) notes.push(`1発ごとに強化+${pr.strGain}`);
  if(pr.rows.length>1 && pr.newVuln) notes.push('この攻撃で脆弱が付くため、2発目以降は×1.5');
  if(pr.pierce) notes.push('貫通（ブロック無視）');
  else {
    if(pr.bm && pr.bm.pierce>0) notes.push(`${pr.bm.pierceNames.join('・')}の貫通${pr.bm.pierce}%（${pr.pierceSum}ダメージがブロックを無視）`);
    if(pr.bm && pr.bm.breakPct>0) notes.push(`${pr.bm.breakNames.join('・')}のブロック破壊+${pr.bm.breakPct}%`);
    if(pr.loss>0 && pr.needBlock>0) notes.push(`完全に防ぐには、あと${pr.needBlock}ブロック`);
    else if(pr.loss>0) notes.push('ブロックだけでは防ぎきれない（貫通）');
  }
  if(pr.vulnNote) notes.push(pr.vulnNote);
  notes.push('敵の構え・ターン開始時の状態変化は含みません');
  html += `<div class="ip-note">${notes.join('／')}</div>`;
  return html;
}

function hpBarHTML(ent){
  const auto = (ent.metallicize||0) + (ent.permMetallicize||0) + customEffectSum(ent,'autoBlock');
  const on = ent.block>0 || auto>0;
  // プレイヤーは、ターン開始時に自動ブロックで入った分を「ブロック」から除いて表示する（0+1のように）
  const shownBlock = auto>0 ? Math.max(0, ent.block - (ent.autoGranted||0)) : ent.block;
  const badge = on
    ? `<div class="hpbar-block">${escapeHtml(blockIcon())}${shownBlock}${auto>0?`<span class="blk-auto" title="次の自分のターン開始時に自動で入るブロック">+${auto}</span>`:''}</div>` : '';
  const now = Math.max(0, 100*ent.hp/ent.maxHp), side = (S.run && ent===S.run.player) ? 'player' : 'enemy';
  const from = FX.hpShown[side];
  // 減ったときだけ、前に表示していた長さの残像を、バーの後ろに残す（fxStartGhosts が、少し遅れて縮める）
  const ghost = (from!=null && from>now+0.05 && FX.prefs.on && !fxReduced())
    ? `<div class="hpbar-ghost" data-side="${side}" data-to="${now}" style="width:${from}%"></div>` : '';
  if(!ghost) FX.hpShown[side] = now;
  return `<div class="hpbar-wrap${on?' has-block':''}">${ghost}<div class="hpbar-fill" style="width:${now}%"></div><div class="hpbar-text"><span>${ent.hp} / ${ent.maxHp}</span>${badge}</div></div>`;
}

function renderRest(){

  if(!r.restState) r.restState = {left: Math.max(1, st.restActions||1), healed:false, upgraded:false, removed:false, mode:null};
  const rs = r.restState;
  const healAmt = Math.round(r.player.maxHp * (st.restHealPct/100));
  const finish = ()=>{ r.restState = null; advanceFloor(); };
  const acted = ()=>{ rs.left--; rs.mode = null; if(rs.left<=0) finish(); else renderRest(); };
  const upgradeEligible = ownedCardInstances(r).filter(inst=>!isUpgradedInstanceId(inst.cid));
  const owned = ownedCardInstances(r);
  const head = (sub)=>`<p class="eyebrow">SANCTUARY</p><h2>静かな休憩所</h2>

  if(rs.mode==='upgrade' || rs.mode==='remove'){

      ${st.restRemove===1 ? `<button id="btn-rest-remove" ${canRm?'':'disabled'}>${rs.removed?'カードを除去した':'カードを除去する'}</button>` : ''}
    </div>
    <div style="margin-top:18px;"><button class="ghost" id="btn-rest-skip">${rs.left < Math.max(1, st.restActions||1) ? '休憩を終えて先へ進む' : 'そのまま先へ進む'}</button></div>
  </div>`;
  qs('#btn-rest-heal').onclick = ()=>{ r.player.hp = Math.min(r.player.maxHp, r.player.hp + healAmt); rs.healed = true; acted(); };
  if(qs('#btn-rest-upgrade')) qs('#btn-rest-upgrade').onclick = ()=>{ if(canUp){ rs.mode = 'upgrade'; renderRest(); } };
  if(qs('#btn-rest-remove')) qs('#btn-rest-remove').onclick = ()=>{ if(canRm){ rs.mode = 'remove'; renderRest(); } };
  qs('#btn-rest-skip').onclick = finish;
}
