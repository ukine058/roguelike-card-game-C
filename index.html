  {key:'generateToEnemyDeck', label:'カードを生成し、敵のデッキに加える（この戦闘中のみ）'},
];
const GENERATE_TYPES = ['generateToHand','generateToDraw','generatePlay','generateToEnemyDeck'];
const ENEMY_ON_PLAYER_OPS = ['moveToHand','moveToDraw','moveToDiscard','costChange'];
const NEW_PLAYER_ONLY_OPS = ['captureEffect','elementAdd','elementRemove'];   // 敵が使うときは効果なし
// 消滅の期間: combat=この戦闘中（戦闘後に復活）／stay=永続（復活しない。デッキ一覧には残り、カード操作で戻せる）／destroy=デッキから完全に取り除く（従来の「永続」）
const EXHAUST_MODES = [{key:'combat', label:'この戦闘中だけ（戦闘後に復活する）'},{key:'stay', label:'永続（戦闘後も復活しない。デッキには残り、カード操作で戻せる）'},{key:'destroy', label:'デッキから完全に取り除く'}];
// 効果取得・付与の対象にできる効果欄（カード操作「効果付与」と同じ）
const CAPTURE_ALL = '*';
// Ops whose result normally only lasts for the current combat (reverted afterwards),
// unless the op is flagged "permanent".
const CARDOP_REVERTIBLE_TYPES = ['upgrade','duplicate','grantBuff','costChange','elementAdd','elementRemove','moveToExhausted','generateToHand','generateToDraw','generatePlay'];
const PILE_OPTIONS = [
  {key:'hand', label:'手札'},
  {key:'draw', label:'山札'},
  {key:'discard', label:'捨て札'},
  {key:'exhausted', label:'消滅済み'},
  {key:'drawAndDiscard', label:'山札+捨て札（合算）'},
  {key:'self', label:'そのカード自身（使用中のカード）'},
];
// A cardOp's "from pile" can point at more than one actual pile array at once
// (currently just "drawAndDiscard"). This maps the selectable key to the real
// r.<pile> array name(s) it draws candidates from.
const PILE_SOURCES = {
  hand: ['hand'], draw: ['draw'], discard: ['discard'], exhausted: ['exhausted'],
  drawAndDiscard: ['draw','discard'],
  self: ['_selfPile'],   // 使用中のカード自身（playCard などが一時的に r._selfPile に置く）
};
const GENERATE_POOL_OPTIONS = [
  {key:'normal', label:'通常のカードのみ（生成専用カードを除く）'},
  {key:'exclusiveOnly', label:'生成専用・敵専用カードのみ'},
  {key:'any', label:'すべてのカード'},
];

// For "add to the enemy's deck" the pool is the cards an enemy is allowed to use
// (usableBy enemy / both); the same three keys then mean:
const ENEMY_DECK_POOL_OPTIONS = [
  {key:'normal', label:'通常のカードのみ（生成専用カードを除く）'},
  {key:'exclusiveOnly', label:'生成専用カードのみ（敵の攻撃・防御など）'},
  {key:'any', label:'すべてのカード'},
];
function genPoolOptionsFor(opType){
  return opType==='generateToEnemyDeck' ? ENEMY_DECK_POOL_OPTIONS : GENERATE_POOL_OPTIONS;
}
function genPoolLabel(op){
  return (genPoolOptionsFor(op.type).find(p=>p.key===op.genPool)||{}).label || op.genPool;
}

// Every candidate a cardOp can act on is represented the same way, whether it comes
// from an existing pile (pile+idx known, so it can be moved/mutated in place) or from
// the master card list for a "generate" op (pile/idx are null — it doesn't exist yet).
function collectPileEntries(r, fromPileKey){
  const pileNames = PILE_SOURCES[fromPileKey] || [fromPileKey];
  const entries = [];
  pileNames.forEach(pn=>{
    const arr = r[pn];
    if(!arr) return;
    arr.forEach((rawId,i)=> entries.push({pile:pn, idx:i, rawId}));
  });
  return entries;
}
function collectGeneratePool(op){
    return S.cards.filter(c=>{
    if(!cardMatchesTags(c, op.filterTag, op.filterTagMode)) return false;
    if(op.genPool==='exclusiveOnly') return isNonRewardCard(c);
    if(op.genPool==='normal') return !isNonRewardCard(c);
    return true; // 'any'
  }).map(c=>({pile:null, idx:null, rawId:c.id}));
}
// Removes a set of already-selected entries from their source piles. Entries are
// grouped by pile and spliced highest-index-first so earlier indices stay valid.
function removeEntries(r, entries){
  const byPile = {};
  // 消滅札から出るカードは、「永続の消滅（復活しない）」の印を外す
  if(r.permExhaustIids) entries.forEach(e=>{ if(e.pile==='exhausted'){ const t = splitInstanceId(e.rawId).iid; if(t) delete r.permExhaustIids[t]; } });
  entries.forEach(e=>{ if(e.pile) (byPile[e.pile] = byPile[e.pile]||[]).push(e.idx); });
  Object.keys(byPile).forEach(pileName=>{
    byPile[pileName].sort((a,b)=>b-a).forEach(i=> r[pileName].splice(i,1));
  });
}
function pickWithReplacement(entries, count){
  const out = [];
  if(entries.length===0) return out;
  for(let i=0;i<count;i++) out.push(entries[Math.floor(Math.random()*entries.length)]);
  return out;
}

// Resolves a single card-operation. Most operation types finish synchronously, but
// countMode "choose" hands control to the player (via r.pendingChoice) and only calls
// done() once they confirm a selection — so every caller of resolveCardOp must treat
// it as asynchronous and continue its own work from inside `done`.
// 敵が使うカード操作は、視点が反転する:
//  ・「敵のデッキに加える」→ 敵から見た相手＝プレイヤーの山札に加える（この戦闘中のみ）
//  ・それ以外 → 敵自身のデッキ（r.enemy.deck）に作用する。敵には手札・山札・捨て札の区別がないので
//    「対象の山」は無視する。「捨て札に移動」「消滅」はデッキから取り除く（最後の1枚は残す）。
//    ただし「手札に移動」「山札に加える（移動）」「捨て札に移動」は、プレイヤーの山を対象にする（resolveCardOp側で処理）。
//    「消滅」は敵のデッキから取り除く。プレイヤーが選ぶ設定は、敵のデッキに作用する操作ではランダムになる。
// 敵のデッキは戦闘ごとに作り直されるため、変更はこの戦闘中のみ有効。
function enemyFreePlay(r, e, rawId){
  const c = cardById(rawId);
  if(!c || e.hp<=0 || r.player.hp<=0) return;
  pushLog(`${e.name}は「${c.name}」をコストなしで使った。`);
  resolveEnemyMoveEffects(r, e, c);
}
function resolveEnemyCardOp(r, op, done){
  const e = r.enemy;
  const rollCount = (avail)=>{
    if(op.countMode==='all') return avail;
    if(op.countMode==='random'){
      const a = op.countMin!==undefined?op.countMin:1, b = op.countMax!==undefined?op.countMax:1;
      const lo = Math.min(a,b), hi = Math.max(a,b);
      return lo + Math.floor(Math.random()*(hi-lo+1));
    }
    return op.countFixed!==undefined ? op.countFixed : 1;
  };
  const nameOf = rawId=>{ const c = cardById(rawId); return c ? c.name : rawId; };
  // 「さらに選ぶ」: 敵は選択画面を出せないので、ランダムに絞る
  const pickK = ((op.pickMode==='random' || op.pickMode==='choose') && op.countMode!=='choose' && !op.sequential) ? Math.max(1, op.pickCount|0 || 1) : 0;
  const narrowList = list=> (pickK && list.length>pickK) ? shuffle(list.slice()).slice(0, pickK) : list;

  if(GENERATE_TYPES.includes(op.type)){
    const pool = collectGeneratePool(op);
    if(pool.length===0){ done(); return; }
    const count = Math.max(0, rollCount(pool.length));
    let picked = (pickK && count<=pool.length) ? shuffle(pool.slice()).slice(0, count) : pickWithReplacement(pool, count);
    picked = narrowList(picked);
    if(picked.length===0){ done(); return; }
    const names = picked.map(x=>nameOf(x.rawId)).join('」「');
    if(op.type==='generateToEnemyDeck'){
      const newIds = picked.map(x=>{
        const iid = newId();
        r.temporaryCardIids[iid] = true;
        return withInstanceSuffix(x.rawId, iid);
      });
      // 次のターンの最初のドローより前に処理される。通常は山札に混ぜる（引くことがある）。
      // drawNext なら山札の一番上（pop される末尾）に積むので、次のターンに必ず引く。
      if(op.drawNext) r.draw = [...r.draw, ...newIds];
      else r.draw = shuffle([...r.draw, ...newIds]);
      pushLog(`${e.name}があなたの山札に「${names}」を加えた${op.drawNext ? '（山札の一番上。次のターンに引く）' : '（山札に混ざった）'}。`);
    } else if(op.type==='generatePlay'){
      pushLog(`${e.name}は「${names}」を生成した。`);
      picked.forEach(x=> enemyFreePlay(r, e, x.rawId));
    } else {
      const w = Math.max(1, op.deckWeight||1);
      picked.forEach(x=>{ e.deck.push({cardId:x.rawId, weight:w, temp:true}); });
      pushLog(`${e.name}のデッキに「${names}」が加わった（重み${w}）。`);
    }
    done(); return;
  }

  let entries = e.deck.map((d,i)=>({idx:i, d}));
  if(tagListOf(op.filterTag).length) entries = entries.filter(x=>{ const c = cardById(x.d.cardId); return c && cardMatchesTags(c, op.filterTag, op.filterTagMode); });
  if(op.type==='upgrade') entries = entries.filter(x=>!isUpgradedInstanceId(x.d.cardId));
  let count = Math.min(entries.length, Math.max(0, rollCount(entries.length)));
  if(op.type==='moveToDiscard' || op.type==='moveToExhausted') count = Math.min(count, e.deck.length-1);
  if(count<=0){ done(); return; }
  const sel = narrowList(shuffle(entries).slice(0, count));
  const names = sel.map(x=>nameOf(x.d.cardId)).join('」「');

  if(op.type==='moveToDiscard' || op.type==='moveToExhausted'){
    sel.map(x=>x.idx).sort((a,b)=>b-a).forEach(i=> e.deck.splice(i,1));
    pushLog(`${e.name}のデッキから「${names}」が取り除かれた。`);
  } else if(op.type==='upgrade'){
    sel.forEach(x=>{ x.d.cardId = upgradeRawId(x.d.cardId); });
    pushLog(`${e.name}のデッキの「${names}」が強化された。`);
  } else if(op.type==='duplicate'){
    sel.forEach(x=>{ e.deck.push({cardId:splitInstanceId(x.d.cardId).cid, weight:x.d.weight||1, temp:true}); });
    pushLog(`${e.name}のデッキに「${names}」の複製が加わった。`);
  } else if(op.type==='grantBuff'){
    const field = op.buffField, amount = op.buffAmount||0;
    if(tagListOf(op.addTags).length){
      sel.forEach(x=>{
        const {cid, iid} = splitInstanceId(x.d.cardId);
        const useIid = iid || newId();
        if(!r.tempInstanceBuffs[useIid]) r.tempInstanceBuffs[useIid] = {};
        grantTagsToStore(r.tempInstanceBuffs[useIid], op.addTags);
        x.d.cardId = withInstanceSuffix(cid, useIid);
      });
    }
    if(field && amount){
      sel.forEach(x=>{
        const {cid, iid} = splitInstanceId(x.d.cardId);
        const useIid = iid || newId();
        if(!r.tempInstanceBuffs[useIid]) r.tempInstanceBuffs[useIid] = {};
        r.tempInstanceBuffs[useIid][field] = (r.tempInstanceBuffs[useIid][field]||0) + amount;
        if(field.startsWith('cs_') && ['self','opponent'].includes(op.buffTarget)) r.tempInstanceBuffs[useIid]['csT_'+field.slice(3)] = op.buffTarget;
        x.d.cardId = withInstanceSuffix(cid, useIid);
      });
      const fd = allEffectFieldDefs().find(d=>d.key===field);
      pushLog(`${e.name}のデッキの「${names}」に「${fd?fd.label:field}」${amount>=0?'+':''}${amount}が付与された。`);
    }
  } else if(op.type==='play'){
    sel.forEach(x=>{ enemyFreePlay(r, e, x.d.cardId); enemyExhaustUsed(r, e, cardById(x.d.cardId), x.d.cardId, x.d); });
  }
  done();
}

// カード操作の参照増減: 基本値 + floor(増減量 × 参照値) を、解決する時点で反映する。反映後は scales を外す（1枚ずつ選び直す処理などで二重に足さないため）。
function withOpScales(op, actor){
  if(!op || !op.scales) return op;
  const out = {...op}; delete out.scales;
  Object.keys(OP_SCALE_FIELDS).forEach(f=>{
    const x = op.scales[f];
    if(!x || !x.source || x.source==='none') return;
    const [lo, hi] = OP_SCALE_FIELDS[f];
    const bonus = Math.floor((x.perPoint||0) * scaleSourceValue(x.source, x.tag, actor, x.tagMode));
    out[f] = Math.max(lo, Math.min(hi, (out[f]|0) + bonus));
  });
  return out;
}
// 追跡中のカード（インスタンスID）を、いまの山から探して、操作の対象の形（pile / idx / rawId）にする
function findTrackedEntries(r, track){
  const out = [];
  const names = ['hand','draw','discard','exhausted','_selfPile'];
  track.forEach(iid=>{
    for(const pn of names){
      const arr = r[pn]; if(!arr) continue;
      const i = arr.findIndex(x=> splitInstanceId(x).iid===iid);
      if(i>=0){ out.push({pile:pn, idx:i, rawId:arr[i]}); break; }
    }
  });
  return out;
}
// 続けの操作を、並んでいる順に、同じ対象のカードへ行う。対象がもう見つからなければ、残りは放棄する。
function runThenOps(r, thens, track, done){
  let i = 0;
  (function next(){
    if(i>=thens.length || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
    const t = thens[i++];
    const entries = findTrackedEntries(r, track);
    if(!entries.length){ done(); return; }
    resolveCardOp(r, {...t, enabled:true, then:[], _pre:entries}, next);
  })();
}
// 枚数の元がX（直前のカード操作の対象枚数、またはその合計）のとき、いまのXから枚数を決める。固定数・プレイヤーが選ぶ、のときだけ。
// 計算: floor(X × 倍率) ＋ 設定値（加算）。敵が使うときのXは0。反映後は countSource を外す（1枚ずつ選び直す処理などで二重に計算しないため）。
function withOpX(r, op){
  if(!op || !op.countSource || op.countSource==='value') return op;
  if(op.countMode!=='fixed' && op.countMode!=='choose') return op;
  const ox = r._opX || {};
  const x = op.fromEnemy ? 0 : (op.countSource==='xTotal' ? (ox.total||0) : (ox.last||0));
  const n = Math.max(0, Math.min(99, Math.floor(x * (op.xMult===undefined ? 1 : op.xMult)) + (op.countFixed|0)));
  return {...op, countFixed:n, countSource:'value'};
}
// カード実体の補正の記録に、効果値を加算する（add）か、その値に上書きする（set）。数値以外（付与先 csT_ の文字列）は上書き。
// カード実体の補正の記録に、タグを追加する（既存の配列は共有しないよう、新しい配列にする）
function grantTagsToStore(rec, tags){
  const list = tagListOf(tags);
  if(!list.length) return;
  rec.__tags = (rec.__tags||[]).concat(list.filter(t=>!(rec.__tags||[]).includes(t)));
}
function grantToStore(rec, field, value, isSet){
  if(typeof value==='string'){ rec[field] = value; return; }
  if(isSet){ rec['='+field] = value; delete rec[field]; return; }
  if(rec['='+field]!==undefined) rec['='+field] += value;   // すでに上書きされている欄は、その値に足す
  else rec[field] = (rec[field]||0) + value;
}
function resolveCardOp(r, op, done){
  if(!op || !op.enabled){ done(); return; }
  op = withOpScales(op, op.fromEnemy ? 'enemy' : undefined);
  op = withOpX(r, op);
  // レリックの「戦闘開始時にカードを使用する」: 指定のカードをコストなしで使う（山にも手札にも入らない）
  if(op.type==='useCardById'){
    const cc = cardById(op.cardId);
    if(!cc){ done(); return; }
    if((r._autoPlayDepth||0) >= 4){ pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`); done(); return; }
    r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
    pushLog(`「${cc.name}」をコストなしで使用した。`);
    withXValue(r, 0, cb=>resolveCardPlayCore(r, cc, cb), ()=>{ r._autoPlayDepth -= 1; done(); });
    return;
  }
  // 「そのカード自身」: 使用中のカード（r._selfPile）だけが対象。1枚なので枚数・選択・絞り込みは使わない。
  // 敵が使うとき、または「コストを消費せず使用する」との組み合わせ（自分自身を再度使うことになる）は効果なし。
  if(!GENERATE_TYPES.includes(op.type) && op.fromPile==='self'){
    if(op.fromEnemy || op.type==='play'){ done(); return; }
    op = {...op, countMode:'all', sequential:false, filterTag:''};
  }
  // 敵が使う「手札に移動／山札に加える／捨て札に移動」は、プレイヤーの山を対象にする（通常の処理で解決。
  // 枚数の決め方が「プレイヤーが選ぶ」なら、選択画面が出る）。それ以外は、敵自身のデッキに作用する。
  if(op.fromEnemy && NEW_PLAYER_ONLY_OPS.includes(op.type)){ done(); return; }
  if(op.fromEnemy && ENEMY_ON_PLAYER_OPS.includes(op.type)) op = {...op, fromEnemy:false};
  else if(op.fromEnemy){ resolveEnemyCardOp(r, op, done); return; }
  // 「続けて行う操作」: まず本体の操作を行い、選ばれた（生成された）カードをインスタンスIDで追跡して、同じカードに順に続けの操作を行う
  if(op.then && op.then.length && !op._track){
    const track = [];
    resolveCardOp(r, {...op, then:[], _track:track}, ()=> runThenOps(r, op.then, track, done));
    return;
  }
  // The player never picks which card goes into the enemy's deck: "choose" acts as "fixed".
  if(op.type==='generateToEnemyDeck' && op.countMode==='choose') op = {...op, countMode:'fixed'};

  // "Re-pick one at a time": instead of choosing every target up front, pick one, resolve it,
  // then pick the next from the pile as it stands afterwards (so cards drawn/moved by the
  // first one can be picked, and a "choose" op prompts the player once per card).
  if(op.sequential && op.countMode!=='all'){
    let n;
    if(op.countMode==='random'){
      const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
      const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
      n = lo + Math.floor(Math.random()*(hi-lo+1));
    } else n = op.countFixed!==undefined ? op.countFixed : 1;
    const single = {...op, sequential:false, pickMode:'none', countMode: op.countMode==='choose' ? 'choose' : 'fixed', countFixed:1};
    let i = 0;
    (function nextPick(){
      if(i>=n || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
      i++;
      resolveCardOp(r, single, nextPick);
    })();
    return;
  }
  const isGenerate = GENERATE_TYPES.includes(op.type);

  // 「山札から手札へ移動」は通常のドローと同じ扱い：山札が足りないときは捨て札を山札に戻す
  if(op.type==='moveToHand' && (op.fromPile||'hand')==='draw' && op.countMode!=='all'){
    const need = op.countMode==='random'
      ? Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1)
      : (op.countFixed!==undefined ? op.countFixed : 1);
    if(r.draw.length < need && r.discard.length>0){
      r.draw = shuffle([...r.draw, ...r.discard]);
      r.discard = [];
      pushLog('捨札を山札に戻した。');
    }
  }

  // 続けの操作: 追跡中のカードがすでに決まっているので、選び直さずにそのまま処理する
  if(op._pre){ finish(op._pre.slice()); return; }
  let entries = isGenerate ? collectGeneratePool(op) : collectPileEntries(r, op.fromPile || 'hand');
  if(!isGenerate && tagListOf(op.filterTag).length){
    entries = entries.filter(e=>{
      const cc = cardById(e.rawId);
      return cc && cardMatchesTags(cc, op.filterTag, op.filterTagMode);
    });
  }
  if(op.type==='upgrade'){
    entries = entries.filter(e=>!isUpgradedInstanceId(e.rawId));
  }
  if(entries.length===0){ done(); return; }

  // 「さらに選ぶ」: 対象が決まったあと、操作を行う前に、その中からさらに絞る。選ばれなかったカードには、この操作は何も起きない（生成は、そもそも作られない）。
  // 続けの操作（_pre）では使わない。候補が選ぶ枚数以下なら、選択画面は出さず、そのまま行う。
  function finish(selected){
    const pm = op.pickMode;
    if((pm!=='random' && pm!=='choose') || op.countMode==='choose' || op.sequential || op._pre || selected.length===0){ finishCore(selected); return; }
    const k = Math.max(1, op.pickCount|0 || 1);
    if(selected.length<=k){ finishCore(selected); return; }
    if(pm==='random' || op.type==='generateToEnemyDeck'){   // 敵のデッキに加えるカードを、プレイヤーが選ぶことはない
      const chosen = shuffle(selected.slice()).slice(0, k);
      pushLog(`候補${selected.length}枚から、ランダムに${k}枚が選ばれた。`);
      finishCore(chosen); return;
    }
    r.pendingChoice = {
      candidates: selected,
      need: k,
      selectedIdx: [],
      optional: !!op.pickOptional,
      prompt: op.prompt || `${selected.length}枚から${k}枚を選んでください${op.pickOptional ? '（選ばなくてもよい）' : ''}`,
      onConfirm: (chosen)=>{
        if(chosen.length===0) pushLog('何も選ばなかったため、この操作は行われなかった。');
        else pushLog(`候補${selected.length}枚から${chosen.length}枚を選んだ。`);
        finishCore(chosen);
      },
    };
    renderBattle();
  }
  function finishCore(selected){
    if(selected.length===0){ done(); return; }
    // 対象の枚数を記録する（このカードの効果の中で、あとの効果が参照増減の参照元「カード操作の対象枚数」として使える）
    if(op._tally){ op._tally.n += selected.length; if(r._opX) r._opX.last = op._tally.n; }
    // 付与量・コスト増減量を「設定値 × 対象の枚数」にする
    if(op.valueMode==='targetCount' && (op.type==='grantBuff' || op.type==='costChange')){
      const n = selected.length;
      op = {...op, buffAmount:(op.buffAmount||0)*n, costDelta:(op.costDelta|0)*n};
    }
    // 続けの操作のために、対象のカードに安定したインスタンスIDを付けて控える（操作で山や位置が変わっても追跡できる）
    if(op._track && !isGenerate){
      selected.forEach(e=>{
        if(!e.pile || !r[e.pile]) return;
        const {cid, iid} = splitInstanceId(e.rawId);
        const useIid = iid || newId();
        if(!iid){ r[e.pile][e.idx] = withInstanceSuffix(cid, useIid); e.rawId = r[e.pile][e.idx]; }
        op._track.push(useIid);
      });
    }

    // Added to the enemy's list of possible moves for the rest of this battle. The enemy
    // object is rebuilt for every battle, so nothing carries over. The move already
    // shown as the intent is not changed; the new entries count from the next roll on.
    if(op.type==='generateToEnemyDeck'){
      const w = Math.max(1, op.deckWeight||1);
      selected.forEach(e=>{ r.enemy.deck.push({cardId:e.rawId, weight:w, temp:true}); });
      const names = selected.map(e=>{ const cc = cardById(e.rawId); return cc ? cc.name : e.rawId; });
      pushLog(`${r.enemy.name}のデッキに「${names.join('」「')}」が加わった（重み${w}）。`);
      done(); return;
    }

    if(isGenerate){
      const newIds = selected.map(e=>{
        const iid = newId();
        if(!op.permanent) r.temporaryCardIids[iid] = true;
        return withInstanceSuffix(e.rawId, iid);
      });
      if(op._track) newIds.forEach(id=>{ const t = splitInstanceId(id).iid; if(t) op._track.push(t); });
      if(op.type==='generateToHand'){
        r.hand.push(...newIds);
        pushLog(`${newIds.length}枚のカードを生成し、手札に加えた。`);
        done(); return;
      }
      if(op.type==='generateToDraw'){
        r.draw = shuffle([...r.draw, ...newIds]);
        pushLog(`${newIds.length}枚のカードを生成し、山札に加えた。`);
        done(); return;
      }
      // generatePlay
      pushLog(`${newIds.length}枚のカードを生成し、コストなしで使用した。`);
      let gi=0;
      (function nextGen(){
        if(gi>=newIds.length){ done(); return; }
        const rawId = newIds[gi++];
        const cc = cardById(rawId);
        if(!cc){ nextGen(); return; }
        if((r._autoPlayDepth||0) >= 4){
          pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`);
          r.discard.push(rawId);
          nextGen(); return;
        }
        r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
        runWithSelfCard(r, rawId, cb=>withXValue(r, 0, cb2=>resolveCardPlayCore(r, cc, cb2), cb), fin=>{
          r._autoPlayDepth -= 1;
          if(fin){ if(cc.exhaust){ r.exhausted.push(fin); noteExhausted(r, [fin]); } else r.discard.push(fin); }
          nextGen();
        });
      })();
      return;
    }

    if(op.type==='upgrade'){
      selected.forEach(e=>{
        if(op.permanent){
          r[e.pile][e.idx] = upgradeRawId(e.rawId);
        } else {
          // Temporary upgrade: the copy needs its own identity so it can be reverted
          // (and only it) once the combat is over.
          const {cid, iid} = splitInstanceId(e.rawId);
          const useIid = iid || newId();
          r.tempUpgradeIids[useIid] = true;
          r[e.pile][e.idx] = withInstanceSuffix(cid+'+', useIid);
        }
      });
      pushLog(`${selected.length}枚のカードを強化した${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      done(); return;
    }
    if(op.type==='duplicate'){
      // A duplicate is a fresh, unbuffed copy of the base card — it does not inherit
      // any per-instance buff granted to the original physical card. Unless permanent,
      // the copy is registered as temporary and vanishes when the combat ends.
      selected.forEach(e=>{
        const cid = splitInstanceId(e.rawId).cid;
        if(op.permanent){ r.discard.push(cid); }
        else{
          const iid = newId();
          r.temporaryCardIids[iid] = true;
          r.discard.push(withInstanceSuffix(cid, iid));
        }
      });
      pushLog(`${selected.length}枚のカードを複製した${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      done(); return;
    }
    if(op.type==='captureEffect'){
      // 選ばれたカードのうち、最後の1枚から効果を取得する（対象の山は動かさない）
      const last = selected[selected.length-1];
      const cc = last ? cardById(last.rawId) : null;
      const fields = {};
      if(cc){
        const all = (op.captureFields||[CAPTURE_ALL]).includes(CAPTURE_ALL);
        allEffectFieldDefs().forEach(def=>{
          if(!all && !(op.captureFields||[]).includes(def.key)) return;
          const dflt = def.default!==undefined ? def.default : 0;
          const v = cc[def.key];
          if(typeof v==='number' && v!==dflt){
            fields[def.key] = v;
            if(def._statusId){
              if(['self','opponent','both'].includes(cc['csT_'+def._statusId])) fields['csT_'+def._statusId] = cc['csT_'+def._statusId];
              if(typeof cc['csX_'+def._statusId]==='number' && cc['csX_'+def._statusId]) fields['csX_'+def._statusId] = cc['csX_'+def._statusId];
            }
          }
        });
      }
      r._captured = {name: cc ? cc.name : '', fields};
      pushLog(cc ? `「${cc.name}」から効果を取得した（${Object.keys(fields).filter(k=>!/^cs[TX]_/.test(k)).length}項目）。` : '取得できるカードがなかった。');
      done(); return;
    }
    if(op.type==='elementAdd' || op.type==='elementRemove'){
      const id = op.elementId || '';
      if(op.type==='elementAdd' && !elementById(id)){ done(); return; }
      if(op.type==='elementRemove' && !id){ done(); return; }
      const store = op.permanent ? r.instanceBuffs : r.tempInstanceBuffs;
      selected.forEach(e=>{
        const {cid, iid} = splitInstanceId(e.rawId);
        const useIid = iid || newId();
        if(!store[useIid]) store[useIid] = {};
        (store[useIid].__el = store[useIid].__el || []).push([op.type==='elementAdd' ? '+' : '-', id]);
        r[e.pile][e.idx] = withInstanceSuffix(cid, useIid);
      });
      pushLog(`${selected.length}枚のカードの攻撃の属性${op.type==='elementAdd' ? `に「${elementName(id)}」を付与した` : `から${id==='all' ? 'すべて' : '「'+tipElementName(id)+'」'}を取り除いた`}${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      done(); return;
    }
    if(op.type==='grantBuff' && op.buffSource==='captured'){
      const cap = r._captured;
      const keys = cap ? Object.keys(cap.fields) : [];
      if(!keys.length){ pushLog('付与する取得済みの効果がなかった。'); done(); return; }
      const store = op.permanent ? r.instanceBuffs : r.tempInstanceBuffs;
      selected.forEach(e=>{
        const {cid, iid} = splitInstanceId(e.rawId);
        const useIid = iid || newId();
        if(!store[useIid]) store[useIid] = {};
        keys.forEach(k=> grantToStore(store[useIid], k, cap.fields[k], op.buffMode==='set'));
        grantTagsToStore(store[useIid], op.addTags);
        r[e.pile][e.idx] = withInstanceSuffix(cid, useIid);
      });
      pushLog(`${selected.length}枚のカードに、取得した効果（${cap.name}）を${op.buffMode==='set'?'上書き':'加算'}で付与した${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      done(); return;
    }
    if(op.type==='grantBuff'){
      const field = op.buffField; const amount = op.buffAmount||0;
      const addTags = tagListOf(op.addTags);
      if((field && amount) || addTags.length){
        const store = op.permanent ? r.instanceBuffs : r.tempInstanceBuffs;
        selected.forEach(e=>{
          const {cid, iid} = splitInstanceId(e.rawId);
          const useIid = iid || newId();
          if(!store[useIid]) store[useIid] = {};
          if(field && amount){
            grantToStore(store[useIid], field, amount, op.buffMode==='set');
            if(field.startsWith('cs_') && ['self','opponent'].includes(op.buffTarget)) store[useIid]['csT_'+field.slice(3)] = op.buffTarget;
          }
          grantTagsToStore(store[useIid], addTags);
          r[e.pile][e.idx] = withInstanceSuffix(cid, useIid);
        });
        if(field && amount){
          const fieldDef = allEffectFieldDefs().find(d=>d.key===field);
          pushLog(`${selected.length}枚のカードに「${fieldDef?fieldDef.label:field}」${amount>=0?'+':''}${amount}を付与した。`);
        }
        if(addTags.length) pushLog(`${selected.length}枚のカードに、タグ「${addTags.join('・')}」を追加した${op.permanent?'（永続）':'（この戦闘中のみ）'}。`);
      }
      done(); return;
    }
    if(op.type==='costChange'){
      const delta = op.costDelta|0;
      if(delta){
        const store = op.permanent ? r.instanceBuffs : r.tempInstanceBuffs;
        selected.forEach(e=>{
          const {cid, iid} = splitInstanceId(e.rawId);
          const useIid = iid || newId();
          if(!store[useIid]) store[useIid] = {};
          store[useIid].cost = (store[useIid].cost||0) + delta;
          r[e.pile][e.idx] = withInstanceSuffix(cid, useIid);
        });
        pushLog(`${selected.length}枚のカードのコストを${delta>=0?'+':''}${delta}した。`);
      }
      done(); return;
    }
    if(op.type==='play'){
      // Auto-play the targeted cards for free (no energy cost, not counted as
      // hand-play). Guard against runaway chains (a card auto-playing cards that
      // in turn auto-play more cards) with a small recursion depth cap.
      removeEntries(r, selected);
      pushLog(`${selected.length}枚のカードをコストなしで使用した。`);
      let pi=0;
      (function nextPlay(){
        if(pi>=selected.length){ done(); return; }
        const e = selected[pi++];
        const cc = cardById(e.rawId);
        if(!cc){ nextPlay(); return; }
        if((r._autoPlayDepth||0) >= 4){
          pushLog(`${cc.name}: 連鎖が深すぎるため発動を打ち切った。`);
          r.discard.push(e.rawId);
          nextPlay(); return;
        }
        r._autoPlayDepth = (r._autoPlayDepth||0) + 1;
        runWithSelfCard(r, e.rawId, cb=>withXValue(r, 0, cb2=>resolveCardPlayCore(r, cc, cb2), cb), fin=>{
          r._autoPlayDepth -= 1;
          if(fin){ if(cc.exhaust){ r.exhausted.push(fin); noteExhausted(r, [fin]); } else r.discard.push(fin); }
          nextPlay();
        });
      })();
      return;
    }
    const destMap = {moveToHand:'hand', moveToDiscard:'discard', moveToDraw:'draw', moveToExhausted:'exhausted'};
    const dest = destMap[op.type];
    if(!dest){ done(); return; }
    if(op.type==='moveToExhausted' && op.exhaustMode==='stay'){
      // 永続の消滅: 消滅札へ移し、戦闘が終わっても復活しない（デッキ一覧には残る。カード操作で戻せる）
      r.permExhaustIids = r.permExhaustIids || {};
      removeEntries(r, selected);
      selected.forEach(e=>{
        const {cid, iid} = splitInstanceId(e.rawId);
        const useIid = iid || newId();
        r.permExhaustIids[useIid] = true;
        r.exhausted.push(withInstanceSuffix(cid, useIid));
      });
      pushLog(`${selected.length}枚のカードを消滅させた（永続：戦闘後も復活しない）。`);
      noteExhausted(r, selected.map(e=>e.rawId));
      done(); return;
    }
    if(op.type==='moveToExhausted' && op.exhaustMode==='destroy'){
      // Permanent exhaust: the card is destroyed for the rest of the run.
      removeEntries(r, selected);
      noteExhausted(r, selected.map(e=>e.rawId));   // 消滅時の効果（補正を消す前に）
      selected.forEach(e=>{
        const {iid} = splitInstanceId(e.rawId);
        if(iid){ delete r.instanceBuffs[iid]; delete r.tempInstanceBuffs[iid]; delete r.tempUpgradeIids[iid]; }
      });
      pushLog(`${selected.length}枚のカードを永久に消滅させた。`);
      done(); return;
    }
    removeEntries(r, selected);
    const movedIds = selected.map(e=>e.rawId);
    if(dest==='draw'){ r.draw = shuffle([...r.draw, ...movedIds]); }
    else{ r[dest].push(...movedIds); }
    if(dest==='exhausted') noteExhausted(r, movedIds);
    if(dest==='hand'){
      // 山札から手札に来たカードは、通常のドローと同じく「引いたとき」の効果が発動する
      selected.forEach(e=>{ if(e.pile==='draw') applyCardDrawEffect(r, cardById(e.rawId)); });
      notePileEvent(r, 'drawn', selected.filter(e=>e.pile==='draw').map(e=>e.rawId));
      if(r.combatStats) r.combatStats.drawn += selected.filter(e=>e.pile==='draw').length;
    }
    if(dest==='discard' && r.combatStats) r.combatStats.discarded += selected.filter(e=>e.pile!=='discard').length;
    if(dest==='discard') notePileEvent(r, 'discarded', selected.filter(e=>e.pile!=='discard').map(e=>e.rawId));
    pushLog(`${movedIds.length}枚のカードを${{hand:'手札に',discard:'捨て札に',draw:'山札に',exhausted:'消滅済みに'}[dest]}移動した。`);
    done();
  }

  if(op.countMode==='choose'){
    const need = Math.min(Math.max(op.countFixed!==undefined?op.countFixed:1, 0), entries.length);
    if(need<=0){ done(); return; }
    r.pendingChoice = {
      candidates: entries,
      need,
      selectedIdx: [],
      prompt: op.prompt || '',
      onConfirm: (chosen)=>{ finish(chosen); },
    };
    renderBattle();
    return;
  }

  let count;
  if(op.countMode==='all') count = entries.length;
  else if(op.countMode==='random'){
    const lo = Math.min(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
    const hi = Math.max(op.countMin!==undefined?op.countMin:1, op.countMax!==undefined?op.countMax:1);
    count = lo + Math.floor(Math.random()*(hi-lo+1));
  } else count = op.countFixed!==undefined ? op.countFixed : 1;

  // 「さらに選ぶ」を使う生成は、候補が重複しないように選ぶ（プールが足りないときだけ重複を許す）
  const pickOn = op.pickMode==='random' || op.pickMode==='choose';
  const selected = isGenerate
    ? ((pickOn && count<=entries.length) ? shuffle(entries.slice()).slice(0, Math.max(0,count)) : pickWithReplacement(entries, Math.max(0,count)))
    : shuffle(entries.slice()).slice(0, Math.max(0,count));
  finish(selected);
}

// Applies a card's own numeric effects (damage/block/draw/buffs/debuffs/card-op...),
// repeated according to its "hits" field. This is shared by a normal hand-play, by a
// trigger firing later, and by cardOp's "play"/"generatePlay" (free auto-play) types.
// Continuation-passing: calls done() once every repetition (and any card-op inside it,
// including ones that pause for a player choice) has fully resolved.
// Applies every "numeric effect" field (damage/block/draw/buffs/debuffs/heal/etc.) a
// single time. Shared by applyCardEffects's repeat loop (cards/triggers) and by the
// relic timed-effect resolver, which doesn't want a repeat loop or the "already dead"
// early-exit that combat-end relics would otherwise trip on.
// ===== 効果の処理順 =====
// カードの effectOrder（効果の項目キーの配列）に従って処理する。載っていない効果は、従来の順で後ろに付く。
// 項目キーは、カード編集の効果欄のキー（damage, block, strength, cs_xxx …）と、状態の操作（statusOp）。
const PLAYER_EFFECT_ORDER = ['damage','block','draw','energy','strength','permStrength','dexterity','permDexterity',
  'metallicize','permMetallicize','thorns','permThorns','weak','vulnerable','poison','stun','reduceEnemyStrength',
  'selfWeak','selfVulnerable','selfPoison','heal','regen','loseHp'];
const ENEMY_EFFECT_ORDER = ['damage','block','heal','strength','dexterity','metallicize','thorns','weak','vulnerable','poison'];
// 敵側では、永続の項目は戦闘中の項目と同じ処理（まとめて1回）なので、順番の指定も同じ項目として数える
const ENEMY_PERM_ALIAS = {permStrength:'strength', permDexterity:'dexterity', permMetallicize:'metallicize', permThorns:'thorns'};
function defaultEffectOrder(c, base){
  const ids = base.concat(customStatusFieldDefs().map(d=>d.key), ['statusOp']);
  // 旧設定「状態の操作を付与より先に実行」は、ドローの前に置く順番として読み替える
  if(c && c.statusOp && c.statusOp.first && base.includes('draw')){
    ids.splice(ids.indexOf('statusOp'),1);
    ids.splice(ids.indexOf('draw'),0,'statusOp');
  } else if(c && c.statusOp && c.statusOp.first){
    ids.splice(ids.indexOf('statusOp'),1);
    ids.splice(ids.indexOf('strength'),0,'statusOp');
  }
  return ids;
}
function orderedEffectIds(c, base, alias){
  const defaults = defaultEffectOrder(c, base);
  const out = [];
  (Array.isArray(c && c.effectOrder) ? c.effectOrder : []).forEach(id=>{
    const k = (alias && alias[id]) || id;
    if(defaults.includes(k) && !out.includes(k)) out.push(k);
  });
  defaults.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}

function applyEffectValues(r, c, onlyIds){
  // 戦闘前（最初のレリック選択など）は敵がまだいない。敵向けの効果は、受け皿の仮の敵に入れて捨てる。
  const P = r.player, E = r.enemy || {name:'敵', hp:1, maxHp:1, block:0, strength:0, dexterity:0, weak:0, vulnerable:0, poison:0, stun:0, thorns:0, customStatus:{}, triggers:[]};
  const val = k=> Math.max(0, (c[k]||0) + scaleBonus(c,k));
  const L = o=> logStat({name:c.name, ...o});
  // 数値を足す効果（強化・弱体・毒など）の共通処理
  const gain = (who, ent, ek, field, key, eff, state, legacy)=>{
    const base = c[key]||0, v = val(key);
    if(v<=0) return;
    const before = ent[field]||0;
    if(grantBuiltin(ent, field, v)===0) return;   // 排他で付与されなかった
    L({who, key:ek+':'+field, eff, v, base, before, after:ent[field], state:state||eff, legacy});
  };
  const steps = {
    damage(){
      const dmgBase = c.damage||0;
      const dmgVal = Math.max(0, dmgBase + scaleBonus(c,'damage'));
      if(!(dmgVal>0 && r.enemy)) return;
      const strTotal = r.player.strength + r.player.permStrength;
      applyDamageToEnemy(dmgVal + strTotal, c.pierce, h=> logPlayerHit(c, h, dmgBase, dmgVal-dmgBase, strTotal), attackElements(r.player, c));
      // 吸収: ブロックで防がれた分は回復しない。実際に敵のHPを減らせた分だけ回復する。
      if(c.lifesteal){
        const lh = r.lastEnemyHit, heal = lh ? lh.hpLoss : 0;
        if(heal>0){ const b = r.player.hp; r.player.hp = Math.min(r.player.maxHp, r.player.hp + heal); fxHeal(r.player, r.player.hp-b); pushLog(`${c.name}: 吸収でHPを${r.player.hp-b}回復（HP ${b}→${r.player.hp}）。`); }
        else if(lh && lh.total>0) pushLog(`${c.name}: 吸収は全て防がれたので回復なし。`);
      }
      // 敵が持つカスタム状態の「反射」: 攻撃を受けた敵が、攻撃した側にダメージを返す（ブロック無視）
      const foeReflect = r.enemy ? ((r.enemy.thorns||0) + (r.enemy.permThorns||0) + customReflectDamage(r.enemy)) : 0;
      if(foeReflect>0 && r.enemy.hp>0 && r.player.hp>0){
        const pBefore = r.player.hp;
        r.player.hp = Math.max(0, r.player.hp - foeReflect);
        fxLose(r.player, pBefore-r.player.hp);
        pushLog(`反射ダメージを${foeReflect}受けた（HP ${pBefore}→${r.player.hp}）。`, 'hit');
      }
    },
    block(){
      const blockVal = Math.max(0, (c.block||0) + scaleBonus(c,'block'));
      if(!(blockVal>0)) return;
      const total = Math.max(0, blockVal + r.player.dexterity + r.player.permDexterity + customBlockGainBonus(r.player));
      const bBefore = r.player.block;
      r.player.block += total; fxBlock(r.player, total);
      logBlockGain(c.name, 'あなた', 'p', total, {base:c.block||0, scale:blockVal-(c.block||0), flats:[{v:r.player.dexterity + r.player.permDexterity, label:'器用'},{v:customBlockGainBonus(r.player), label:'状態'}]}, bBefore, r.player.block);
    },
    draw(){
      const drawVal = val('draw');
      if(!(drawVal>0)) return;
      const before = r.hand.length; notePileEvent(r, 'drawn', drawCards(drawVal));
      L({who:'あなた', key:'p:hand', eff:'ドロー', v:drawVal, base:c.draw||0, before, after:r.hand.length, state:'手札', legacy:`${c.name}: カードを${drawVal}枚引いた。`});
    },
    energy(){
      const energyVal = (c.energy||0) + scaleBonus(c,'energy');
      if(!energyVal) return;
      const before = P.energy; P.energy += energyVal;
      L({who:'あなた', key:'p:energy', eff:'エネルギー', v:energyVal, base:c.energy||0, before, after:P.energy});
    },
    strength(){ gain('あなた', P, 'p', 'strength', 'strength', '強化', '強化(戦闘中)', v=>`${c.name}: 強化+${v}（この戦闘中）。`); },
    permStrength(){ gain('あなた', P, 'p', 'permStrength', 'permStrength', '強化', '強化(永続)', v=>`${c.name}: 強化+${v}（永続）。`); },
    dexterity(){ gain('あなた', P, 'p', 'dexterity', 'dexterity', '器用', '器用(戦闘中)', v=>`${c.name}: 器用+${v}（この戦闘中）。`); },
    permDexterity(){ gain('あなた', P, 'p', 'permDexterity', 'permDexterity', '器用', '器用(永続)', v=>`${c.name}: 器用+${v}（永続）。`); },
    metallicize(){ gain('あなた', P, 'p', 'metallicize', 'metallicize', '自動ブロック', '自動ブロック(戦闘中)'); },
    permMetallicize(){ gain('あなた', P, 'p', 'permMetallicize', 'permMetallicize', '自動ブロック', '自動ブロック(永続)'); },
    thorns(){ gain('あなた', P, 'p', 'thorns', 'thorns', '棘', '棘(戦闘中)'); },
    permThorns(){ gain('あなた', P, 'p', 'permThorns', 'permThorns', '棘', '棘(永続)'); },
    weak(){ gain(E.name, E, 'e', 'weak', 'weak', '弱体'); },
    vulnerable(){ gain(E.name, E, 'e', 'vulnerable', 'vulnerable', '脆弱'); },
    poison(){ gain(E.name, E, 'e', 'poison', 'poison', '毒'); },
    stun(){ gain(E.name, E, 'e', 'stun', 'stun', '麻痺', '麻痺', v=>`${c.name}: 敵を${v}ターン麻痺させた。`); },
    reduceEnemyStrength(){
      const reduceStrVal = val('reduceEnemyStrength');
      if(!(reduceStrVal>0)) return;
      const before = E.strength;
      E.strength = Math.max(0, E.strength - reduceStrVal);
      // タグ「強化」を持つカスタム状態も、同じ量だけスタックが減る
      (S.customStatuses||[]).forEach(st=>{
        if((st.tags||[]).includes('強化') && customStatusStacks(E, st.id)>0) addCustomStatusStacks(E, st.id, -reduceStrVal);
      });
      L({who:E.name, key:'e:strength', eff:'強化減少', v:reduceStrVal, base:c.reduceEnemyStrength||0, before, after:E.strength, state:'強化', legacy:`${c.name}: 敵の強化を${reduceStrVal}減少させた。`});
    },
    selfWeak(){ gain('あなた', P, 'p', 'weak', 'selfWeak', '弱体'); },
    selfVulnerable(){ gain('あなた', P, 'p', 'vulnerable', 'selfVulnerable', '脆弱'); },
    selfPoison(){ gain('あなた', P, 'p', 'poison', 'selfPoison', '毒'); },
    heal(){
      const healVal = val('heal');
      if(!(healVal>0)) return;
      const before = P.hp; P.hp = Math.min(P.maxHp, P.hp + healVal); fxHeal(P, P.hp-before);
      L({who:'あなた', key:'p:hp', eff:'回復', v:healVal, base:c.heal||0, before, after:P.hp, state:'HP'});
    },
    regen(){ gain('あなた', P, 'p', 'regen', 'regen', '再生'); },
    loseHp(){
      const loseHpVal = val('loseHp');
      if(!(loseHpVal>0)) return;
      const before = P.hp; P.hp = Math.max(0, P.hp - loseHpVal); fxLose(P, before-P.hp);
      L({who:'あなた', key:'p:hp', eff:'ダメージ(代償)', v:loseHpVal, base:c.loseHp||0, before, after:P.hp, state:'HP'});
    },
    statusOp(){ applyStatusOp(c.statusOp, r.player, r.enemy, c.name); },
  };
  customStatusFieldDefs().forEach(def=>{
    steps[def.key] = ()=>{
      const base0 = c[def.key]||0;
      const amt = base0 + scaleBonus(c, def.key);   // 負の値は、スタックを減らす
      const st = (S.customStatuses||[]).find(s=>s.id===def._statusId);
      if(!st) return;
      const side = csGrantSide(c, st);
      const extra = side==='both' ? ((c['csX_'+st.id])|0) : 0;
      if(amt===0 && extra===0) return;
      const nm = `${st.emoji||''}${st.name}`;
      const give = (ent, who, ek, n, base)=>{
        const before = customStatusStacks(ent, st.id);
        if(grantCustomStatus(ent, st.id, n)===0 && n>0) return;   // 排他で付与されなかった
        L({who, key:`${ek}:cs:${st.id}`, eff:nm, v:n, base, before, after:customStatusStacks(ent, st.id), state:nm});
      };
      if(side==='both'){
        if(amt!==0) give(P, 'あなた', 'p', amt, base0);
        if(extra!==0) give(E, E.name, 'e', extra, extra);
      } else if(side==='opponent') give(E, E.name, 'e', amt, base0);
      else give(P, 'あなた', 'p', amt, base0);
      if(!LOG_UNIFIED) pushLog(`${c.name}: ${def.desc(amt, c)}`);
    };
  });
  const stepIds = orderedEffectIds(c, PLAYER_EFFECT_ORDER);
  (onlyIds ? stepIds.filter(id=>onlyIds.includes(id)) : stepIds).forEach(id=>{ if(steps[id]) steps[id](); });
}
// カードの効果の処理順（数値の効果と、カード操作 'op:<ID>'）。effectOrder に載っていない効果は従来の順で、カード操作は最後に付く。
function opStepId(o, i){ return 'op:' + (o.id || ('#'+i)); }
function orderedPlayerSteps(c){
  const defaults = defaultEffectOrder(c, PLAYER_EFFECT_ORDER);
  const opIds = cardOpsOf(c).map(opStepId);
  const out = [];
  (Array.isArray(c && c.effectOrder) ? c.effectOrder : []).forEach(id=>{
    if(typeof id!=='string' || out.includes(id)) return;
    if(id.startsWith('op:')){ if(opIds.includes(id)) out.push(id); }
    else if(defaults.includes(id)) out.push(id);
  });
  defaults.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  opIds.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}

// One repetition of a card's effect: its numeric effects plus its card-operation.
function applyCardEffectsOnce(r, c, done){
  // _effectDepth: いまカードの効果を解決している最中か。ドロー・捨て札移動の仕込みは、効果によるものだけ数える
  // （ターン開始時のドロー、カード使用後・ターン終了時の捨て札、敵の行動によるカード操作は数えない）。
  r._effectDepth = (r._effectDepth||0) + 1;
  // カード操作の対象枚数（X）: この効果の中で、直前に行ったカード操作の枚数と合計を、参照増減の参照元として使える
  const prevOpX = r._opX; r._opX = {last:0, total:0};
  const fin = ()=>{ r._opX = prevOpX; r._effectDepth -= 1; firePileTriggers(r, done); };
  const ops = cardOpsOf(c);
  if(!ops.length){ applyEffectValues(r, c); fin(); return; }
  // 数値の効果とカード操作を、効果の順番どおりに1つずつ解決する（カード操作は選択待ちを挟むことがある）
  const steps = orderedPlayerSteps(c);
  let i = 0;
  (function next(){
    if(i>=steps.length || r.enemy.hp<=0 || r.player.hp<=0){ fin(); return; }
    if(!steps[i].startsWith('op:')){
      const group = [];
      while(i<steps.length && !steps[i].startsWith('op:')) group.push(steps[i++]);
      applyEffectValues(r, c, group);
      next(); return;
    }
    const id = steps[i++];
    const op = ops.find((o,k)=> opStepId(o,k)===id);
    if(!op){ next(); return; }
    const tally = {n:0};
    resolveCardOp(r, {...op, _tally:tally}, ()=>{
      r._opX.last = tally.n; r._opX.total += tally.n;
      next();
    });
  })();
}
// カードの効果で、カードを引いた／捨て札に移した出来事を記録する（効果の解決中だけ）
function notePileEvent(r, kind, rawIds){
  if(!r || !r.enemy || !rawIds || !rawIds.length) return;
  (r.pileEvents = r.pileEvents || []).push({kind, ids: rawIds.slice()});
}
// 記録した出来事に応じて、「引いたとき」「捨て札に移ったとき」の仕込みを発動する。
// カードを1枚以上動かした効果1回につき、1回の出来事として数える（3枚引いても1回）。
function firePileTriggers(r, done){
  // 引いた・捨て札に移したカード1枚ごとに、1回の出来事として数える（タグの条件・「何回ごと」もカード1枚ごと）
  const events = [];
  (r.pileEvents || []).forEach(ev=> ev.ids.forEach(id=> events.push({kind:ev.kind, ids:[id]})));
  r.pileEvents = [];
  if(!events.length || !r.activeTriggers || !r.activeTriggers.some(t=>PILE_TRIGGER_KINDS.includes(t.triggerOn))){ done(); return; }
  if((r._pileTrigDepth||0) >= 3){ pushLog('仕込みの連鎖が深すぎるため、発動を打ち切った。'); done(); return; }
  r._pileTrigDepth = (r._pileTrigDepth||0) + 1;
  const fin = ()=>{ r._pileTrigDepth -= 1; done(); };
  let ei = 0;
  (function nextEvent(){
    if(ei>=events.length || r.enemy.hp<=0 || r.player.hp<=0){ fin(); return; }
    const ev = events[ei++];
    const snapshot = r.activeTriggers.filter(t=>t.triggerOn===ev.kind);
    let ti = 0;
    (function nextTrig(){
      if(ti>=snapshot.length){ nextEvent(); return; }
      const t = snapshot[ti++];
      if(!r.activeTriggers.includes(t)){ nextTrig(); return; }
      const tagOk = !tagListOf(t.triggerTag).length || ev.ids.some(id=>{ const cc = cardById(id); return cc && cardMatchesTags(cc, t.triggerTag, t.triggerTagMode); });   // ドロー・捨て札は1枚ごとに判定
      if(tagOk && triggerCountReady(t)){
        pushLog(`${t.cardData.name}: カードを${ev.kind==='drawn' ? '引いた' : '捨て札に移した'}ため発動。`);
        withXValue(r, t.xValue, cb=>applyCardEffects(r, t.cardData, cb), nextTrig);
      } else nextTrig();
    })();
  })();
}

// 複数のカード操作を、並んでいる順に1つずつ解決する（選択画面が出る操作は、選び終わってから次へ）。
function resolveCardOps(r, ops, done){
  let i = 0;
  r._captured = null;   // 取得した効果は、このカードの操作の中だけで有効
  (function next(){
    if(i>=ops.length || (r.enemy && r.enemy.hp<=0) || r.player.hp<=0){ done(); return; }
    resolveCardOp(r, ops[i++], next);
  })();
}

// 使用中のカード自身を、一時的に r._selfPile（1枚だけの山）に置いて解決する。
// 「そのカード自身」を対象にした操作は、この山に対して通常の操作と同じ処理を行う。
// 解決後もこの山に残っているカード（強化・付与・コスト増減で実体のIDが変わっていることがある）を after(rawId) で返す。
// 山札・手札・消滅へ移した場合は山が空になるので、after(null)（行き先はすでに決まっている）。
function runWithSelfCard(r, rawId, run, after){
  const prev = r._selfPile;
  r._selfPile = [rawId];
  run(()=>{
    const left = r._selfPile;
    r._selfPile = prev;
    after(left && left.length ? left[0] : null);
  });
}

// Repeats a card's effect "hits" times. Used when a registered trigger fires later:
// the repeats belong to that one trigger activation, so they don't count as extra card uses.
function applyCardEffects(r, c, done){
  const replays = Math.max(1, (c.hits||1) + scaleBonus(c,'hits'));
  let rep = 0;
  // 仕込みの発動時、カード自身はすでに山の中にある。いま使用中の別のカードを「自身」と取り違えないよう、空にしておく。
  const prevSelf = r._selfPile; r._selfPile = [];
  const fin = ()=>{ r._selfPile = prevSelf; done(); };
  (function step(){
    if(rep>=replays || r.enemy.hp<=0 || r.player.hp<=0){ fin(); return; }
    rep++;
    applyCardEffectsOnce(r, c, ()=>{
      if(r.enemy.hp<=0 || r.player.hp<=0){ fin(); return; }
      step();
    });
  })();
}

// Counts one "use" of a card (play count, tags used this turn) and lets tag-based
// reactions (relics, then previously registered card triggers) fire for it.
function registerCardUse(r, c, done){
  r.cardsPlayedThisTurn = (r.cardsPlayedThisTurn||0) + 1;
  { const cs = r.combatStats = r.combatStats || {played:0, tagsPlayed:[], tagSetsPlayed:[], drawn:0, discarded:0, hitsTaken:0}; cs.played++; const et = effectiveCardTags(c); if(et.length){ cs.tagsPlayed = cs.tagsPlayed.concat(et); cs.tagSetsPlayed = (cs.tagSetsPlayed||[]).concat([et.slice()]); } }
  { const et = effectiveCardTags(c); if(et.length){ r.tagsPlayedThisTurn = (r.tagsPlayedThisTurn||[]).concat(et); r.tagSetsPlayedThisTurn = (r.tagSetsPlayedThisTurn||[]).concat([et.slice()]); } }
  fireRelicTiming(r, 'onTagCardUsed', c);
  fireMatchingTriggers(r, c, done);
}

// Shared "this card is now being used" logic (energy is paid by the caller, once).
// A card that resolves immediately counts as one separate use per hit: each hit
// re-fires tag triggers and adds to the play/tag counts, then resolves one repetition of
// its effect. A card set to "trigger" timing only registers once; its hits multiply
// the effect each time the trigger later fires.
function resolveCardPlayCore(r, c, done){
  // 使用するカードに、使用者が持つ「使用カードの効果補正」状態を上乗せする（使うたび減少するものは、使用が終わってから減らす）
  const mod = applyCardModsTo(c, r.player);
  c = mod.card;
  const finishDone = ()=>{ decayCardMods(r.player, mod.used, 'あなた'); done(); };
  // 予約（仕込み）の登録。発動時の効果は、予約側の発動回数（triggerHits）で繰り返す。コストは消費しない。
  const registerTrigger = cb=>{
    const onKind = cleanTriggerOn(c.triggerOn);
    r.activeTriggers.push({
      triggerTag: c.triggerTag || '', triggerTagMode: cleanTagMode(c.triggerTagMode),
      triggerOn: onKind,
      every: triggerCountEveryOf(c), count: 0,
      armedTurn: r.turnNo || 0,
      triggerBlocked: !!c.triggerBlocked,
      duration: triggerTurns(c)>0 ? 'turn' : 'combat',
      turnsLeft: triggerTurns(c)>0 ? triggerTurns(c) : undefined,
      cardData: triggerCardData(c),
      xValue: r.xValue || 0,
    });
    const ev = triggerCountEveryOf(c);
    pushLog(`${c.name}: 効果を仕込んだ（今後、${triggerWhenShort(c)}${onKind!=='turnStart' && ev>1 ? `、${ev}回に1回` : ''}発動。${triggerDurText(c)}）。`);
    cb();
  };
  if(hasTrigger(c) && !hasImmediate(c)){
    registerCardUse(r, c, ()=> registerTrigger(finishDone));
    return;
  }
  const uses = Math.max(1, (c.hits||1) + scaleBonus(c,'hits'));
  let use = 0;
  const finish = ()=>{
    // 即時＋予約: 即時効果を解決したあとで、同じカードから予約を登録する
    if(hasTrigger(c) && r.enemy.hp>0 && r.player.hp>0) registerTrigger(finishDone);
    else finishDone();
  };
  (function nextUse(){
    if(use>=uses || r.enemy.hp<=0 || r.player.hp<=0){ finish(); return; }
    use++;
    registerCardUse(r, c, ()=>{
      if(r.enemy.hp<=0 || r.player.hp<=0){ finish(); return; }
      applyCardEffectsOnce(r, c, nextUse);
    });
  })();
}

// 自分のターンの開始時に発動する予約。登録したターンは数えず、次のターンの開始から数える（Nターンごとなら、N回目の開始で発動）。
function fireTurnStartTriggers(r, done){
  const list = (r.activeTriggers||[]).filter(t=>t.triggerOn==='turnStart');
  let i = 0;
  (function next(){
    if(i>=list.length || r.enemy.hp<=0 || r.player.hp<=0){ done(); return; }
    const t = list[i++];
    if(!r.activeTriggers.includes(t) || t.armedTurn===(r.turnNo||0)){ next(); return; }
    if(triggerCountReady(t)){
      pushLog(`${t.cardData.name}: ターン開始時に発動。`);
      withXValue(r, t.xValue, cb=>applyCardEffects(r, t.cardData, cb), next);
    } else next();
  })();
}

// 敵の攻撃でダメージを受けたとき発動するトリガー。攻撃1回（多段攻撃なら1ヒット）ごとに発動する。
// ブロックで全部防いだ攻撃は、カードの「ブロックで防いだ場合も発動する」がONのときだけ発動する。
function fireDamageTriggers(r, done){
  const events = r.damageEvents || [];
  r.damageEvents = [];
  if(!events.length || !r.activeTriggers || !r.activeTriggers.some(t=>t.triggerOn==='damaged')){ done(); return; }
  let ei = 0;
  (function nextEvent(){
    if(ei>=events.length){ done(); return; }
    const ev = events[ei++];
    const snapshot = r.activeTriggers.filter(t=>t.triggerOn==='damaged');
    let ti = 0;
    (function nextTrig(){
      if(ti>=snapshot.length){ nextEvent(); return; }
      const t = snapshot[ti++];
      const ok = ev.hpLoss>0 || (t.triggerBlocked && ev.total>0);
      if(ok && triggerCountReady(t)){ pushLog(`${t.cardData.name}: ダメージを受けて発動。`); withXValue(r, t.xValue, cb=>applyCardEffects(r, t.cardData, cb), nextTrig); }
      else nextTrig();
    })();
  })();
}

function fireMatchingTriggers(r, playedCard, done){
  if(!r.activeTriggers || r.activeTriggers.length===0){ done(); return; }
  // Snapshot first: resolving a trigger can itself register new triggers (e.g. via a
  // chained "play" cardOp), and those shouldn't fire again within this same pass.
  const snapshot = r.activeTriggers.slice();
  let idx = 0;
  (function next(){
    if(idx>=snapshot.length){ done(); return; }
    const trig = snapshot[idx++];
    if(trig.triggerOn!=='cardUsed'){ next(); return; }
    const tagOk = cardMatchesTags(playedCard, trig.triggerTag, trig.triggerTagMode);
    if(tagOk && triggerCountReady(trig)) withXValue(r, trig.xValue, cb=>applyCardEffects(r, trig.cardData, cb), next);
    else next();
  })();
}


/* ============================= EDITOR TOOLS (reorder / duplicate) ============================= */

let reorderMode = false;
// ids = 新しい並び順（同じグループ内のID）。リスト全体の中で、そのグループが占めていた位置にだけ反映する。
function reorderSubset(list, ids){
  const set = new Set(ids);
  const slots = [];
  list.forEach((x,i)=>{ if(set.has(x.id)) slots.push(i); });
  if(slots.length!==ids.length) return list;
  const byId = new Map(list.map(x=>[x.id,x]));
  const out = list.slice();
  slots.forEach((pos,k)=>{ out[pos] = byId.get(ids[k]); });
  return out;
}
function bindReorderGrid(grid, onDrop){
  const wraps = ()=> Array.from(grid.children).filter(n=>n.classList.contains('editor-card-wrap'));
  wraps().forEach(w=>{
    w.addEventListener('pointerdown', ev=>{
      if(ev.pointerType==='mouse' && ev.button!==0) return;
      ev.preventDefault();
      try{ w.setPointerCapture(ev.pointerId); }catch(e){}
      w.classList.add('dragging');
      let moved = false;
      const onMove = e=>{
        moved = true;
        if(e.clientY<70) window.scrollBy(0,-16);
        else if(e.clientY>window.innerHeight-70) window.scrollBy(0,16);
        const under = document.elementsFromPoint(e.clientX, e.clientY)
          .find(n=> n!==w && n.classList && n.classList.contains('editor-card-wrap') && n.parentNode===grid);
        if(!under) return;
        // ドラッグ中の要素 w 自体はDOMから外さない（外すとポインタ追跡が切れて、1回で止まってしまう）。
        // 代わりに、間にある要素を w の反対側へ動かして、w が under を越えた並びにする。
        const kids = wraps();
        const a = kids.indexOf(w), b = kids.indexOf(under);
        if(a<b){
          kids.slice(a+1, b+1).forEach(n=> grid.insertBefore(n, w));
        } else {
          for(let i=a-1;i>=b;i--) grid.insertBefore(kids[i], w.nextSibling);
        }
      };
      const end = ()=>{
        w.removeEventListener('pointermove', onMove);
        w.removeEventListener('pointerup', end);
        w.removeEventListener('pointercancel', end);
        w.classList.remove('dragging');
        try{ w.releasePointerCapture(ev.pointerId); }catch(e){}
        if(moved) onDrop(wraps().map(x=>x.dataset.id));
      };
      w.addEventListener('pointermove', onMove);
      w.addEventListener('pointerup', end);
      w.addEventListener('pointercancel', end);
    });
  });
}
// getList/setList: そのデータの配列を読み書きする（setListは保存まで行う）
// rerender: 画面の描き直し／dup(copy): 複製データを整える（新しいIDなどを付けて返す）
function bindEditorTools(o){
  const screen = qs('.screen');
  if(screen){
    screen.classList.toggle('reorder-on', reorderMode);
    if(!qs('.reorder-hint', screen)){
      const hint = el('<p class="reorder-hint">並べ替えモード：カードをドラッグして順番を入れ替えます（同じ区分の中で移動できます）。</p>');
      const tb = qs('.topbar', screen);
      if(tb) tb.insertAdjacentElement('afterend', hint);
    }
  }
  const btn = qs('#btn-reorder');
  if(btn){
    btn.textContent = reorderMode ? '並べ替えを終了' : '並べ替え';
    btn.classList.toggle('active', reorderMode);
    btn.onclick = ()=>{ reorderMode = !reorderMode; o.rerender(); };
  }
  qsa('.dup-btn').forEach(b=>{
    b.onclick = ()=>{
      const id = b.closest('.editor-card-wrap').dataset.id;
      const list = o.getList();
      const i = list.findIndex(x=>x.id===id);
      if(i<0) return;
      const copy = o.dup(JSON.parse(JSON.stringify(list[i])));
      const out = list.slice();
      out.splice(i+1, 0, copy);
      o.setList(out);
      o.rerender();
    };
  });
  if(reorderMode){
    qsa('.editor-grid').forEach(grid=> bindReorderGrid(grid, ids=>{
      o.setList(reorderSubset(o.getList(), ids));
      o.rerender();
    }));
  }
}

  function renderMoveList(){

    box.innerHTML = en.deck.map((entry,i)=>{
      const c = cardById(entry.cardId);
      return `<div style="display:flex; gap:6px; align-items:center; margin-bottom:4px;" data-idx="${i}">
        <span style="flex:2; font-size:13px;">${c?c.name:'（不明なカード）'}</span>
        <span style="font-size:10px; color:var(--parchment-dim);">重み</span>

        <button class="em-move-remove" type="button">削除</button>
      </div>`;
    }).join('');
    qsa('.em-move-weight-edit',box).forEach(inp=>{
      inp.onchange = ()=>{
        const i = parseInt(inp.closest('[data-idx]').dataset.idx,10);
        en.deck[i].weight = clampInt(inp.value,1,20,1);
      };
    });
    qsa('.em-move-remove',box).forEach(btn=>btn.onclick=()=>{
      const i = parseInt(btn.closest('[data-idx]').dataset.idx,10);

      renderMoveList();

      const pick = qs('#em-move-pick',overlay);

      const weight = clampInt(qs('#em-move-weight',overlay).value,1,20,1);
      const existing = en.deck.find(x=>x.cardId===pick.value);

      renderMoveList();

  function forcedRowHTML(rule, i){
    const subj = FORCED_SUBJECTS.find(s=>s.key===rule.subject) || FORCED_SUBJECTS[0];
    const cmpLabels = FORCED_CMP_LABELS[subj.key==='turn' ? 'turn' : 'val'];
    let statOpts = [], selKey = '';
    if(subj.tag){
      statOpts = statSelectOptions();
      if(!rule.tag && statOpts.length) rule.tag = statOpts[0].key;   // 画面に出る初期選択と中身を合わせる
      selKey = statSelectKey(rule.tag);
      if(rule.tag && !statOpts.some(o=>o.key===selKey)) statOpts.push({key:selKey, label: requirementStatLabel(rule.tag, rule.tagMode) || '（削除された状態）'});
    }
    return `<div class="ev-eff" data-idx="${i}">
      <div class="ev-eff-head"><span>確定行動 ${i+1}</span><button type="button" class="ghost em-forced-del">削除</button></div>

      ${subj.tag ? `<div class="field"><label>状態（組み込みの強化・弱体・毒など／カスタム状態／タグの合計）</label><select data-f="tag">${statOpts.map(o=>`<option value="${escapeHtml(o.key)}" ${o.key===selKey?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>${statIsMulti(rule.tag) ? tagPairHTML('field', '<label>状態のタグ（複数指定可・, 、 区切り）</label>', 'data-f="tagsText"', String(rule.tag).slice(5), 'data-f="tagMode"', rule.tagMode) : ''}` : ''}
      <div class="ev-eff-grid">
        <div><label>比較</label><select data-f="cmp">${subj.cmps.map(k=>`<option value="${k}" ${rule.cmp===k?'selected':''}>${cmpLabels[k]}</option>`).join('')}</select></div>
        <div><label>${subj.unit}</label><input type="number" data-f="value" data-num="1" value="${rule.value|0}" min="0" max="9999"></div>
      </div>
      <div class="field" style="margin-top:8px;"><label>確定させる行動（カード）</label><select data-f="cardId">
        ${movePool.map(c=>`<option value="${c.id}" ${c.id===rule.cardId?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="checkbox-field"><input type="checkbox" id="em-forced-once-${i}" data-f="once" ${rule.once?'checked':''}><label for="em-forced-once-${i}">この戦闘で一度だけ</label></div>
      <div class="field" style="margin-top:8px;"><label>連続行動と同じ予告で重なったとき</label><select data-f="conflict">
        ${Object.keys(CONFLICT_LABELS).map(k=>`<option value="${k}" ${(rule.conflict||'priority')===k?'selected':''}>${CONFLICT_LABELS[k]}</option>`).join('')}</select></div>
    </div>`;
  }
  function renderForcedList(){
    const box = qs('#em-forced-list',overlay);

  (function(){

      const row = t.closest && t.closest('[data-idx]');
      const f = t.dataset && t.dataset.f;
      if(!row || !f) return false;
      const rule = en.forcedMoves[parseInt(row.dataset.idx,10)];
      if(!rule) return false;
      if(f==='tagsText'){ rule.tag = 'tags:' + t.value; return true; }
      if(t.type==='checkbox') rule[f] = t.checked;
      else if(t.dataset.num){ const v = parseInt(t.value,10); rule[f] = isNaN(v) ? 0 : v; }
      else rule[f] = t.value;
      return true;
    };
    box.addEventListener('input', e=>{ sync(e.target); });
    box.addEventListener('change', e=>{
      if(!sync(e.target)) return;
      if(e.target.dataset.f==='tag'){ renderForcedList(); return; }
      if(e.target.dataset.f==='subject'){
        const rule = en.forcedMoves[parseInt(e.target.closest('[data-idx]').dataset.idx,10)];
        const subj = FORCED_SUBJECTS.find(s=>s.key===rule.subject) || FORCED_SUBJECTS[0];

      }

function customStatusUsage(statusId){
  const key = 'cs_'+statusId;
  const cardIds = S.cards.filter(c=>
    (c[key]) || (c['csX_'+statusId]) || (c['dw_'+key]) || (c['dw_csX_'+statusId]) || (c['ex_'+key]) || (c['ex_csX_'+statusId]) || (c.scales && c.scales[key]) || (c.upgrades && (c.upgrades[key] || (c.upgrades.scalePP && c.upgrades.scalePP[key])))
    || cardOpsOf(c).some(o=>o.type==='grantBuff' && o.buffField===key)
    || Object.values(c.scales||{}).some(sc=> sc && (sc.source==='csSelf:'+statusId || sc.source==='csEnemy:'+statusId))
  ).map(c=>c.id);
  const relicIds = S.relics.filter(rel=> rel.effect && rel.effect[key]).map(rel=>rel.id);
  return {cardIds, relicIds};
}
function stripCustomStatusRefs(statusId){
  const key = 'cs_'+statusId;
  S.cards.forEach(c=>{
    delete c[key]; delete c['csT_'+statusId]; delete c['csX_'+statusId];
    delete c['dw_'+key]; delete c['dw_csT_'+statusId]; delete c['dw_csX_'+statusId];
    delete c['ex_'+key]; delete c['ex_csT_'+statusId]; delete c['ex_csX_'+statusId];
    if(c.scales){
      delete c.scales[key];
      Object.keys(c.scales).forEach(f=>{ const sc = c.scales[f]; if(sc && (sc.source==='csSelf:'+statusId || sc.source==='csEnemy:'+statusId)) delete c.scales[f]; });
    }
    if(c.upgrades){ delete c.upgrades[key]; if(c.upgrades.scalePP) delete c.upgrades.scalePP[key]; }
    if(Array.isArray(c.cardOps)) c.cardOps = c.cardOps.filter(o=>!(o && o.buffField===key && o.type==='grantBuff'));
    if(c.cardOp && c.cardOp.buffField===key){ c.cardOp.enabled = false; }
  });
  saveCards(S.cards);
  S.relics.forEach(rel=>{ if(rel.effect) delete rel.effect[key]; });
  saveRelics(S.relics);
}

          enemyIds: (S.enemies||[]).filter(en=>(en.elementMods||[]).some(m=>m.element===id)).map(en=>en.id)};
}

function openElementModal(el, isNew){
  const e = {...el};
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <h3>${isNew ? '属性を新規作成' : '属性を編集'}</h3>
    <div class="field"><label>属性の名前</label><input type="text" id="elm-name" value="${escapeHtml(e.name)}" maxlength="20"></div>
    <div class="field"><label>エフェクトの絵文字（この属性の攻撃を受けたときに光の中に出る。空欄ならなし）</label><input type="text" id="elm-emoji" value="${escapeHtml(e.emoji||'')}" maxlength="4"></div>
    <div class="checkbox-field"><input type="checkbox" id="elm-usecolor" ${e.color?'checked':''}><label for="elm-usecolor">エフェクトの色を指定する（オフなら、通常ダメージの色）</label></div>

    <div class="section-label">特殊効果</div>
    ${ELEMENT_PROP_DEFS.map(def=> def.type==='list'
      ? `<div class="field"><label>${escapeHtml(def.label)}</label><div id="elm-list-${def.key}"></div><button type="button" class="ghost" id="elm-listadd-${def.key}">＋ 追加</button><p class="hint">${escapeHtml(def.hint)}</p></div>`
      : `<div class="field"><label>${escapeHtml(def.label)}</label><input type="number" id="elm-prop-${def.key}" value="${(e.props||{})[def.key]||0}" min="${def.min}" max="${def.max}" step="1"><p class="hint">${escapeHtml(def.hint)}</p></div>`).join('')}
    <div class="modal-actions"><button class="ghost" id="elm-cancel">キャンセル</button><button class="primary" id="elm-save">保存する</button></div>
  </div>`;
  document.body.appendChild(overlay);
  // 行を並べて編集する特殊効果（type:'list'）
  const rowLists = {};
  ELEMENT_PROP_DEFS.filter(d=>d.type==='list').forEach(def=>{
    rowLists[def.key] = (Array.isArray((e.props||{})[def.key]) ? e.props[def.key] : []).map(x=>({...x}));
    const box = qs('#elm-list-'+def.key, overlay);
    const render = ()=>{ box.innerHTML = rowLists[def.key].length ? rowLists[def.key].map((row,i)=>def.rowHTML(row,i)).join('') : '<p class="hint">なし</p>'; };
    render();
    const rowOf = t=>{ const r = t.closest && t.closest('[data-idx]'); return r ? rowLists[def.key][parseInt(r.dataset.idx,10)] : null; };
    box.addEventListener('input', ev=>{ const row = rowOf(ev.target), f = ev.target.dataset && ev.target.dataset.f; if(row && f && ev.target.tagName!=='SELECT') row[f] = ev.target.value; });
    box.addEventListener('change', ev=>{ const row = rowOf(ev.target), f = ev.target.dataset && ev.target.dataset.f; if(row && f) row[f] = ev.target.value; });
    box.addEventListener('click', ev=>{ const b = ev.target.closest('.elm-row-del'); if(!b) return; rowLists[def.key].splice(parseInt(b.closest('[data-idx]').dataset.idx,10),1); render(); });
    qs('#elm-listadd-'+def.key, overlay).onclick = ()=>{ if(rowLists[def.key].length>=6) return; rowLists[def.key].push(def.newRow()); render(); };
  });
  qs('#elm-cancel',overlay).onclick = ()=> overlay.remove();
  qs('#elm-save',overlay).onclick = ()=>{
    const name = qs('#elm-name',overlay).value.trim();
    if(!name){ alert('名前を入力してください。'); return; }
    const props = {...(e.props||{})};
    ELEMENT_PROP_DEFS.forEach(def=>{
      if(def.type==='list'){ const v = def.clean(rowLists[def.key]); if(v.length) props[def.key] = v; else delete props[def.key]; return; }
      const v = clampInt(qs('#elm-prop-'+def.key,overlay).value, def.min, def.max, 0);
      if(v>0) props[def.key] = v; else delete props[def.key];
    });
    const updated = {...e, name, props, tags: parseTags(qs('#elm-tags',overlay).value), color: qs('#elm-usecolor',overlay).checked ? qs('#elm-color',overlay).value : '', emoji: (qs('#elm-emoji',overlay).value||'').trim().slice(0,4)};
    if(isNew) S.elements.push(updated); else S.elements = S.elements.map(x=> x.id===updated.id ? updated : x);
    saveElements(S.elements); overlay.remove(); renderElementEditor();
  };
}

// A status's card-operation is restricted to configurations that resolve at the start of
// the player's turn (no "play for free" types, which could chain into further plays).
const STATUS_CARDOP_TYPES = CARDOP_TYPES;   // カード効果のカード操作と同じ種類・同じ設定項目

function newStatusEffect(kind){
  const e = {kind, magnitudeMode:'fixed', magnitudeValue:1};
  if(kind==='cardOp') e.op = defaultStatusOp();
  if(ELEMENT_KINDS.includes(kind)) e.element = 'all';
  if(ELEMENT_ATTACH_KINDS.includes(kind)) e.element = ((S.elements||[])[0]||{}).id || '';
  if(kind==='revive'){ e.reviveUnit = 'percent'; e.magnitudeValue = 30; }
  if(kind==='cardMod'){ e.modField = 'damage'; e.modTag = ''; e.modTagMode = 'any'; e.decayOnUse = false; e.decayN = 1; }
  return e;
}
function statusEffectLabel(kind){
  if(kind==='cardOp') return 'カード操作（プレイヤーのデッキを操作する）';
  return (CUSTOM_STATUS_KINDS.find(k=>k.key===kind)||{}).label || kind;
}
function statusEffectShort(eff){
  if(eff.kind==='cardOp'){
    const t = (STATUS_CARDOP_TYPES.find(x=>x.key===(eff.op||{}).type)||{}).label || '';
    return `カード操作（${t}）`;
  }
  return statusEffectLabel(eff.kind).replace(/（.*$/,'');
}

  return `<div class="ev-eff">

}

      <div class="section-label">排他（付与のときの、他の状態との共存ルール）</div>

      <div class="field"><label>② これらのタグの状態が付与されている間は、自分を付与しない（カンマ区切り）</label><input type="text" id="sm-excl-yield" value="${escapeHtml((st.exclYield||[]).join(', '))}" placeholder="例: 強化">
        <p class="hint">組み込みの強化・器用・弱体・脆弱・毒・再生・麻痺・自動ブロック・棘も、同名のタグとして指定できます（永続の強化・器用などは①の取り除きの対象外）。自分自身のタグは数えないので、全部の状態に同じタグを付けて、自分にも同じタグを指定しても、同じ状態は重ね掛けできます。判定は付与のときだけで、ターンごとの増減では働きません。②は①より先に判定します。</p></div>
      <div class="field"><label>③ これらのタグの状態が後から付与されたら、自分が消える（カンマ区切り）</label><input type="text" id="sm-excl-replaced" value="${escapeHtml((st.exclReplaced||[]).join(', '))}" placeholder="例: 属性"></div>
      <div class="field"><label>④ 自分がいる間、これらのタグの状態の付与を無効にする（カンマ区切り）</label><input type="text" id="sm-excl-guard" value="${escapeHtml((st.exclGuard||[]).join(', '))}" placeholder="例: 脆弱">
        <p class="hint">③④は、組み込みの状態（強化・弱体・脆弱など）が付与されるときにも働きます。例: ④に「脆弱」を入れると、この状態がある間は脆弱を受けません。複数が重なるときの判定の順は、④（守る）→②（先着に負ける）→①（上書きする）→付与→③（後から上書きされる）です。</p></div>
      <p class="hint">カード操作は、この状態を持っている側のデッキへ、ターン開始時（手札を引いた後）に行われます。敵が持つ場合は視点が反転し、敵自身のデッキへ作用します（「敵のデッキに加える」だけはプレイヤーの山札）。いくつでも追加できます。</p>
      <div class="modal-actions">
        <button class="ghost" id="sm-cancel">キャンセル</button>
        <button class="primary" id="sm-save">保存する</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const box = qs('#sm-effects', overlay);
  function renderEffects(){
    box.innerHTML = st.effects.length
      ? st.effects.map(statusEffectFormHTML).join('')
      : `<p class="ev-hint">効果がありません（下のメニューから追加してください）。</p>`;
  }
  function sync(t){
    const f = t.dataset && t.dataset.f;
    if(!f) return;
    const eff = st.effects[parseInt(t.dataset.i,10)];
    if(!eff) return;
    const obj = t.dataset.op ? eff.op : eff;
    if(t.dataset.num){ const v = t.dataset.num==='float' ? parseFloat(t.value) : parseInt(t.value,10); obj[f] = isNaN(v) ? 0 : v; }
    else if(t.dataset.valuemode) obj[f] = t.checked ? 'targetCount' : 'fixed';
    else if(t.type==='checkbox') obj[f] = t.checked;
    else obj[f] = t.value;
  }
  box.addEventListener('input', e=>{
    if(e.target.dataset && e.target.dataset.gf){ const g = (st.effects[+e.target.dataset.i]||{}).reviveGrants||[]; if(g[+e.target.dataset.j]) g[+e.target.dataset.j].stacks = Math.max(1, Math.min(99, parseInt(e.target.value,10)||1)); return; }
    sync(e.target);
  });
  box.addEventListener('change', e=>{
    sync(e.target);
    if(e.target.dataset && e.target.dataset.rerender) renderEffects();
  });
  box.addEventListener('click', e=>{
    const ag = e.target.closest('[data-addgrant]');
    if(ag){
      const i = +ag.dataset.addgrant, eff = st.effects[i];
      const sel = box.querySelector(`select[data-grantpick="${i}"]`);
      if(eff && sel && sel.value){ (eff.reviveGrants = eff.reviveGrants||[]).push({statusId:sel.value, stacks:1}); renderEffects(); }
      return;
    }
    const dg = e.target.closest('[data-delgrant]');
    if(dg){
      const [i,j] = dg.dataset.delgrant.split(':').map(Number);
      const eff = st.effects[i]; if(eff && eff.reviveGrants){ eff.reviveGrants.splice(j,1); renderEffects(); }
      return;
    }
    const b = e.target.closest('[data-del]');
    if(!b) return;
    st.effects.splice(parseInt(b.dataset.del,10),1);
    renderEffects();
  });
  qs('#sm-addbtn',overlay).onclick = ()=>{
    st.effects.push(newStatusEffect(qs('#sm-addkind',overlay).value));
    renderEffects();
  };
  qs('#sm-addop',overlay).onclick = ()=>{
    st.effects.push(newStatusEffect('cardOp'));
    renderEffects();
  };
  renderEffects();
  qs('#sm-cancel',overlay).onclick = ()=> overlay.remove();
  bindTagPairs(overlay);
  qs('#sm-save',overlay).onclick = ()=>{
    const updated = normalizeCustomStatus({
      id: st.id,
      tags: parseTags(qs('#sm-tags',overlay).value),
      name: qs('#sm-name',overlay).value.trim() || '無名の状態',
      emoji: (qs('#sm-emoji',overlay).value||'').trim(),
      color: qs('#sm-usecolor',overlay).checked ? qs('#sm-color',overlay).value : '',
      target: qs('#sm-target',overlay).value,
      perTurnDelta: clampInt(qs('#sm-perturndelta',overlay).value,-99,99,0),
      persistent: qs('#sm-persistent',overlay).checked,
      exclOverwrite: parseTags(qs('#sm-excl-overwrite',overlay).value),
      exclYield: parseTags(qs('#sm-excl-yield',overlay).value),
      exclReplaced: parseTags(qs('#sm-excl-replaced',overlay).value),
      exclGuard: parseTags(qs('#sm-excl-guard',overlay).value),
      effects: st.effects,
    });
    if(isNew){ S.customStatuses.push(updated); }
    else{ S.customStatuses = S.customStatuses.map(x=> x.id===updated.id? updated : x); }
    saveCustomStatuses(S.customStatuses);
    overlay.remove();
    renderStatusEditor();
  };
}

function relicEffectFieldsHTML(timing, effect){

}

}

// 山札から引いたとき（dw）／消滅したとき（ex）の効果の編集欄。本体の効果とは別の、同じ種類の数値効果の組
const PILE_EFFECT_KINDS = {
  dw:{title:'ドロー時効果（本体の効果とは別に、山札から引いた瞬間に発動）', name:'ドロー時効果', hint:'使わなくても、手札に引いた時点で発動します。カスタム状態の付与も選べます（付与先も指定可）。参照増減・カード操作・発動回数は使えません。', defs:()=>drawEffectFieldDefs()},
  ex:{title:'消滅時効果（本体の効果とは別に、このカードが消滅した瞬間に発動）', name:'消滅時効果', hint:'このカードが消滅した時点で発動します（使用後の消滅・カード操作による消滅のどちらでも。「デッキから完全に取り除く」場合も発動します）。カスタム状態の付与も選べます（付与先も指定可）。参照増減・カード操作・発動回数は使えません。', defs:()=>exhaustEffectFieldDefs()},
};
function pileEffectSectionHTML(c, kind){
  const P = PILE_EFFECT_KINDS[kind], pre = kind+'_';
  return `<div class="section-label">${P.title}</div>
      <p class="hint">${P.hint}</p>
      ${fxPickerHTML(kind,P.name)}
      ${P.defs().map(def=>{
        const id = def._statusId;
        const dwT = id && ['self','opponent','both'].includes(c[pre+'csT_'+id]) ? c[pre+'csT_'+id] : 'default';
        const dwX = id ? ((c[pre+'csX_'+id])|0) : 0;
        const on = (c[def.key]||0)!==0 || (id && (dwT!=='default' || dwX!==0));
        const st = id ? (S.customStatuses||[]).find(x=>x.id===id) : null;
        const std = st && st.target==='opponent' ? '相手' : '自分';
        const csExtra = id ? `
        <div style="margin-bottom:4px;"><span style="font-size:10px; color:var(--parchment-dim);">付与先：</span>
          <select id="m-${kind}cst-${id}" style="width:auto; display:inline-block;">
            <option value="default" ${dwT==='default'?'selected':''}>状態の標準（${std}）</option>
            <option value="self" ${dwT==='self'?'selected':''}>自分に付与</option>
            <option value="opponent" ${dwT==='opponent'?'selected':''}>相手に付与</option>
            <option value="both" ${dwT==='both'?'selected':''}>自分と相手の両方に付与（量を別々に設定）</option>
          </select>
          <span class="dw-both-note" style="font-size:10px; color:var(--parchment-dim); ${dwT==='both'?'':'display:none;'}">下の値＝自分への量</span></div>
        <div class="dw-both-box" style="margin-bottom:6px; ${dwT==='both'?'':'display:none;'}">
          <div style="font-size:10px; color:var(--parchment-dim); margin-bottom:2px;">相手への量</div>
          <input type="number" id="m-${kind}csx-${id}" value="${dwX}" min="-99" max="99">
        </div>` : '';
        return `
      <div class="field fx-row" data-group="${kind}" data-fx="${escapeHtml(def.key)}" data-label="${escapeHtml(def.label)}" style="${on?'':'display:none;'}">
        <div style="display:flex; justify-content:space-between; align-items:center;"><label>${escapeHtml(def.label)}</label><button type="button" class="ghost fx-del">削除</button></div>${csExtra}
        <input type="number" id="m-${def.key}" value="${c[def.key]||0}" min="${def.min!==undefined?def.min:0}" max="${def.max}">
      </div>`;}).join('')}`;
}

/* ============================= RUN / BATTLE LOGIC ============================= */

function buildStartingDeck(){
  const deck = [];
  S.cards.forEach(c=>{
    if(isNonRewardCard(c)) return;
    for(let i=0;i<(c.startingCount||0);i++) deck.push(c.id);
  });
  if(deck.length===0){ // fallback safety
    deck.push('strike','strike','strike','defend','defend');
  }
  return deck;
}

// focusTag: cards carrying this tag get a much higher weight. onlyFocus: restrict the pool
// to tagged cards entirely (when any exist), used to guarantee at least one targeted card.
// Extra appearance weight (in %) per tag. Two sources, added together:
//  - cards obtained during this run (starting deck excluded), when the setting is on
//  - relics that name a favoured tag (always active while the relic is owned)
function tagBonusPctMap(){
  const map = {}, r = S.run;
  if(!r) return map;
  if(S.settings.tagAffinityEnabled){
    const per = S.settings.tagAffinityPct||0;
    const exType = S.settings.tagAffinityExcludeType!==false, exCost = S.settings.tagAffinityExcludeCost!==false;   // 項目のない古い設定は、外す側
    const exList = tagListOf(S.settings.tagAffinityExclude);
    const typeNames = Object.values(TYPE_TAG_NAME);
    const skip = t=> exList.includes(t) || (exType && typeNames.includes(t)) || (exCost && /^コスト(\d+|X)$/.test(t));
    (r.acquiredCardIds||[]).forEach(id=>{
      const c = S.cards.find(x=>x.id===id);
      effectiveCardTags(c).forEach(t=>{ if(!skip(t)) map[t] = (map[t]||0) + per; });
    });
  }
  ((r.player && r.player.relics) || []).forEach(rid=>{
    const rel = S.relics.find(x=>x.id===rid);
    const ft = rel ? tagListOf(rel.favorTag) : [];
    if(ft.length===1 && rel.favorPct>0) map[ft[0]] = (map[ft[0]]||0) + rel.favorPct;   // 複数タグの指定は tagBonusRules で扱う
  });
  return map;
}
// 複数タグを指定したレリックの出現率ボーナス。1枚のカードにつき、条件に合えば1回だけ加算する（any＝どれか1つ／all＝すべて持つ）。
function tagBonusRules(){
  const out = [], r = S.run;
  if(!r) return out;
  ((r.player && r.player.relics) || []).forEach(rid=>{
    const rel = S.relics.find(x=>x.id===rid);
    const ft = rel ? tagListOf(rel.favorTag) : [];
    if(ft.length>1 && rel.favorPct>0) out.push({tags:ft, mode:cleanTagMode(rel.favorTagMode), pct:rel.favorPct});
  });
  return out;
}
function noteCardAcquired(r, cardId){
  if(!r.acquiredCardIds) r.acquiredCardIds = [];
  r.acquiredCardIds.push(cardId);
}
function weightedPickCard(excludeIds, focusTag, onlyFocus, rarePct){
  let pool = S.cards.filter(c=> c.rarity!=='basic' && !isNonRewardCard(c) && !excludeIds.includes(c.id));
  if(focusTag && onlyFocus){
    const tagged = pool.filter(c=>cardHasTag(c, focusTag));
    if(tagged.length) pool = tagged;
  }
  if(pool.length===0) return null;
  const bonus = tagBonusPctMap(), rules = tagBonusRules();
  const weightOf = (c)=>{
    const pct = effectiveCardTags(c).reduce((sum,t)=> sum + (bonus[t]||0), 0) + rules.reduce((sum,x)=> sum + (cardMatchesTags(c, x.tags, x.mode) ? x.pct : 0), 0);
    return (RARITY_WEIGHT[c.rarity]||10) * (c.rarity==='common' || rarePct===undefined ? 1 : rarePct/100) * ((focusTag && cardHasTag(c, focusTag)) ? 8 : 1) * (1 + pct/100);
  };
  const total = pool.reduce((sum,c)=> sum + weightOf(c), 0);
  let x = Math.random()*total;
  for(const c of pool){
    x -= weightOf(c);
    if(x<=0) return c;
  }
  return pool[pool.length-1];
}

function threeRewardCards(){
  const picks = [];
  const used = [];
  for(let i=0;i<3;i++){
    const c = weightedPickCard(used);
    if(!c) break;
    picks.push(c); used.push(c.id);
  }
  return picks;
}

// Card-reward choices (ids). With a focus tag the first slot is guaranteed to be a
// tagged card (if one exists) and the rest are weighted heavily toward it.
function generateRewardChoices(r, focusTag){
  const bst = r.rewardBoost;
  const n = 3 + (r.player.extraRewardChoices||0) + (bst ? bst.extra : 0);
  const ids = [], used = [];
  const upPct = relicUsePassive(r, ['rewardUpgradePct']).rewardUpgradePct;   // レリック: 報酬のカードが強化済みで出る確率
  for(let i=0;i<n;i++){
    const c = weightedPickCard(used, focusTag, !!focusTag && i===0, bst ? bst.rarePct : undefined);
    if(!c) break;

function generateShopOffers(count){

// A reroll token is spent first; otherwise the gold price is paid. Returns false if unaffordable.

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Draws 3 cards (weighted, without replacement) from the enemy's deck, then picks 1 of
// those 3 (weighted again) to actually be played. The result is stored as e.nextMoveId
// so it can be shown as the intent *before* the enemy's turn resolves, then executed
// unchanged when the turn comes — the roll happens once per decision, not once per look.
function weightedPickFrom(entries){
  const total = entries.reduce((sum,x)=> sum + (x.weight||1), 0);
  let x = Math.random()*total;
  for(const e of entries){ x -= (e.weight||1); if(x<=0) return e; }
  return entries[entries.length-1];
}
// ---- 条件付きの確定行動 ----
// 条件を満たしたとき、通常の抽選の代わりに、指定したカードを次の行動として確定させる。
// 上にあるものほど優先。判定は、敵が次の行動を決めるとき（＝行動を予告するとき）だけ行う。一度予告した行動は、プレイヤーの行動で条件を満たしても変わらない。
const FORCED_SUBJECTS = [
  {key:'turn', label:'敵の行動回数', unit:'回数', cmps:['eq','gte','every']},
  {key:'selfHpPct', label:'敵のHP（最大HPに対する%）', unit:'%', cmps:['lte','gte']},
  {key:'playerHpPct', label:'プレイヤーのHP（最大HPに対する%）', unit:'%', cmps:['lte','gte']},
  {key:'selfBlock', label:'敵のブロック', unit:'ブロック量', cmps:['gte','lte']},
  {key:'playerBlock', label:'プレイヤーのブロック', unit:'ブロック量', cmps:['gte','lte']},
  {key:'selfTag', label:'敵が持つ状態（指定した状態のスタック数）', unit:'スタック数', cmps:['gte','lte','eq'], tag:true},
  {key:'playerTag', label:'プレイヤーが持つ状態（指定した状態のスタック数）', unit:'スタック数', cmps:['gte','lte','eq'], tag:true},
];
const FORCED_CMP_LABELS = {
  turn:{eq:'ちょうどこの回数目の行動', gte:'この回数目以降の行動', every:'この回数ごと（倍数回目）'},
  val:{gte:'以上', lte:'以下', eq:'ちょうど'},
};
function cleanForcedMoves(list){
  return (Array.isArray(list) ? list : []).filter(x=> x && typeof x==='object' && typeof x.cardId==='string' && S.cards.some(c=>c.id===x.cardId)).map(x=>{
    const subj = FORCED_SUBJECTS.find(s=>s.key===x.subject) || FORCED_SUBJECTS[0];
    return {subject:subj.key, cmp: subj.cmps.includes(x.cmp) ? x.cmp : subj.cmps[0], value: clampInt(x.value,0,9999,0),
      tag: cleanStatKey(x.tag), tagMode: cleanTagMode(x.tagMode), cardId:x.cardId, once: !!x.once,
      conflict: CONFLICT_LABELS[x.conflict] ? x.conflict : 'priority'};
  });
}
// ---- 連続行動 ----
// 「この行動が選ばれたら（抽選でも条件でも）、次は必ずこの行動」。選ばれた行動が実行されたあとの次の予告で適用される。
// 条件付きの確定行動と同じ予告で重なったときの扱いは、確定行動ごとに選ぶ。
const CONFLICT_LABELS = {
  priority:'条件の行動を優先する（連続行動は取り消し）',
  ignore:'条件を無視する（連続行動を実行。条件の行動は消費しない）',
  defer:'条件の行動を先送りする（今回は連続行動、次回に条件の行動）',
